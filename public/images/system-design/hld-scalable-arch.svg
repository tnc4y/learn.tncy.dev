<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230">
  <rect width="800" height="230" rx="16" fill="#0f172a"/>
  <text x="400" y="34" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">HIGH-LEVEL DESIGN (HLD): SCALABLE DISTRIBUTED ARCHITECTURE</text>
  <g transform="translate(25,58)" font-family="sans-serif" text-anchor="middle">
    <rect x="0" y="0" width="125" height="125" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="62" y="36" fill="#38bdf8" font-size="13" font-weight="bold">1. Edge / CDN</text>
    <text x="62" y="64" fill="#e2e8f0" font-size="11">DNS + Cloudflare</text>
    <text x="62" y="88" fill="#94a3b8" font-size="10">Static Asset Cache</text>

    <rect x="148" y="0" width="135" height="125" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="215" y="36" fill="#34d399" font-size="13" font-weight="bold">2. Load Balancer</text>
    <text x="215" y="64" fill="#e2e8f0" font-size="11">L7 Nginx / ALB</text>
    <text x="215" y="88" fill="#94a3b8" font-size="10">API Gateway &amp; Rate</text>

    <rect x="306" y="0" width="145" height="125" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="378" y="36" fill="#fbbf24" font-size="13" font-weight="bold">3. Microservices</text>
    <text x="378" y="64" fill="#e2e8f0" font-size="11">Stateless App Tier</text>
    <text x="378" y="88" fill="#94a3b8" font-size="10">gRPC + Kafka Queue</text>

    <rect x="474" y="0" width="130" height="125" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <text x="539" y="36" fill="#f472b6" font-size="13" font-weight="bold">4. Redis Cache</text>
    <text x="539" y="64" fill="#e2e8f0" font-size="11">Distributed LRU</text>
    <text x="539" y="88" fill="#94a3b8" font-size="10">Sub-ms Read Latency</text>

    <rect x="626" y="0" width="125" height="125" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="688" y="36" fill="#c084fc" font-size="13" font-weight="bold">5. Sharded DB</text>
    <text x="688" y="64" fill="#e2e8f0" font-size="11">Primary + Replicas</text>
    <text x="688" y="88" fill="#94a3b8" font-size="10">SQL &amp; NoSQL</text>
  </g>
</svg>