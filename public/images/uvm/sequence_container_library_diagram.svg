<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="700" height="320" fill="#ffffff"/>

  <!-- Item box -->
  <rect x="40" y="40" width="140" height="60" rx="6" fill="#2E86AB" opacity="0.10" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="110" y="65" font-size="12" font-weight="bold" fill="#1a2e3b" text-anchor="middle">reg_transaction</text>
  <text x="110" y="84" font-size="10" fill="#445566" text-anchor="middle">one item</text>

  <!-- Arrow -->
  <line x1="180" y1="70" x2="220" y2="70" stroke="#445566" stroke-width="1.5"/>
  <polygon points="220,70 212,66 212,74" fill="#445566"/>

  <!-- Sequence box (container) -->
  <rect x="220" y="20" width="170" height="100" rx="6" fill="#2E86AB" opacity="0.06" stroke="#2E86AB" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="305" y="42" font-size="12" font-weight="bold" fill="#1a2e3b" text-anchor="middle">reg_sequence</text>
  <text x="305" y="58" font-size="10" fill="#445566" text-anchor="middle">a container of items</text>

  <polygon points="260,75 268,83 260,91 252,83" fill="#2E86AB"/>
  <polygon points="295,75 303,83 295,91 287,83" fill="#2E86AB"/>
  <polygon points="330,75 338,83 330,91 322,83" fill="#2E86AB"/>
  <polygon points="360,100 368,108 360,116 352,108" fill="#2E86AB" opacity="0.5"/>

  <!-- Arrow -->
  <line x1="390" y1="70" x2="430" y2="70" stroke="#445566" stroke-width="1.5"/>
  <polygon points="430,70 422,66 422,74" fill="#445566"/>

  <!-- Library header pill -->
  <rect x="430" y="20" width="248" height="26" rx="9" fill="#fef4ed"/>
  <text x="554" y="38" font-size="11" font-weight="bold" fill="#b35a1f" text-anchor="middle">a real plan has several sequences</text>

  <!-- Sibling sequences in the library, three in a row -->
  <rect x="430" y="58" width="74" height="60" rx="6" fill="#E07B39" opacity="0.09" stroke="#E07B39" stroke-width="1.2"/>
  <text x="467" y="92" font-size="10" font-weight="bold" fill="#1a2e3b" text-anchor="middle">reset_seq</text>

  <rect x="512" y="58" width="78" height="60" rx="6" fill="#E07B39" opacity="0.09" stroke="#E07B39" stroke-width="1.2"/>
  <text x="551" y="86" font-size="10" font-weight="bold" fill="#1a2e3b" text-anchor="middle">read_write</text>
  <text x="551" y="100" font-size="10" font-weight="bold" fill="#1a2e3b" text-anchor="middle">_seq</text>

  <rect x="598" y="58" width="80" height="60" rx="6" fill="#E07B39" opacity="0.09" stroke="#E07B39" stroke-width="1.2"/>
  <text x="638" y="92" font-size="10" font-weight="bold" fill="#1a2e3b" text-anchor="middle">stress_seq</text>

  <!-- Bottom explanatory pills -->
  <rect x="30" y="200" width="310" height="40" rx="4" fill="#eef6fa"/>
  <text x="185" y="216" font-size="10" font-weight="500" fill="#1a6080" text-anchor="middle">one reg_transaction = one operation</text>
  <text x="185" y="231" font-size="10" fill="#1a6080" text-anchor="middle">reg_sequence holds several, generated in body()</text>

  <rect x="360" y="200" width="310" height="40" rx="4" fill="#fef4ed"/>
  <text x="515" y="216" font-size="10" font-weight="500" fill="#b35a1f" text-anchor="middle">different sequences for different scenarios</text>
  <text x="515" y="231" font-size="10" fill="#b35a1f" text-anchor="middle">composed or chosen from later in this tutorial</text>

</svg>
