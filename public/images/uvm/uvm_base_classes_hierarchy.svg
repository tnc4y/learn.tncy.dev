<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <!-- White background -->
  <rect x="0" y="0" width="900" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E86AB">UVM Base Class Hierarchy</text>

  <!-- ============ uvm_void ============ -->
  <rect x="370" y="55" width="160" height="40" rx="4" fill="#2E86AB" fill-opacity="0.10" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="450" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e3b">uvm_void</text>
  <text x="450" y="86" text-anchor="middle" font-size="10" fill="#445566">abstract / empty base</text>

  <!-- connector void -> object -->
  <line x1="450" y1="95" x2="450" y2="120" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="450,120 445,110 455,110" fill="#1a2e3b"/>

  <!-- ============ uvm_object ============ -->
  <rect x="350" y="120" width="200" height="46" rx="4" fill="#2E86AB" fill-opacity="0.10" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="450" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e3b">uvm_object</text>
  <text x="450" y="153" text-anchor="middle" font-size="10" fill="#445566">create, copy, compare, print</text>

  <!-- connector object -> report_object -->
  <line x1="450" y1="166" x2="450" y2="191" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="450,191 445,181 455,181" fill="#1a2e3b"/>

  <!-- branch line object -> transaction (diagonal, routed well clear of report_object box) -->
  <line x1="365" y1="160" x2="155" y2="225" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="155,225 165,221 160,231" fill="#1a2e3b"/>

  <!-- ============ uvm_report_object ============ -->
  <rect x="335" y="191" width="230" height="46" rx="4" fill="#2E86AB" fill-opacity="0.10" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="450" y="209" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e3b">uvm_report_object</text>
  <text x="450" y="224" text-anchor="middle" font-size="10" fill="#445566">uvm_info / uvm_warning / uvm_error</text>

  <!-- connector report_object -> component -->
  <line x1="450" y1="237" x2="450" y2="262" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="450,262 445,252 455,252" fill="#1a2e3b"/>

  <!-- ============ uvm_transaction (left branch, pushed clear of report_object/component) ============ -->
  <rect x="40" y="225" width="230" height="46" rx="4" fill="#E07B39" fill-opacity="0.12" stroke="#E07B39" stroke-width="1.2"/>
  <text x="155" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e3b">uvm_transaction</text>
  <text x="155" y="258" text-anchor="middle" font-size="10" fill="#b35a1f">deprecated as a direct base</text>

  <!-- connector transaction -> sequence_item -->
  <line x1="155" y1="271" x2="155" y2="296" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="155,296 150,286 160,286" fill="#1a2e3b"/>

  <!-- ============ uvm_sequence_item ============ -->
  <rect x="25" y="296" width="260" height="46" rx="4" fill="#E07B39" fill-opacity="0.12" stroke="#E07B39" stroke-width="1.2"/>
  <text x="155" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e3b">uvm_sequence_item</text>
  <text x="155" y="329" text-anchor="middle" font-size="10" fill="#b35a1f">base for user transactions</text>

  <!-- diamond marker on sequence_item box (sample point) -->
  <rect x="143" y="352" width="24" height="24" fill="#E07B39" transform="rotate(45 155 364)"/>

  <!-- ============ uvm_component ============ -->
  <rect x="310" y="262" width="280" height="46" rx="4" fill="#2E86AB" fill-opacity="0.10" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="450" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e3b">uvm_component</text>
  <text x="450" y="295" text-anchor="middle" font-size="10" fill="#445566">hierarchy, phasing, factory</text>

  <!-- connector component -> children (vertical trunk) -->
  <line x1="450" y1="308" x2="450" y2="335" stroke="#1a2e3b" stroke-width="2"/>

  <!-- horizontal distribution bar -->
  <line x1="450" y1="335" x2="450" y2="345" stroke="#1a2e3b" stroke-width="2"/>
  <line x1="310" y1="345" x2="730" y2="345" stroke="#1a2e3b" stroke-width="2"/>

  <!-- drop lines to four component children -->
  <line x1="310" y1="345" x2="310" y2="365" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="310,365 305,355 315,355" fill="#1a2e3b"/>

  <line x1="440" y1="345" x2="440" y2="365" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="440,365 435,355 445,355" fill="#1a2e3b"/>

  <line x1="590" y1="345" x2="590" y2="365" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="590,365 585,355 595,355" fill="#1a2e3b"/>

  <line x1="730" y1="345" x2="730" y2="375" stroke="#2E86AB" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.7"/>
  <polygon points="730,375 725,365 735,365" fill="#2E86AB" fill-opacity="0.7"/>

  <!-- uvm_driver -->
  <rect x="245" y="365" width="130" height="38" rx="4" fill="#2E86AB" fill-opacity="0.10" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="310" y="389" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2e3b">uvm_driver</text>

  <!-- uvm_monitor -->
  <rect x="375" y="365" width="130" height="38" rx="4" fill="#2E86AB" fill-opacity="0.10" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="440" y="389" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2e3b">uvm_monitor</text>

  <!-- uvm_env -->
  <rect x="525" y="365" width="130" height="38" rx="4" fill="#2E86AB" fill-opacity="0.10" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="590" y="389" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2e3b">uvm_env</text>

  <!-- uvm_root (dashed - special singleton, not a typical user-derived child) -->
  <rect x="660" y="375" width="160" height="42" rx="4" fill="#E07B39" fill-opacity="0.12" stroke="#E07B39" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="740" y="393" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a2e3b">uvm_root</text>
  <text x="740" y="407" text-anchor="middle" font-size="9" fill="#b35a1f">implicit top (uvm_top)</text>

  <!-- "..." under driver/monitor/env to indicate more components -->
  <text x="310" y="418" text-anchor="middle" font-size="14" fill="#445566">...</text>
  <text x="440" y="418" text-anchor="middle" font-size="14" fill="#445566">...</text>
  <text x="590" y="418" text-anchor="middle" font-size="14" fill="#445566">...</text>

  <!-- Legend -->
  <line x1="60" y1="475" x2="120" y2="475" stroke="#1a2e3b" stroke-width="2"/>
  <text x="130" y="479" font-size="10" fill="#445566">solid line = direct inheritance (extends)</text>

  <line x1="60" y1="500" x2="120" y2="500" stroke="#2E86AB" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.7"/>
  <text x="130" y="504" font-size="10" fill="#445566">dashed line = special singleton relationship</text>

  <rect x="60" y="520" width="60" height="22" rx="4" fill="#2E86AB" fill-opacity="0.10" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="130" y="535" font-size="10" fill="#445566">structural / utility base class</text>

  <rect x="380" y="520" width="60" height="22" rx="4" fill="#E07B39" fill-opacity="0.12" stroke="#E07B39" stroke-width="1.2"/>
  <text x="450" y="535" font-size="10" fill="#445566">data / transaction-side class</text>

</svg>
