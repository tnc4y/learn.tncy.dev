<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="700" height="300" fill="#ffffff"/>

  <text x="40" y="30" font-size="12" font-weight="bold" fill="#1a2e3b">One run of reg_sequence, started as a default sequence</text>

  <!-- Stage 1: pre_body -->
  <rect x="40" y="50" width="140" height="64" rx="6" fill="#2E86AB" opacity="0.10" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="110" y="74" font-size="12" font-weight="bold" fill="#1a2e3b" text-anchor="middle">pre_body()</text>
  <text x="110" y="92" font-size="10" fill="#1a6080" text-anchor="middle">raise_objection</text>
  <text x="110" y="106" font-size="10" fill="#445566" text-anchor="middle">if starting_phase != null</text>

  <line x1="180" y1="82" x2="220" y2="82" stroke="#445566" stroke-width="1.5"/>
  <polygon points="220,82 212,78 212,86" fill="#445566"/>

  <!-- Stage 2: body -->
  <rect x="220" y="50" width="200" height="64" rx="6" fill="#ffffff" stroke="#1a2e3b" stroke-width="1.2"/>
  <text x="320" y="74" font-size="12" font-weight="bold" fill="#1a2e3b" text-anchor="middle">body()</text>
  <text x="320" y="92" font-size="10" fill="#445566" text-anchor="middle">5 transactions run</text>
  <text x="320" y="106" font-size="10" fill="#445566" text-anchor="middle">start_item / finish_item</text>

  <line x1="420" y1="82" x2="460" y2="82" stroke="#445566" stroke-width="1.5"/>
  <polygon points="460,82 452,78 452,86" fill="#445566"/>

  <!-- Stage 3: post_body -->
  <rect x="460" y="50" width="140" height="64" rx="6" fill="#E07B39" opacity="0.09" stroke="#E07B39" stroke-width="1.2"/>
  <text x="530" y="74" font-size="12" font-weight="bold" fill="#1a2e3b" text-anchor="middle">post_body()</text>
  <text x="530" y="92" font-size="10" fill="#b35a1f" text-anchor="middle">drop_objection</text>
  <text x="530" y="106" font-size="10" fill="#445566" text-anchor="middle">if starting_phase != null</text>

  <!-- Objection count step graph -->
  <text x="40" y="150" font-size="11" font-weight="bold" fill="#445566">run phase objection count</text>

  <line x1="40" y1="230" x2="640" y2="230" stroke="#c8d8e0" stroke-width="0.5"/>

  <!-- step: 0 -> 1 at pre_body, stays 1 through body, -> 0 at post_body -->
  <polyline points="40,210 110,210 110,170 420,170 420,170 530,170 530,210 640,210"
            fill="none" stroke="#2E86AB" stroke-width="2"/>

  <text x="40" y="225" font-size="9" fill="#445566">0</text>
  <text x="20" y="175" font-size="9" fill="#445566">1</text>

  <line x1="110" y1="210" x2="110" y2="230" stroke="#c8d8e0" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="530" y1="210" x2="530" y2="230" stroke="#c8d8e0" stroke-width="0.5" stroke-dasharray="3 3"/>

  <rect x="60" y="244" width="110" height="22" rx="4" fill="#eef6fa"/>
  <text x="115" y="259" font-size="10" font-weight="500" fill="#1a6080" text-anchor="middle">raised here</text>

  <rect x="470" y="244" width="120" height="22" rx="4" fill="#fef4ed"/>
  <text x="530" y="259" font-size="10" font-weight="500" fill="#b35a1f" text-anchor="middle">dropped here</text>

  <rect x="180" y="276" width="340" height="20" rx="4" fill="#f1f1f1"/>
  <text x="350" y="291" font-size="10" fill="#445566" text-anchor="middle">simulation stays alive while the count is above 0</text>

</svg>
