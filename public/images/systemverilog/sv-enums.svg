<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 275" width="660" height="275" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="274" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">SystemVerilog 'enum' ile Güvenli FSM Durum Kodlaması</text>
<g transform="translate(50, 45)">
  <rect x="0" y="0" width="560" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  
  <!-- Enum definition box -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="220" height="170" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="110" y="22" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Tip Güvenli Enum Tanımı</text>
    <text x="15" y="45" font-size="10" font-family="monospace" fill="#0f172a">typedef enum logic [1:0] {</text>
    <text x="25" y="65" font-size="10" font-family="monospace" fill="#15803d">  IDLE  = 2'b00,</text>
    <text x="25" y="85" font-size="10" font-family="monospace" fill="#2563eb">  START = 2'b01,</text>
    <text x="25" y="105" font-size="10" font-family="monospace" fill="#d97706">  EXEC  = 2'b10,</text>
    <text x="25" y="125" font-size="10" font-family="monospace" fill="#dc2626">  DONE  = 2'b11</text>
    <text x="15" y="145" font-size="10" font-family="monospace" fill="#0f172a">} state_t;</text>
    <text x="110" y="162" font-size="9" fill="#64748b" text-anchor="middle">state_t current_state, next_state;</text>
  </g>

  <!-- FSM Transition bubble diagram -->
  <g transform="translate(280, 20)">
    <!-- IDLE -->
    <circle cx="50" cy="50" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="50" y="55" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">IDLE</text>

    <!-- START -->
    <circle cx="190" cy="50" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="190" y="55" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">START</text>

    <!-- EXEC -->
    <circle cx="190" cy="140" r="28" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="190" y="145" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">EXEC</text>

    <!-- DONE -->
    <circle cx="50" cy="140" r="28" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="50" y="145" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">DONE</text>

    <!-- Transition arrows -->
    <path d="M 78 50 L 162 50" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 190 78 L 190 112" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 162 140 L 78 140" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 50 112 L 50 78" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  </g>
</g>

</svg>