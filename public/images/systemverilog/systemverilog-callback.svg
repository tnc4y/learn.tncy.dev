<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; }
      .code-txt { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; }
      .desc-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="760" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="32" class="title">SystemVerilog Testbench Callback Mimarisi</text>
  <text x="30" y="52" class="sub">Sürücü (Driver) Kodunu Bozmadan Test Kancaları (Hooks) ile Hata Enjeksiyonu ve Dinamik Modifikasyon</text>

  <!-- Box 1: Driver Component -->
  <rect x="30" y="75" width="280" height="235" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
  <rect x="30" y="75" width="280" height="32" rx="8 8 0 0" fill="#e0f2fe"/>
  <text x="45" y="96" class="box-title" fill="#0369a1">class Driver</text>

  <text x="45" y="130" class="code-txt" fill="#334155">task send_pkt(Packet pkt);</text>
  <rect x="45" y="140" width="250" height="26" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="55" y="157" class="code-txt" font-weight="bold" fill="#b45309">1. foreach(cbs[i]) cbs[i].pre_send();</text>

  <text x="45" y="190" class="code-txt" fill="#334155">2. vif.drive(pkt); // Asıl Donanım Sürüşü</text>

  <rect x="45" y="205" width="250" height="26" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="55" y="222" class="code-txt" font-weight="bold" fill="#b45309">3. foreach(cbs[i]) cbs[i].post_send();</text>

  <text x="45" y="255" class="code-txt" fill="#334155">endtask</text>
  <text x="45" y="285" class="desc-txt" font-style="italic">Driver kodu sabittir ve asla yeniden derlenmez.</text>

  <!-- Connection Arrow 1: Hook call -->
  <line x1="310" y1="153" x2="430" y2="153" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="370" y="145" class="desc-txt" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">Kanca (Hook)</text>

  <!-- Box 2: Base Callback Class -->
  <rect x="440" y="75" width="290" height="105" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="440" y="75" width="290" height="30" rx="8 8 0 0" fill="#f1f5f9"/>
  <text x="455" y="95" class="box-title" fill="#475569">class DriverCallback (Taban Arayüz)</text>
  <text x="455" y="125" class="code-txt" fill="#64748b">virtual task pre_send(ref Packet pkt);</text>
  <text x="455" y="145" class="code-txt" fill="#64748b">virtual task post_send(Packet pkt);</text>
  <text x="455" y="165" class="desc-txt" font-style="italic">Varsayılan gövdeler boştur (kanca şablonu).</text>

  <!-- Inheritance Arrow -->
  <line x1="585" y1="180" x2="585" y2="205" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="615" y="196" class="desc-txt" font-size="10" font-weight="bold" fill="#16a34a">extends</text>

  <!-- Box 3: Custom Error Injection Callback -->
  <rect x="440" y="210" width="290" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="440" y="210" width="290" height="30" rx="8 8 0 0" fill="#dcfce7"/>
  <text x="455" y="230" class="box-title" fill="#15803d">class ErrorInjectionCallback extends ...</text>
  <text x="455" y="260" class="code-txt" font-weight="bold" fill="#15803d">task pre_send(ref Packet pkt);</text>
  <text x="470" y="280" class="code-txt" fill="#b91c1c">pkt.crc = ~pkt.crc; // Hata Enjeksiyonu!</text>
  <text x="455" y="298" class="code-txt" fill="#15803d">endtask</text>
</svg>