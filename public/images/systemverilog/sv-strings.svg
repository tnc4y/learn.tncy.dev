<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 270" width="660" height="270" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="269" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">SystemVerilog 'string' Veri Tipi Mimarisi ve Yerleşik Metotlar</text>
<g transform="translate(50, 45)">
  <rect x="0" y="0" width="560" height="205" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <!-- String representation -->
  <text x="30" y="30" font-size="12" font-weight="bold" fill="#1e293b">Dinamik Karakter Dizisi Bellek Modeli:</text>
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="50" height="35" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="25" y="22" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">'H'</text>
    <text x="25" y="48" font-size="9" fill="#64748b" text-anchor="middle">[0]</text>

    <rect x="50" y="0" width="50" height="35" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="75" y="22" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">'E'</text>
    <text x="75" y="48" font-size="9" fill="#64748b" text-anchor="middle">[1]</text>

    <rect x="100" y="0" width="50" height="35" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="125" y="22" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">'L'</text>
    <text x="125" y="48" font-size="9" fill="#64748b" text-anchor="middle">[2]</text>

    <rect x="150" y="0" width="50" height="35" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="175" y="22" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">'L'</text>
    <text x="175" y="48" font-size="9" fill="#64748b" text-anchor="middle">[3]</text>

    <rect x="200" y="0" width="50" height="35" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="225" y="22" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">'O'</text>
    <text x="225" y="48" font-size="9" fill="#64748b" text-anchor="middle">[4]</text>

    <text x="270" y="22" font-size="11" fill="#475569">s.len() = 5 Karakter (Dinamik Boyutlanır)</text>
  </g>

  <!-- Method list -->
  <g transform="translate(30, 115)">
    <rect x="0" y="0" width="500" height="75" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="15" y="22" font-size="10" font-weight="bold" fill="#2563eb">• s.len(): Uzunluk döner</text>
    <text x="250" y="22" font-size="10" font-weight="bold" fill="#2563eb">• s.toupper() / s.tolower(): Büyük/Küçük harfe çevirir</text>
    <text x="15" y="45" font-size="10" font-weight="bold" fill="#2563eb">• s.substr(start, end): Alt dizgi çeker</text>
    <text x="250" y="45" font-size="10" font-weight="bold" fill="#2563eb">• s.compare(s2) / s.icompare(s2): Karşılaştırma</text>
    <text x="15" y="65" font-size="10" font-weight="bold" fill="#15803d">• $sformatf("Data: 0x%0h", val): C printf tarzı formatlanmış string döndürür</text>
  </g>
</g>

</svg>