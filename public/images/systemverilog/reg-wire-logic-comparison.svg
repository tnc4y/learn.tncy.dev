<svg height="260" width="640" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="640" height="260" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="26" font-size="18" font-weight="bold" fill="#2E86AB" text-anchor="middle">reg vs wire vs logic</text>
  <text x="320" y="44" font-size="12" fill="#445566" text-anchor="middle">Which driving styles does each type support?</text>

  <!-- Grid outer border -->
  <rect x="40" y="65" width="560" height="180" fill="#ffffff" stroke="#1a2e3b" stroke-width="1" rx="4"/>

  <!-- Header row background -->
  <rect x="40" y="65" width="560" height="45" fill="#2E86AB" fill-opacity="0.08"/>

  <!-- Column headers -->
  <text x="275" y="93" font-size="14" font-weight="bold" fill="#1a6080" text-anchor="middle">reg</text>
  <text x="405" y="93" font-size="14" font-weight="bold" fill="#1a6080" text-anchor="middle">wire</text>
  <text x="535" y="93" font-size="14" font-weight="bold" fill="#1a6080" text-anchor="middle">logic</text>

  <!-- Row labels -->
  <text x="48" y="137" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="start">Procedural blocks</text>
  <text x="48" y="182" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="start">Continuous assign</text>
  <text x="48" y="227" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="start">Multiple drivers</text>

  <!-- Grid lines -->
  <line x1="210" y1="65" x2="210" y2="245" stroke="#c8d8e0" stroke-width="0.5"/>
  <line x1="340" y1="65" x2="340" y2="245" stroke="#c8d8e0" stroke-width="0.5"/>
  <line x1="470" y1="65" x2="470" y2="245" stroke="#c8d8e0" stroke-width="0.5"/>
  <line x1="40" y1="110" x2="600" y2="110" stroke="#c8d8e0" stroke-width="0.5"/>
  <line x1="40" y1="155" x2="600" y2="155" stroke="#c8d8e0" stroke-width="0.5"/>
  <line x1="40" y1="200" x2="600" y2="200" stroke="#c8d8e0" stroke-width="0.5"/>

  <!-- Row 1: Procedural blocks -->
  <rect x="210" y="110" width="130" height="45" fill="#2E86AB" fill-opacity="0.08"/>
  <text x="275" y="137" font-size="12" font-weight="bold" fill="#1a6080" text-anchor="middle">Yes</text>
  <text x="405" y="137" font-size="12" fill="#445566" text-anchor="middle">No</text>
  <rect x="470" y="110" width="130" height="45" fill="#2E86AB" fill-opacity="0.08"/>
  <text x="535" y="137" font-size="12" font-weight="bold" fill="#1a6080" text-anchor="middle">Yes</text>

  <!-- Row 2: Continuous assign -->
  <text x="275" y="182" font-size="12" fill="#445566" text-anchor="middle">No</text>
  <rect x="340" y="155" width="130" height="45" fill="#2E86AB" fill-opacity="0.08"/>
  <text x="405" y="182" font-size="12" font-weight="bold" fill="#1a6080" text-anchor="middle">Yes</text>
  <rect x="470" y="155" width="130" height="45" fill="#2E86AB" fill-opacity="0.08"/>
  <text x="535" y="182" font-size="12" font-weight="bold" fill="#1a6080" text-anchor="middle">Yes</text>

  <!-- Row 3: Multiple drivers -->
  <text x="275" y="227" font-size="12" fill="#445566" text-anchor="middle">No</text>
  <rect x="340" y="200" width="130" height="45" fill="#E07B39" fill-opacity="0.10"/>
  <text x="405" y="227" font-size="12" font-weight="bold" fill="#b35a1f" text-anchor="middle">Yes</text>
  <text x="535" y="227" font-size="12" fill="#445566" text-anchor="middle">No</text>
</svg>
