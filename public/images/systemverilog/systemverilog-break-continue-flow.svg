<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" width="620" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2e3b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="620" height="520" fill="#ffffff"/>

  <text x="310" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E86AB">break and continue in a for loop</text>

  <!-- init box: center x=260 -->
  <rect x="190" y="36" width="140" height="30" rx="4" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <text x="260" y="55" text-anchor="middle" font-size="11" font-weight="500" fill="#1a2e3b">initialization</text>
  <line x1="260" y1="66" x2="260" y2="82" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- condition diamond center (260,112) -->
  <polygon points="260,84 340,112 260,140 180,112" fill="#E07B39" fill-opacity="0.12" stroke="#E07B39" stroke-width="1.2"/>
  <text x="260" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#b35a1f">condition?</text>

  <!-- condition true -->
  <line x1="260" y1="140" x2="260" y2="158" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="268" y="153" font-size="10" fill="#445566">true</text>

  <!-- body statements -->
  <rect x="185" y="160" width="150" height="30" rx="4" fill="#2E86AB" fill-opacity="0.12" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="260" y="179" text-anchor="middle" font-size="11" font-weight="500" fill="#1a6080">body statements</text>
  <line x1="260" y1="190" x2="260" y2="210" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- break? diamond center (260,240) -->
  <polygon points="260,212 340,240 260,268 180,240" fill="#E07B39" fill-opacity="0.12" stroke="#E07B39" stroke-width="1.2"/>
  <text x="260" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#b35a1f">break?</text>

  <!-- exit pill center (530,240): "exit loop" -> w 84 -->
  <rect x="488" y="229" width="84" height="22" rx="9" fill="#fef4ed" stroke="#E07B39" stroke-width="1"/>
  <text x="530" y="244" text-anchor="middle" font-size="10" fill="#b35a1f">exit loop</text>

  <!-- condition false -> exit -->
  <polyline points="340,112 530,112 530,227" fill="none" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="350" y="105" font-size="10" fill="#445566">false</text>

  <!-- break yes -> exit -->
  <line x1="340" y1="240" x2="486" y2="240" stroke="#E07B39" stroke-width="2" marker-end="url(#arr)"/>
  <text x="350" y="258" font-size="10" fill="#445566">yes</text>
  <!-- pill "break: exit now" 10px -> w=107, h=22, centered (414,218) -->
  <rect x="360.5" y="207" width="107" height="22" rx="4" fill="#fef4ed"/>
  <text x="414" y="222" text-anchor="middle" font-size="10" fill="#b35a1f">break: exit now</text>

  <!-- break no -->
  <line x1="260" y1="268" x2="260" y2="290" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="268" y="284" font-size="10" fill="#445566">no</text>

  <!-- continue? diamond center (260,320) -->
  <polygon points="260,292 340,320 260,348 180,320" fill="#2E86AB" fill-opacity="0.12" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="260" y="324" text-anchor="middle" font-size="11" font-weight="500" fill="#1a6080">continue?</text>

  <!-- continue no -->
  <line x1="260" y1="348" x2="260" y2="368" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="268" y="362" font-size="10" fill="#445566">no</text>

  <!-- rest of body -->
  <rect x="185" y="370" width="150" height="30" rx="4" fill="#2E86AB" fill-opacity="0.12" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="260" y="389" text-anchor="middle" font-size="11" font-weight="500" fill="#1a6080">rest of body</text>
  <line x1="260" y1="400" x2="260" y2="428" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- step box -->
  <rect x="185" y="430" width="150" height="30" rx="4" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <text x="260" y="449" text-anchor="middle" font-size="11" font-weight="500" fill="#1a2e3b">step (i++)</text>

  <!-- continue yes -> right, down, into step right edge -->
  <polyline points="340,320 420,320 420,445 337,445" fill="none" stroke="#2E86AB" stroke-width="2" marker-end="url(#arr)"/>
  <text x="350" y="338" font-size="10" fill="#445566">yes</text>
  <!-- pill "continue: jump to step" 10px -> w=148, h=22, centered (504,382) -->
  <rect x="430" y="371" width="148" height="22" rx="4" fill="#eef6fa"/>
  <text x="504" y="386" text-anchor="middle" font-size="10" fill="#1a6080">continue: jump to step</text>

  <!-- loop back: step bottom -> down -> left -> up -> condition left -->
  <polyline points="260,460 260,485 60,485 60,112 178,112" fill="none" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="66" y="300" font-size="10" fill="#445566">next pass</text>
</svg>
