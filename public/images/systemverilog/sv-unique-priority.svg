<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 270" width="660" height="270" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="269" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">unique ve priority İfadelerinin Donanım Sentez Karşılaştırması</text>
<g transform="translate(40, 45)">
  <!-- Left: unique -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="275" height="205" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="137" y="24" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">'unique' (Paralel / Sırasız Donanım)</text>
    <rect x="15" y="38" width="245" height="65" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="25" y="58" font-size="9" font-family="monospace" fill="#1e40af">unique if (sel == 2'b00) out = d0;</text>
    <text x="25" y="74" font-size="9" font-family="monospace" fill="#1e40af">else if   (sel == 2'b01) out = d1;</text>
    <text x="25" y="90" font-size="9" font-family="monospace" fill="#1e40af">else                   out = d2;</text>
    <text x="137" y="125" font-size="10" fill="#334155" text-anchor="middle">• Koşulların karşılıklı ayrık (mutually exclusive) olduğunu garantiler.</text>
    <text x="137" y="145" font-size="10" fill="#334155" text-anchor="middle">• Sentez aracı paralel MUX sentezler (gecikme düşer).</text>
    <text x="137" y="165" font-size="10" fill="#dc2626" font-weight="bold" text-anchor="middle">Birden fazla koşul sağlanırsa SİMÜLASYON UYARISI verir!</text>
    <text x="137" y="188" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Sentez: Paralel MUX Devresi</text>
  </g>

  <!-- Right: priority -->
  <g transform="translate(305, 0)">
    <rect x="0" y="0" width="275" height="205" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="137" y="24" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">'priority' (Öncelikli Zincir Donanım)</text>
    <rect x="15" y="38" width="245" height="65" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="25" y="58" font-size="9" font-family="monospace" fill="#991b1b">priority if (irq_high) grant = 2'b01;</text>
    <text x="25" y="74" font-size="9" font-family="monospace" fill="#991b1b">else if     (irq_mid)  grant = 2'b10;</text>
    <text x="25" y="90" font-size="9" font-family="monospace" fill="#991b1b">else                   grant = 2'b00;</text>
    <text x="137" y="125" font-size="10" fill="#334155" text-anchor="middle">• Koşulların sırayla değerlendirilmesini zorunlu kılar.</text>
    <text x="137" y="145" font-size="10" fill="#334155" text-anchor="middle">• İlk sağlanan koşul kazanır, altındakiler göz ardı edilir.</text>
    <text x="137" y="165" font-size="10" fill="#dc2626" font-weight="bold" text-anchor="middle">Hiçbir koşul sağlanmazsa UYARI üretir!</text>
    <text x="137" y="188" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Sentez: Kademeli Öncelik Kodlayıcı</text>
  </g>
</g>

</svg>