<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 275" width="660" height="275" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="274" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">SystemVerilog IPC: Mailbox, Semaphore ve Event</text>
<g transform="translate(30, 45)">
  <!-- Mailbox -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="95" y="24" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1. Mailbox (Posta Kutusu)</text>
    <rect x="25" y="45" width="140" height="60" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="95" y="68" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">FIFO Veri Kuyruğu</text>
    <text x="95" y="88" font-size="9" fill="#475569" text-anchor="middle">put(pkt) → [ ... ] → get(pkt)</text>
    <text x="95" y="130" font-size="10" fill="#334155" text-anchor="middle">• Üretici (Producer) - Tüketici (Consumer)</text>
    <text x="95" y="150" font-size="10" fill="#334155" text-anchor="middle">• Boşken get() bloklar</text>
    <text x="95" y="170" font-size="10" fill="#334155" text-anchor="middle">• Doluyken put() bekler</text>
    <text x="95" y="195" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Generator → Driver</text>
  </g>

  <!-- Semaphore -->
  <g transform="translate(205, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="95" y="24" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">2. Semaphore (Anahtar / Kilit)</text>
    <rect x="25" y="45" width="140" height="60" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="95" y="68" font-size="10" font-weight="bold" fill="#166534" text-anchor="middle">Kaynak Paylaşımı</text>
    <text x="95" y="88" font-size="9" fill="#475569" text-anchor="middle">sem.get(1) | sem.put(1)</text>
    <text x="95" y="130" font-size="10" fill="#334155" text-anchor="middle">• Ortak veriyoluna aynı anda</text>
    <text x="95" y="150" font-size="10" fill="#334155" text-anchor="middle">tek erişim (MutEx)</text>
    <text x="95" y="170" font-size="10" fill="#334155" text-anchor="middle">• Çakışmaları donanımsız çözer</text>
    <text x="95" y="195" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Paylaşımlı Bellek &amp; Bus</text>
  </g>

  <!-- Event -->
  <g transform="translate(410, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="95" y="24" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">3. Event (Olay Tetikleme)</text>
    <rect x="25" y="45" width="140" height="60" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="95" y="68" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="middle">Sinyalsiz Senkronizasyon</text>
    <text x="95" y="88" font-size="9" fill="#475569" text-anchor="middle">-&gt; e1 | @(e1)</text>
    <text x="95" y="130" font-size="10" fill="#334155" text-anchor="middle">• Bir sürecin bitişini diğerine</text>
    <text x="95" y="150" font-size="10" fill="#334155" text-anchor="middle">anons etmek için</text>
    <text x="95" y="170" font-size="10" fill="#334155" text-anchor="middle">• e1.triggered kalıcı bayrak</text>
    <text x="95" y="195" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">El Sıkışma (Handshake)</text>
  </g>
</g>

</svg>