<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 270" width="660" height="270" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="269" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">SystemVerilog Simülasyonunda Delta Döngüleri (Delta Cycles / #0)</text>
<g transform="translate(50, 45)">
  <rect x="0" y="0" width="560" height="205" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  
  <!-- Time axis -->
  <line x1="40" y1="80" x2="520" y2="80" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="515" y="105" font-size="11" font-weight="bold" fill="#334155">Simülasyon Zamanı (ns)</text>

  <!-- Major ticks: 10ns and 20ns -->
  <line x1="80" y1="70" x2="80" y2="90" stroke="#1e293b" stroke-width="3"/>
  <text x="80" y="110" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">10.0 ns</text>

  <line x1="460" y1="70" x2="460" y2="90" stroke="#1e293b" stroke-width="3"/>
  <text x="460" y="110" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">20.0 ns</text>

  <!-- Delta cycles within 10.0ns -->
  <g transform="translate(80, 20)">
    <rect x="20" y="0" width="70" height="45" rx="4" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="55" y="20" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">10ns + 0δ</text>
    <text x="55" y="35" font-size="8" fill="#475569" text-anchor="middle">clk yükseldi</text>

    <line x1="90" y1="22" x2="115" y2="22" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="120" y="0" width="70" height="45" rx="4" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="155" y="20" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">10ns + 1δ</text>
    <text x="155" y="35" font-size="8" fill="#475569" text-anchor="middle">&lt;= atamaları</text>

    <line x1="190" y1="22" x2="215" y2="22" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

    <rect x="220" y="0" width="70" height="45" rx="4" fill="#fef3c7" stroke="#eab308"/>
    <text x="255" y="20" font-size="10" font-weight="bold" fill="#854d0e" text-anchor="middle">10ns + 2δ</text>
    <text x="255" y="35" font-size="8" fill="#475569" text-anchor="middle">comb kapılar</text>
  </g>

  <!-- Explanation card -->
  <rect x="30" y="130" width="500" height="60" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="152" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Delta Döngüsü Nedir? Sıfır simülasyon zamanı harcayan (Δt = 0),</text>
  <text x="280" y="170" font-size="10" fill="#475569" text-anchor="middle">ancak olayların neden-sonuç (nedensellik) sırasını kuran sonsuz küçük mikro simülasyon adımıdır.</text>
</g>

</svg>