<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>

  <!-- Zone header pill: Class -->
  <rect x="40" y="20" width="139" height="28" rx="9" fill="#2E86AB" opacity="0.12"/>
  <text x="109.5" y="39" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E86AB">Class (Blueprint)</text>

  <!-- Class box (narrower) -->
  <rect x="40" y="60" width="200" height="190" rx="4" fill="#2E86AB" opacity="0.08" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="140" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e3b">class myPacket</text>

  <!-- divider -->
  <line x1="56" y1="96" x2="224" y2="96" stroke="#c8d8e0" stroke-width="0.5"/>

  <!-- properties as bullet list -->
  <text x="56" y="114" font-size="11" font-weight="bold" fill="#1a2e3b">Properties</text>
  <circle cx="60" cy="129" r="2" fill="#2E86AB"/>
  <text x="68" y="133" font-size="10" fill="#445566">header</text>
  <circle cx="60" cy="144" r="2" fill="#2E86AB"/>
  <text x="68" y="148" font-size="10" fill="#445566">encode</text>
  <circle cx="138" cy="129" r="2" fill="#2E86AB"/>
  <text x="146" y="133" font-size="10" fill="#445566">mode</text>
  <circle cx="138" cy="144" r="2" fill="#2E86AB"/>
  <text x="146" y="148" font-size="10" fill="#445566">data</text>
  <circle cx="60" cy="159" r="2" fill="#2E86AB"/>
  <text x="68" y="163" font-size="10" fill="#445566">stop</text>

  <!-- divider -->
  <line x1="56" y1="176" x2="224" y2="176" stroke="#c8d8e0" stroke-width="0.5"/>

  <!-- methods as bullet list -->
  <text x="56" y="194" font-size="11" font-weight="bold" fill="#1a2e3b">Methods</text>
  <circle cx="60" cy="209" r="2" fill="#E07B39"/>
  <text x="68" y="213" font-size="10" fill="#445566">new()</text>
  <circle cx="60" cy="224" r="2" fill="#E07B39"/>
  <text x="68" y="228" font-size="10" fill="#445566">display()</text>

  <text x="56" y="245" font-size="9" fill="#445566">Shared by every object</text>

  <!-- Arrows from class to two objects -->
  <path d="M 240 110 L 430 110" stroke="#2E86AB" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7" fill="none" marker-end="url(#arrow1)"/>
  <path d="M 240 200 L 430 290" stroke="#2E86AB" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7" fill="none" marker-end="url(#arrow1)"/>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2E86AB" opacity="0.7"/>
    </marker>
  </defs>

  <!-- new() call labels on arrows -->
  <rect x="253" y="76" width="161" height="23" rx="4" fill="#fef4ed"/>
  <text x="333.5" y="91.5" text-anchor="middle" font-size="11" fill="#b35a1f">pkt0 = new(3'h2, 3'h3)</text>

  <rect x="253" y="232" width="97" height="23" rx="4" fill="#fef4ed"/>
  <text x="301.5" y="247.5" text-anchor="middle" font-size="11" fill="#b35a1f">pkt1 = new()</text>

  <!-- Zone header pill: Objects -->
  <rect x="440" y="20" width="116" height="28" rx="9" fill="#E07B39" opacity="0.12"/>
  <text x="498" y="39" text-anchor="middle" font-size="12" font-weight="bold" fill="#E07B39">Objects (Handles)</text>

  <!-- Object 1 box: pkt0 -->
  <rect x="440" y="110" width="280" height="80" rx="4" fill="#E07B39" opacity="0.09" stroke="#E07B39" stroke-width="1.5"/>
  <text x="456" y="132" font-size="12" font-weight="bold" fill="#1a2e3b">pkt0</text>
  <path d="M 456 144 L 460 148 L 456 152" stroke="#E07B39" stroke-width="1.5" fill="none"/>
  <text x="466" y="152" font-size="10" fill="#445566">header=2, encode=0, mode=3, stop=1</text>
  <polygon points="708,150 714,156 708,162 702,156" fill="#E07B39"/>

  <!-- Object 2 box: pkt1 (taller, with default-values note) -->
  <rect x="440" y="200" width="280" height="90" rx="4" fill="#E07B39" opacity="0.09" stroke="#E07B39" stroke-width="1.5"/>
  <text x="456" y="222" font-size="12" font-weight="bold" fill="#1a2e3b">pkt1</text>
  <path d="M 456 234 L 460 238 L 456 242" stroke="#E07B39" stroke-width="1.5" fill="none"/>
  <text x="466" y="242" font-size="10" fill="#445566">header=1, encode=0, mode=5, stop=1</text>
  <polygon points="708,240 714,246 708,252 702,246" fill="#E07B39"/>
  <rect x="456" y="254" width="223" height="22" rx="4" fill="#fef4ed"/>
  <text x="567.5" y="269" text-anchor="middle" font-size="10" fill="#b35a1f">Defaults applied: new() had no args</text>

  <!-- Footnote callouts -->
  <line x1="40" y1="310" x2="720" y2="310" stroke="#c8d8e0" stroke-width="0.5"/>
  <rect x="40" y="326" width="148" height="22" rx="4" fill="#fef4ed"/>
  <text x="114" y="341" text-anchor="middle" font-size="10" fill="#b35a1f">new() allocates memory</text>

  <rect x="220" y="326" width="160" height="22" rx="4" fill="#fef4ed"/>
  <text x="300" y="341" text-anchor="middle" font-size="10" fill="#b35a1f">Independent copy of data</text>

  <rect x="412" y="326" width="139" height="22" rx="4" fill="#eef6fa"/>
  <text x="481.5" y="341" text-anchor="middle" font-size="10" fill="#1a6080">Shared method, not copied</text>

  <text x="40" y="378" font-size="10" fill="#445566">Each call to <tspan font-style="italic">new()</tspan> creates a separate object with its own copy of every property.</text>
  <text x="40" y="396" font-size="10" fill="#445566">Methods like display() are defined once in the class and shared by all objects (pkt0, pkt1, ...).</text>
</svg>
