<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 275" width="660" height="275" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="274" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">SystemVerilog Açık Sentez Blokları: always_comb, always_ff, always_latch</text>
<g transform="translate(30, 45)">
  <!-- always_comb -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="95" y="24" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">always_comb</text>
    <text x="95" y="45" font-size="11" fill="#475569" text-anchor="middle">Kombinasyonel Mantık</text>
    <rect x="15" y="55" width="160" height="50" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="95" y="75" font-size="9" font-family="monospace" fill="#1e40af" text-anchor="middle">always_comb begin</text>
    <text x="95" y="92" font-size="9" font-family="monospace" fill="#1e40af" text-anchor="middle">  out = a &amp; b;</text>
    <text x="95" y="105" font-size="9" font-family="monospace" fill="#1e40af" text-anchor="middle">end</text>
    <text x="95" y="130" font-size="10" fill="#334155" text-anchor="middle">• Otomatik duyarlılık listesi</text>
    <text x="95" y="150" font-size="10" fill="#334155" text-anchor="middle">• Latch oluşursa HATA verir</text>
    <text x="95" y="170" font-size="10" fill="#334155" text-anchor="middle">• T = 0 anında 1 kez tetiklenir</text>
    <text x="95" y="195" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Donanım: Mantık Kapıları</text>
  </g>

  <!-- always_ff -->
  <g transform="translate(205, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="95" y="24" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">always_ff</text>
    <text x="95" y="45" font-size="11" fill="#475569" text-anchor="middle">Flip-Flop / Ardışıl Mantık</text>
    <rect x="15" y="55" width="160" height="50" rx="4" fill="#ffffff" stroke="#86efac"/>
    <text x="95" y="73" font-size="9" font-family="monospace" fill="#166534" text-anchor="middle">always_ff @(posedge clk)</text>
    <text x="95" y="88" font-size="9" font-family="monospace" fill="#166534" text-anchor="middle">  if (!rst_n) q &lt;= 0;</text>
    <text x="95" y="103" font-size="9" font-family="monospace" fill="#166534" text-anchor="middle">  else q &lt;= d;</text>
    <text x="95" y="130" font-size="10" fill="#334155" text-anchor="middle">• Saat/Reset kenarı zorunludur</text>
    <text x="95" y="150" font-size="10" fill="#334155" text-anchor="middle">• Bloklamayan (&lt;=) atama şart</text>
    <text x="95" y="170" font-size="10" fill="#334155" text-anchor="middle">• Kombinasyonel kodda HATA</text>
    <text x="95" y="195" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Donanım: D Flip-Flop</text>
  </g>

  <!-- always_latch -->
  <g transform="translate(410, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="95" y="24" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">always_latch</text>
    <text x="95" y="45" font-size="11" fill="#475569" text-anchor="middle">Seviye Tetiklemeli Latch</text>
    <rect x="15" y="55" width="160" height="50" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="95" y="75" font-size="9" font-family="monospace" fill="#991b1b" text-anchor="middle">always_latch begin</text>
    <text x="95" y="92" font-size="9" font-family="monospace" fill="#991b1b" text-anchor="middle">  if (en) q = d;</text>
    <text x="95" y="105" font-size="9" font-family="monospace" fill="#991b1b" text-anchor="middle">end</text>
    <text x="95" y="130" font-size="10" fill="#334155" text-anchor="middle">• Bilerek latch üretmek için</text>
    <text x="95" y="150" font-size="10" fill="#334155" text-anchor="middle">• Tasarımcının niyetini belirtir</text>
    <text x="95" y="170" font-size="10" fill="#334155" text-anchor="middle">• Yanlışlıkla latch'i önler</text>
    <text x="95" y="195" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Donanım: Transparent Latch</text>
  </g>
</g>

</svg>