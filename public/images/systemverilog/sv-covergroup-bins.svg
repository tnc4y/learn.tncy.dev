<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 275" width="660" height="275" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="274" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Fonksiyonel Kapsama: Covergroup, Coverpoint ve Bins Mekanizması</text>
<g transform="translate(40, 45)">
  <rect x="0" y="0" width="580" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  
  <text x="30" y="28" font-size="12" font-weight="bold" fill="#1e293b">Değişken Değer Aralığı ve Örnekleme Kovaları (Bins):</text>

  <!-- Bins visual buckets -->
  <g transform="translate(30, 45)">
    <!-- Bin 1 -->
    <rect x="0" y="0" width="115" height="85" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="57" y="22" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">bin low = [0:3]</text>
    <text x="57" y="48" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">✓ VURULDU</text>
    <text x="57" y="70" font-size="9" fill="#166534" text-anchor="middle">Hit: 42 kez</text>

    <!-- Bin 2 -->
    <rect x="135" y="0" width="115" height="85" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="192" y="22" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">bin mid = [4:7]</text>
    <text x="192" y="48" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">✓ VURULDU</text>
    <text x="192" y="70" font-size="9" fill="#166534" text-anchor="middle">Hit: 18 kez</text>

    <!-- Bin 3 -->
    <rect x="270" y="0" width="115" height="85" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="327" y="22" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">bin high = [8:15]</text>
    <text x="327" y="48" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">✗ BOŞ (0 Hit)</text>
    <text x="327" y="70" font-size="9" fill="#dc2626" text-anchor="middle">Kapsama Açığı!</text>

    <!-- Bin 4 (illegal) -->
    <rect x="405" y="0" width="115" height="85" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="462" y="22" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">illegal_bins bad</text>
    <text x="462" y="48" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">HATA ÜRETİR</text>
    <text x="462" y="70" font-size="8" fill="#64748b" text-anchor="middle">default / geçersiz</text>
  </g>

  <!-- Progress bar -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="520" height="20" rx="4" fill="#e2e8f0"/>
    <rect x="0" y="0" width="346" height="20" rx="4" fill="#16a34a"/>
    <text x="173" y="14" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">%66.6 Kapsama (2 / 3 Kova Vuruldu)</text>
    <text x="430" y="14" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">%33.3 Açık</text>
  </g>
</g>

</svg>