<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" width="540" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="540" height="430" fill="#ffffff"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E86AB">ms_cross: 4 × 4 = 16 cross products</text>

  <!-- Axis titles -->
  <text x="310" y="58" text-anchor="middle" font-size="11" font-weight="500" fill="#2E86AB">slave_id_cp</text>
  <text x="40" y="182" text-anchor="middle" font-size="11" font-weight="500" fill="#2E86AB" transform="rotate(-90 40 182)">master_id_cp</text>

  <!-- Column labels -->
  <text x="175" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e3b">slave0</text>
  <text x="265" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e3b">slave1</text>
  <text x="355" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e3b">slave2</text>
  <text x="445" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a2e3b">slave3</text>

  <!-- Row labels -->
  <text x="120" y="117" text-anchor="end" font-size="12" font-weight="bold" fill="#1a2e3b">master0</text>
  <text x="120" y="163" text-anchor="end" font-size="12" font-weight="bold" fill="#1a2e3b">master1</text>
  <text x="120" y="209" text-anchor="end" font-size="12" font-weight="bold" fill="#1a2e3b">master2</text>
  <text x="120" y="255" text-anchor="end" font-size="12" font-weight="bold" fill="#1a2e3b">master3</text>

  <!-- Base grid -->
  <g fill="none" stroke="#c8d8e0" stroke-width="0.5">
    <rect x="130" y="90" width="360" height="184"/>
    <line x1="220" y1="90" x2="220" y2="274"/>
    <line x1="310" y1="90" x2="310" y2="274"/>
    <line x1="400" y1="90" x2="400" y2="274"/>
    <line x1="130" y1="136" x2="490" y2="136"/>
    <line x1="130" y1="182" x2="490" y2="182"/>
    <line x1="130" y1="228" x2="490" y2="228"/>
  </g>

  <!-- illegal_bins: master0 x slave0 -->
  <rect x="133" y="93" width="84" height="40" rx="4" fill="#E07B39" fill-opacity="0.15" stroke="#E07B39" stroke-width="1"/>
  <text x="175" y="117" text-anchor="middle" font-size="11" font-weight="500" fill="#b35a1f">illegal</text>

  <!-- bin A: master0 x slave1 -->
  <rect x="223" y="93" width="84" height="40" rx="4" fill="#2E86AB" fill-opacity="0.15" stroke="#2E86AB" stroke-width="1"/>
  <text x="265" y="117" text-anchor="middle" font-size="11" font-weight="500" fill="#1a6080">bin A</text>

  <!-- bin B: any master x slave3 -->
  <rect x="403" y="93" width="84" height="178" rx="4" fill="#2E86AB" fill-opacity="0.08" stroke="#2E86AB" stroke-width="1"/>
  <text x="445" y="117" text-anchor="middle" font-size="11" font-weight="500" fill="#1a6080">bin B</text>
  <text x="445" y="163" text-anchor="middle" font-size="11" font-weight="500" fill="#1a6080">bin B</text>
  <text x="445" y="209" text-anchor="middle" font-size="11" font-weight="500" fill="#1a6080">bin B</text>
  <text x="445" y="255" text-anchor="middle" font-size="11" font-weight="500" fill="#1a6080">bin B</text>

  <!-- ignore_bins: master3 x slave2 -->
  <rect x="313" y="231" width="84" height="40" rx="4" fill="#ffffff" stroke="#445566" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="355" y="255" text-anchor="middle" font-size="11" font-weight="500" fill="#445566">ignore</text>

  <!-- Automatic bins (9) -->
  <g font-size="10" fill="#445566" text-anchor="middle">
    <text x="355" y="117">auto</text>
    <text x="175" y="163">auto</text>
    <text x="265" y="163">auto</text>
    <text x="355" y="163">auto</text>
    <text x="175" y="209">auto</text>
    <text x="265" y="209">auto</text>
    <text x="355" y="209">auto</text>
    <text x="175" y="255">auto</text>
    <text x="265" y="255">auto</text>
  </g>

  <!-- Legend -->
  <rect x="130" y="300" width="14" height="14" rx="4" fill="#2E86AB" fill-opacity="0.15" stroke="#2E86AB" stroke-width="1"/>
  <text x="152" y="311" font-size="10" fill="#445566">User-defined bin (counts toward coverage)</text>

  <rect x="130" y="322" width="14" height="14" rx="4" fill="#E07B39" fill-opacity="0.15" stroke="#E07B39" stroke-width="1"/>
  <text x="152" y="333" font-size="10" fill="#445566">illegal_bins: run-time error if hit, not counted</text>

  <rect x="130" y="344" width="14" height="14" rx="4" fill="#ffffff" stroke="#445566" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="152" y="355" font-size="10" fill="#445566">ignore_bins: excluded from coverage</text>

  <rect x="130" y="366" width="14" height="14" rx="4" fill="#ffffff" stroke="#c8d8e0" stroke-width="1"/>
  <text x="152" y="377" font-size="10" fill="#445566">Automatic bin (counts toward coverage)</text>

  <line x1="20" y1="392" x2="520" y2="392" stroke="#c8d8e0" stroke-width="0.5"/>
  <text x="270" y="408" text-anchor="middle" font-size="10" fill="#445566">bin A = master0_slave1, bin B = any_master_slave3</text>
  <text x="270" y="424" text-anchor="middle" font-size="10" fill="#445566">Bins counted toward coverage: 2 user-defined + 9 automatic = 11</text>
</svg>
