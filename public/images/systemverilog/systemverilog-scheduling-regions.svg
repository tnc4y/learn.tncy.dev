<svg height="460" width="960" viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2e3b">SystemVerilog Simulation Time Step: Region Flow</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#445566">A time step is not a single instant &#8212; it is this ordered sequence of regions</text>

  <!-- Background zone highlights -->
  <rect x="147" y="88" width="424" height="64" rx="8" fill="#2E86AB" opacity="0.08"/>
  <text x="359" y="81" text-anchor="middle" font-size="10" fill="#1a6080" font-weight="bold">DESIGN REGION SET</text>

  <rect x="611" y="88" width="237" height="64" rx="8" fill="#E07B39" opacity="0.09"/>
  <text x="729" y="81" text-anchor="middle" font-size="10" fill="#b35a1f" font-weight="bold">VERIFICATION REGION SET</text>

  <!-- Preponed -->
  <rect x="20" y="100" width="100" height="50" rx="6" fill="#eef6fa" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="70" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2e3b">Preponed</text>

  <line x1="120" y1="125" x2="147" y2="125" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="147,125 139,121 139,129" fill="#1a2e3b"/>

  <!-- Active -->
  <rect x="157" y="100" width="100" height="50" rx="6" fill="#2E86AB" opacity="0.12" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="207" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2e3b">Active</text>

  <line x1="257" y1="125" x2="284" y2="125" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="284,125 276,121 276,129" fill="#1a2e3b"/>

  <!-- Inactive -->
  <rect x="294" y="100" width="100" height="50" rx="6" fill="#2E86AB" opacity="0.12" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="344" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2e3b">Inactive</text>

  <line x1="394" y1="125" x2="421" y2="125" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="421,125 413,121 413,129" fill="#1a2e3b"/>

  <!-- NBA -->
  <rect x="431" y="100" width="100" height="50" rx="6" fill="#2E86AB" opacity="0.12" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="481" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2e3b">NBA</text>

  <line x1="531" y1="125" x2="601" y2="125" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="601,125 593,121 593,129" fill="#1a2e3b"/>

  <!-- Observed -->
  <rect x="611" y="100" width="100" height="50" rx="6" fill="#E07B39" opacity="0.13" stroke="#E07B39" stroke-width="1.5"/>
  <text x="661" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2e3b">Observed</text>

  <line x1="711" y1="125" x2="738" y2="125" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="738,125 730,121 730,129" fill="#1a2e3b"/>

  <!-- Reactive -->
  <rect x="748" y="100" width="100" height="50" rx="6" fill="#E07B39" opacity="0.13" stroke="#E07B39" stroke-width="1.5"/>
  <text x="798" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2e3b">Reactive</text>

  <!-- Down arrow to Postponed -->
  <line x1="798" y1="150" x2="798" y2="185" stroke="#1a2e3b" stroke-width="2"/>
  <polygon points="798,185 794,177 802,177" fill="#1a2e3b"/>

  <!-- Postponed (second row) -->
  <rect x="748" y="195" width="100" height="50" rx="6" fill="#f4f4f4" stroke="#445566" stroke-width="1.5"/>
  <text x="798" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a2e3b">Postponed</text>

  <!-- Captions row 1 (directly under boxes), y=168-180 -->
  <text x="70" y="170" text-anchor="middle" font-size="10" fill="#445566">Sample for</text>
  <text x="70" y="182" text-anchor="middle" font-size="10" fill="#445566">assertions</text>

  <text x="207" y="170" text-anchor="middle" font-size="10" fill="#445566">Blocking code,</text>
  <text x="207" y="182" text-anchor="middle" font-size="10" fill="#445566">$display run</text>

  <text x="344" y="170" text-anchor="middle" font-size="10" fill="#445566">#0 delays</text>
  <text x="344" y="182" text-anchor="middle" font-size="10" fill="#445566">settle here</text>

  <text x="481" y="170" text-anchor="middle" font-size="10" fill="#445566">Nonblocking</text>
  <text x="481" y="182" text-anchor="middle" font-size="10" fill="#445566">updates apply</text>

  <text x="661" y="170" text-anchor="middle" font-size="10" fill="#445566">Assertions</text>
  <text x="661" y="182" text-anchor="middle" font-size="10" fill="#445566">evaluate</text>

  <text x="860" y="255" text-anchor="middle" font-size="10" fill="#445566">$strobe/$monitor</text>
  <text x="860" y="267" text-anchor="middle" font-size="10" fill="#445566">read final values</text>

  <!-- Loop-back arrow for Active-Inactive-NBA -->
  <path d="M 481 150 C 481 300, 207 300, 207 150" fill="none" stroke="#2E86AB" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.7"/>
  <polygon points="207,150 202,161 212,161" fill="#2E86AB" opacity="0.7"/>
  <text x="344" y="320" text-anchor="middle" font-size="10" fill="#445566">Active&#8211;Inactive&#8211;NBA can loop if a new event lands back in Active</text>

  <!-- Next time step wrap-around, at the very bottom -->
  <path d="M 798 245 C 798 400, 70 400, 70 150" fill="none" stroke="#445566" stroke-width="1.2" stroke-dasharray="5 4"/>
  <polygon points="70,150 65,161 75,161" fill="#445566"/>
  <text x="434" y="420" text-anchor="middle" font-size="10" fill="#445566">Time advances to the next time step &#8212; the whole sequence begins again at Preponed</text>

</svg>
