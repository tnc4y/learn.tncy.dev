<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 275" width="660" height="275" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="274" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">SystemVerilog Paralel Süreçler: fork..join / join_any / join_none</text>
<g transform="translate(30, 45)">
  <!-- fork..join -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="95" y="22" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">fork .. join</text>
    <text x="95" y="40" font-size="10" fill="#64748b" text-anchor="middle">Tüm İş Parçacıklarını Bekler</text>
    <!-- diagram -->
    <line x1="30" y1="60" x2="30" y2="150" stroke="#3b82f6" stroke-width="2"/>
    <line x1="95" y1="60" x2="95" y2="120" stroke="#3b82f6" stroke-width="2"/>
    <line x1="160" y1="60" x2="160" y2="170" stroke="#3b82f6" stroke-width="2"/>
    <line x1="15" y1="170" x2="175" y2="170" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="95" y="190" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">En uzun süren bitince geçer</text>
  </g>

  <!-- fork..join_any -->
  <g transform="translate(205, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#f0fdf4" stroke="#86efac"/>
    <text x="95" y="22" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">fork .. join_any</text>
    <text x="95" y="40" font-size="10" fill="#64748b" text-anchor="middle">İlk Biten Süreçte Çıkar</text>
    <!-- diagram -->
    <line x1="30" y1="60" x2="30" y2="150" stroke="#22c55e" stroke-width="2"/>
    <line x1="95" y1="60" x2="95" y2="110" stroke="#22c55e" stroke-width="2"/>
    <line x1="160" y1="60" x2="160" y2="170" stroke="#22c55e" stroke-width="2"/>
    <line x1="15" y1="110" x2="175" y2="110" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="95" y="190" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">İlk iş parçacığı bitince devam!</text>
  </g>

  <!-- fork..join_none -->
  <g transform="translate(410, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="95" y="22" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">fork .. join_none</text>
    <text x="95" y="40" font-size="10" fill="#64748b" text-anchor="middle">Hiç Beklemez (Arka Plan)</text>
    <!-- diagram -->
    <line x1="30" y1="60" x2="30" y2="150" stroke="#ef4444" stroke-width="2"/>
    <line x1="95" y1="60" x2="95" y2="120" stroke="#ef4444" stroke-width="2"/>
    <line x1="160" y1="60" x2="160" y2="170" stroke="#ef4444" stroke-width="2"/>
    <line x1="15" y1="60" x2="175" y2="60" stroke="#b91c1c" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="95" y="190" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Hemen geçer, arkada çalışırlar</text>
  </g>
</g>

</svg>