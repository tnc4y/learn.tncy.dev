<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a2e3b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="380" fill="#ffffff"/>

  <!-- Divider -->
  <line x1="320" y1="20" x2="320" y2="350" stroke="#c8d8e0" stroke-width="0.5"/>

  <!-- ================= while (left) ================= -->
  <text x="150" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E86AB">while</text>

  <!-- enter pill: "enter loop" 10px -> w=78, use 84 -->
  <rect x="108" y="44" width="84" height="22" rx="9" fill="#eef6fa" stroke="#2E86AB" stroke-width="1"/>
  <text x="150" y="59" text-anchor="middle" font-size="10" fill="#1a6080">enter loop</text>
  <line x1="150" y1="66" x2="150" y2="93" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- condition diamond: center (150,125) -->
  <polygon points="150,95 222,125 150,155 78,125" fill="#E07B39" fill-opacity="0.12" stroke="#E07B39" stroke-width="1.2"/>
  <text x="150" y="129" text-anchor="middle" font-size="11" font-weight="500" fill="#b35a1f">condition?</text>

  <!-- true: down to body -->
  <line x1="150" y1="155" x2="150" y2="188" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="158" y="176" font-size="10" fill="#445566">true</text>

  <!-- body box -->
  <rect x="90" y="190" width="120" height="36" rx="4" fill="#2E86AB" fill-opacity="0.12" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="150" y="212" text-anchor="middle" font-size="11" font-weight="500" fill="#1a6080">loop body</text>

  <!-- loop back: body left -> up -> diamond left -->
  <polyline points="90,208 50,208 50,125 76,125" fill="none" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- false: diamond right -> down -> exit -->
  <polyline points="222,125 262,125 262,301 194,301" fill="none" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="118" font-size="10" fill="#445566">false</text>

  <!-- exit pill -->
  <rect x="108" y="290" width="84" height="22" rx="9" fill="#eef6fa" stroke="#2E86AB" stroke-width="1"/>
  <text x="150" y="305" text-anchor="middle" font-size="10" fill="#1a6080">exit loop</text>

  <text x="150" y="342" text-anchor="middle" font-size="11" font-weight="500" fill="#1a2e3b">Body runs 0 or more times</text>

  <!-- ================= do while (right) ================= -->
  <text x="470" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E86AB">do while</text>

  <rect x="428" y="44" width="84" height="22" rx="9" fill="#eef6fa" stroke="#2E86AB" stroke-width="1"/>
  <text x="470" y="59" text-anchor="middle" font-size="10" fill="#1a6080">enter loop</text>
  <line x1="470" y1="66" x2="470" y2="93" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- body box first -->
  <rect x="410" y="95" width="120" height="36" rx="4" fill="#2E86AB" fill-opacity="0.12" stroke="#2E86AB" stroke-width="1.2"/>
  <text x="470" y="117" text-anchor="middle" font-size="11" font-weight="500" fill="#1a6080">loop body</text>
  <line x1="470" y1="131" x2="470" y2="163" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- condition diamond: center (470,195) -->
  <polygon points="470,165 542,195 470,225 398,195" fill="#E07B39" fill-opacity="0.12" stroke="#E07B39" stroke-width="1.2"/>
  <text x="470" y="199" text-anchor="middle" font-size="11" font-weight="500" fill="#b35a1f">condition?</text>

  <!-- true: diamond left -> up -> body left -->
  <polyline points="398,195 370,195 370,113 408,113" fill="none" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="374" y="188" font-size="10" fill="#445566">true</text>

  <!-- false: down to exit -->
  <line x1="470" y1="225" x2="470" y2="288" stroke="#1a2e3b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="478" y="262" font-size="10" fill="#445566">false</text>

  <rect x="428" y="290" width="84" height="22" rx="9" fill="#eef6fa" stroke="#2E86AB" stroke-width="1"/>
  <text x="470" y="305" text-anchor="middle" font-size="10" fill="#1a6080">exit loop</text>

  <text x="470" y="342" text-anchor="middle" font-size="11" font-weight="500" fill="#1a2e3b">Body runs 1 or more times</text>
</svg>
