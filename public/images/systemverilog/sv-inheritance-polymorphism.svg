<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 280" width="660" height="280" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="279" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">SystemVerilog OOP Kalıtım, Polimorfizm ve Sanal Metotlar (virtual)</text>
<g transform="translate(50, 45)">
  <!-- Base Class -->
  <g transform="translate(180, 10)">
    <rect x="0" y="0" width="200" height="75" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="100" y="22" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Temel Sınıf: Packet</text>
    <text x="15" y="42" font-size="10" fill="#334155">bit [31:0] addr;</text>
    <text x="15" y="60" font-size="10" font-weight="bold" fill="#2563eb">virtual function void print();</text>
  </g>

  <!-- Arrow down left & right -->
  <path d="M 230 85 L 120 120" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 330 85 L 440 120" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="105" font-size="9" fill="#64748b" text-anchor="middle">extends</text>

  <!-- Derived 1: EthPacket -->
  <g transform="translate(20, 120)">
    <rect x="0" y="0" width="200" height="85" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="100" y="22" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Türemiş: EthPacket</text>
    <text x="15" y="42" font-size="10" fill="#334155">bit [47:0] mac_dest;</text>
    <text x="15" y="60" font-size="10" font-weight="bold" fill="#16a34a">function void print();</text>
    <text x="15" y="75" font-size="8" fill="#64748b">// Ethernet başlığı yazar</text>
  </g>

  <!-- Derived 2: PciPacket -->
  <g transform="translate(340, 120)">
    <rect x="0" y="0" width="200" height="85" rx="6" fill="#fef3c7" stroke="#eab308" stroke-width="1.5"/>
    <text x="100" y="22" font-size="11" font-weight="bold" fill="#854d0e" text-anchor="middle">Türemiş: PciPacket</text>
    <text x="15" y="42" font-size="10" fill="#334155">bit [63:0] pci_bar;</text>
    <text x="15" y="60" font-size="10" font-weight="bold" fill="#b45309">function void print();</text>
    <text x="15" y="75" font-size="8" fill="#64748b">// PCIe TLP başlığı yazar</text>
  </g>
</g>

</svg>