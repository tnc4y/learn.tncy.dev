<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2E86AB"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E07B39"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="460" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="30" font-size="16" font-weight="bold" fill="#2E86AB" text-anchor="middle">Unpacked Array Indexing Order</text>
  <text x="360" y="52" font-size="12" fill="#445566" text-anchor="middle">bit m_var2 [1:5] [1:3];  &#8594;  the rightmost dimension [1:3] varies fastest</text>

  <!-- Column headers (j - fast varying, orange) -->
  <text x="270" y="80" font-size="11" font-weight="bold" fill="#E07B39" text-anchor="middle">j=1</text>
  <text x="360" y="80" font-size="11" font-weight="bold" fill="#E07B39" text-anchor="middle">j=2</text>
  <text x="450" y="80" font-size="11" font-weight="bold" fill="#E07B39" text-anchor="middle">j=3</text>

  <!-- Row labels (i - slow varying, teal) -->
  <text x="205" y="130" font-size="11" font-weight="bold" fill="#2E86AB" text-anchor="end">i=1</text>
  <text x="205" y="180" font-size="11" font-weight="bold" fill="#2E86AB" text-anchor="end">i=2</text>
  <text x="205" y="230" font-size="11" font-weight="bold" fill="#2E86AB" text-anchor="end">i=3</text>
  <text x="205" y="280" font-size="11" font-weight="bold" fill="#2E86AB" text-anchor="end">i=4</text>
  <text x="205" y="330" font-size="11" font-weight="bold" fill="#2E86AB" text-anchor="end">i=5</text>

  <!-- Grid cells: 5 rows x 3 cols, cellW=90 cellH=50, x0=225 y0=100 -->
  <!-- Row 1 -->
  <rect x="225" y="100" width="90" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="315" y="100" width="90" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="405" y="100" width="90" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <text x="270" y="130" font-size="11" fill="#1a2e3b" text-anchor="middle">(1,1)</text>
  <text x="360" y="130" font-size="11" fill="#1a2e3b" text-anchor="middle">(1,2)</text>
  <text x="450" y="130" font-size="11" fill="#1a2e3b" text-anchor="middle">(1,3)</text>

  <!-- Row 2 -->
  <rect x="225" y="150" width="90" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="315" y="150" width="90" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="405" y="150" width="90" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <text x="270" y="180" font-size="11" fill="#1a2e3b" text-anchor="middle">(2,1)</text>
  <text x="360" y="180" font-size="11" fill="#1a2e3b" text-anchor="middle">(2,2)</text>
  <text x="450" y="180" font-size="11" fill="#1a2e3b" text-anchor="middle">(2,3)</text>

  <!-- Row 3 -->
  <rect x="225" y="200" width="90" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="315" y="200" width="90" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="405" y="200" width="90" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <text x="270" y="230" font-size="11" fill="#1a2e3b" text-anchor="middle">(3,1)</text>
  <text x="360" y="230" font-size="11" fill="#1a2e3b" text-anchor="middle">(3,2)</text>
  <text x="450" y="230" font-size="11" fill="#1a2e3b" text-anchor="middle">(3,3)</text>

  <!-- Row 4 -->
  <rect x="225" y="250" width="90" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="315" y="250" width="90" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="405" y="250" width="90" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <text x="270" y="280" font-size="11" fill="#1a2e3b" text-anchor="middle">(4,1)</text>
  <text x="360" y="280" font-size="11" fill="#1a2e3b" text-anchor="middle">(4,2)</text>
  <text x="450" y="280" font-size="11" fill="#1a2e3b" text-anchor="middle">(4,3)</text>

  <!-- Row 5 -->
  <rect x="225" y="300" width="90" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="315" y="300" width="90" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="405" y="300" width="90" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <text x="270" y="330" font-size="11" fill="#1a2e3b" text-anchor="middle">(5,1)</text>
  <text x="360" y="330" font-size="11" fill="#1a2e3b" text-anchor="middle">(5,2)</text>
  <text x="450" y="330" font-size="11" fill="#1a2e3b" text-anchor="middle">(5,3)</text>

  <!-- Fast-varying arrows within row 1 (teal dashed) -->
  <line x1="305" y1="125" x2="317" y2="125" stroke="#2E86AB" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.7" marker-end="url(#arrowTeal)"/>
  <line x1="395" y1="125" x2="407" y2="125" stroke="#2E86AB" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.7" marker-end="url(#arrowTeal)"/>

  <!-- Wrap arrow: end of row1 to start of row2 (orange dashed) -->
  <path d="M495,132 C 560,132 560,168 227,168" fill="none" stroke="#E07B39" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.7" marker-end="url(#arrowOrange)"/>

  <!-- Annotation pills -->
  <rect x="267" y="364" width="186" height="23" rx="9" fill="#eef6fa"/>
  <text x="360" y="379" font-size="11" fill="#1a6080" text-anchor="middle">j increments first (fast)</text>

  <rect x="270" y="394" width="180" height="23" rx="9" fill="#fef4ed"/>
  <text x="360" y="409" font-size="11" fill="#b35a1f" text-anchor="middle">then i increments (slow)</text>

  <!-- Legend -->
  <circle cx="245" cy="436" r="4" fill="#2E86AB"/>
  <text x="255" y="440" font-size="10" fill="#445566">i = leftmost index (slow-varying)</text>
  <circle cx="470" cy="436" r="4" fill="#E07B39"/>
  <text x="480" y="440" font-size="10" fill="#445566">j = rightmost index (fast-varying)</text>
</svg>
