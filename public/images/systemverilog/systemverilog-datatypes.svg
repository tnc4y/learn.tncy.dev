<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: bold; fill: #1e293b; }
      .td-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; font-weight: bold; }
      .td-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #334155; }
      .badge-4 { fill: #fef3c7; stroke: #f59e0b; }
      .badge-2 { fill: #dcfce7; stroke: #22c55e; }
      .badge-rtl { fill: #e0f2fe; stroke: #0284c7; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="760" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="30" y="36" class="title">SystemVerilog &amp; Verilog Veri Tipleri Mimarisi</text>
  <text x="30" y="56" class="sub">4-Durumlu vs 2-Durumlu Mantık, Bellek Genişlikleri, İşaret Durumu ve Donanım Katmanları</text>

  <!-- Table Box -->
  <rect x="25" y="75" width="710" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Table Header -->
  <rect x="25" y="75" width="710" height="34" rx="8" fill="#f1f5f9"/>
  <text x="40"  y="97" class="th">Veri Tipi</text>
  <text x="140" y="97" class="th">Mantık Durumu</text>
  <text x="260" y="97" class="th">Genişlik</text>
  <text x="345" y="97" class="th">İşaret (Sign)</text>
  <text x="455" y="97" class="th">Sentezlenebilirlik</text>
  <text x="595" y="97" class="th">C/C++ Eşdeğeri</text>
  <line x1="25" y1="109" x2="735" y2="109" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Row 1: logic -->
  <rect x="25" y="109" width="710" height="35" fill="#ffffff"/>
  <text x="40"  y="131" class="td-code" fill="#0284c7">logic</text>
  <rect x="135" y="117" width="95" height="20" rx="4" class="badge-4"/>
  <text x="143" y="131" class="td-text" font-weight="600" fill="#b45309">4-State (0,1,X,Z)</text>
  <text x="260" y="131" class="td-text">Kullanıcı (Vektör)</text>
  <text x="345" y="131" class="td-text">Unsigned (Varsayılan)</text>
  <rect x="450" y="117" width="115" height="20" rx="4" class="badge-rtl"/>
  <text x="458" y="131" class="td-text" font-weight="600" fill="#0369a1">RTL &amp; Testbench</text>
  <text x="595" y="131" class="td-text">uint / custom</text>
  <line x1="25" y1="144" x2="735" y2="144" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 2: bit -->
  <rect x="25" y="144" width="710" height="35" fill="#f8fafc"/>
  <text x="40"  y="166" class="td-code" fill="#16a34a">bit</text>
  <rect x="135" y="152" width="95" height="20" rx="4" class="badge-2"/>
  <text x="151" y="166" class="td-text" font-weight="600" fill="#15803d">2-State (0, 1)</text>
  <text x="260" y="166" class="td-text">Kullanıcı (Vektör)</text>
  <text x="345" y="166" class="td-text">Unsigned</text>
  <text x="458" y="166" class="td-text">RTL &amp; Testbench</text>
  <text x="595" y="166" class="td-text">bool / uint</text>
  <line x1="25" y1="179" x2="735" y2="179" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 3: byte -->
  <rect x="25" y="179" width="710" height="35" fill="#ffffff"/>
  <text x="40"  y="201" class="td-code" fill="#16a34a">byte</text>
  <rect x="135" y="187" width="95" height="20" rx="4" class="badge-2"/>
  <text x="151" y="201" class="td-text" font-weight="600" fill="#15803d">2-State (0, 1)</text>
  <text x="260" y="201" class="td-text">8 bit (1 Bayt)</text>
  <text x="345" y="201" class="td-text" font-weight="bold" fill="#dc2626">Signed (-128..127)</text>
  <text x="458" y="201" class="td-text">RTL &amp; Testbench</text>
  <text x="595" y="201" class="td-text">char / int8_t</text>
  <line x1="25" y1="214" x2="735" y2="214" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 4: shortint -->
  <rect x="25" y="214" width="710" height="35" fill="#f8fafc"/>
  <text x="40"  y="236" class="td-code" fill="#16a34a">shortint</text>
  <rect x="135" y="222" width="95" height="20" rx="4" class="badge-2"/>
  <text x="151" y="236" class="td-text" font-weight="600" fill="#15803d">2-State (0, 1)</text>
  <text x="260" y="236" class="td-text">16 bit</text>
  <text x="345" y="236" class="td-text">Signed</text>
  <text x="458" y="236" class="td-text">RTL &amp; Testbench</text>
  <text x="595" y="236" class="td-text">short / int16_t</text>
  <line x1="25" y1="249" x2="735" y2="249" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 5: int -->
  <rect x="25" y="249" width="710" height="35" fill="#ffffff"/>
  <text x="40"  y="271" class="td-code" fill="#16a34a">int</text>
  <rect x="135" y="257" width="95" height="20" rx="4" class="badge-2"/>
  <text x="151" y="271" class="td-text" font-weight="600" fill="#15803d">2-State (0, 1)</text>
  <text x="260" y="271" class="td-text">32 bit (4 Bayt)</text>
  <text x="345" y="271" class="td-text">Signed</text>
  <text x="458" y="271" class="td-text">RTL &amp; Testbench</text>
  <text x="595" y="271" class="td-text">int / int32_t</text>
  <line x1="25" y1="284" x2="735" y2="284" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 6: longint -->
  <rect x="25" y="284" width="710" height="35" fill="#f8fafc"/>
  <text x="40"  y="306" class="td-code" fill="#16a34a">longint</text>
  <rect x="135" y="292" width="95" height="20" rx="4" class="badge-2"/>
  <text x="151" y="306" class="td-text" font-weight="600" fill="#15803d">2-State (0, 1)</text>
  <text x="260" y="306" class="td-text">64 bit (8 Bayt)</text>
  <text x="345" y="306" class="td-text">Signed</text>
  <text x="458" y="306" class="td-text">RTL &amp; Testbench</text>
  <text x="595" y="306" class="td-text">long long / int64_t</text>
  <line x1="25" y1="319" x2="735" y2="319" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 7: reg / wire (Verilog) -->
  <rect x="25" y="319" width="710" height="35" fill="#ffffff"/>
  <text x="40"  y="341" class="td-code" fill="#64748b">reg / wire</text>
  <rect x="135" y="327" width="95" height="20" rx="4" class="badge-4"/>
  <text x="143" y="341" class="td-text" font-weight="600" fill="#b45309">4-State (0,1,X,Z)</text>
  <text x="260" y="341" class="td-text">Kullanıcı (Vektör)</text>
  <text x="345" y="341" class="td-text">Unsigned</text>
  <text x="458" y="341" class="td-text">Klasik Verilog RTL</text>
  <text x="595" y="341" class="td-text">(Yok)</text>
  <line x1="25" y1="354" x2="735" y2="354" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 8: string / class -->
  <rect x="25" y="354" width="710" height="35" fill="#f8fafc"/>
  <text x="40"  y="376" class="td-code" fill="#8b5cf6">string / class</text>
  <text x="143" y="376" class="td-text" fill="#64748b">Dinamik Nesne</text>
  <text x="260" y="376" class="td-text">Dinamik Boyut</text>
  <text x="345" y="376" class="td-text">-</text>
  <text x="458" y="376" class="td-text" font-weight="bold" fill="#dc2626">Yalnızca Testbench</text>
  <text x="595" y="376" class="td-text">std::string / class</text>
  <line x1="25" y1="389" x2="735" y2="389" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 9: time / real -->
  <rect x="25" y="389" width="710" height="46" rx="0 0 8 8" fill="#ffffff"/>
  <text x="40"  y="413" class="td-code" fill="#64748b">time / real</text>
  <text x="143" y="413" class="td-text" fill="#64748b">64-bit / Double</text>
  <text x="260" y="413" class="td-text">64 bit</text>
  <text x="345" y="413" class="td-text">Signed / Floating</text>
  <text x="458" y="413" class="td-text" fill="#64748b">Simülasyon / TB</text>
  <text x="595" y="413" class="td-text">double / time_t</text>
</svg>