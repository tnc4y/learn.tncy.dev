<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowTeal2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2E86AB"/>
    </marker>
    <marker id="arrowOrange2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E07B39"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="260" fill="#ffffff"/>

  <!-- Title -->
  <text x="360" y="26" font-size="16" font-weight="bold" fill="#2E86AB" text-anchor="middle">Packed Array Memory Layout</text>
  <text x="360" y="46" font-size="12" fill="#445566" text-anchor="middle">bit [2:0][3:0][7:0] m_data &#8212; 96 contiguous bits, MSB (left) to LSB (right)</text>

  <!-- Segment labels -->
  <text x="148" y="72" font-size="11" font-weight="bold" fill="#2E86AB" text-anchor="middle">m_data[2]</text>
  <text x="360" y="72" font-size="11" font-weight="bold" fill="#2E86AB" text-anchor="middle">m_data[1]</text>
  <text x="572" y="72" font-size="11" font-weight="bold" fill="#2E86AB" text-anchor="middle">m_data[0]</text>

  <!-- Segment 2 (m_data[2] = 0xc0defade): bytes c0 de fa de -->
  <rect x="44"  y="85" width="52" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="96"  y="85" width="52" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="148" y="85" width="52" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="200" y="85" width="52" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <text x="70"  y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">c0</text>
  <text x="122" y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">de</text>
  <text x="174" y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">fa</text>
  <text x="226" y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">de</text>
  <text x="70"  y="148" font-size="10" fill="#E07B39" text-anchor="middle">[3]</text>
  <text x="122" y="148" font-size="10" fill="#E07B39" text-anchor="middle">[2]</text>
  <text x="174" y="148" font-size="10" fill="#E07B39" text-anchor="middle">[1]</text>
  <text x="226" y="148" font-size="10" fill="#E07B39" text-anchor="middle">[0]</text>

  <!-- Segment 1 (m_data[1] = 0x12345678): bytes 12 34 56 78 -->
  <rect x="256" y="85" width="52" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="308" y="85" width="52" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="360" y="85" width="52" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="412" y="85" width="52" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <text x="282" y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">12</text>
  <text x="334" y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">34</text>
  <text x="386" y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">56</text>
  <text x="438" y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">78</text>
  <text x="282" y="148" font-size="10" fill="#E07B39" text-anchor="middle">[3]</text>
  <text x="334" y="148" font-size="10" fill="#E07B39" text-anchor="middle">[2]</text>
  <text x="386" y="148" font-size="10" fill="#E07B39" text-anchor="middle">[1]</text>
  <text x="438" y="148" font-size="10" fill="#E07B39" text-anchor="middle">[0]</text>

  <!-- Segment 0 (m_data[0] = 0xfacecafe): bytes fa ce ca fe -->
  <rect x="468" y="85" width="52" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="520" y="85" width="52" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="572" y="85" width="52" height="50" fill="#2E86AB" fill-opacity="0.08" stroke="#1a2e3b" stroke-width="1"/>
  <rect x="624" y="85" width="52" height="50" fill="#ffffff" stroke="#1a2e3b" stroke-width="1"/>
  <text x="494" y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">fa</text>
  <text x="546" y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">ce</text>
  <text x="598" y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">ca</text>
  <text x="650" y="115" font-size="11" font-weight="bold" fill="#1a2e3b" text-anchor="middle">fe</text>
  <text x="494" y="148" font-size="10" fill="#E07B39" text-anchor="middle">[3]</text>
  <text x="546" y="148" font-size="10" fill="#E07B39" text-anchor="middle">[2]</text>
  <text x="598" y="148" font-size="10" fill="#E07B39" text-anchor="middle">[1]</text>
  <text x="650" y="148" font-size="10" fill="#E07B39" text-anchor="middle">[0]</text>

  <!-- Fast-varying arrow: byte index within segment 2 (orange dashed) -->
  <line x1="44" y1="165" x2="248" y2="165" stroke="#E07B39" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.7" marker-end="url(#arrowOrange2)"/>

  <!-- Slow-varying arrow: segment index across full bar (teal dashed) -->
  <line x1="44" y1="182" x2="672" y2="182" stroke="#2E86AB" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.7" marker-end="url(#arrowTeal2)"/>

  <!-- Annotation pills -->
  <rect x="45" y="193.5" width="206" height="23" rx="9" fill="#fef4ed"/>
  <text x="148" y="209" font-size="10" fill="#b35a1f" text-anchor="middle">byte index [3:0] varies fastest</text>

  <rect x="248.5" y="223.5" width="223" height="23" rx="9" fill="#eef6fa"/>
  <text x="360" y="239" font-size="10" fill="#1a6080" text-anchor="middle">segment index [2:0] varies slowest</text>
</svg>
