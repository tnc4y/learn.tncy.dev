<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 740 220" width="740" height="220" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="739" height="219" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<text x="370" y="26" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">IEEE 1801 UPF: Multi-Voltage & Power-Gated Domains</text>

<g transform="translate(30, 45)">
  <!-- Always-on Top Domain -->
  <rect x="0" y="0" width="680" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4,4"/>
  <text x="20" y="24" font-size="12" font-weight="bold" fill="#475569">Top Power Domain (PD_TOP - VDD_CORE = 1.0V)</text>

  <!-- Always-on PMU -->
  <rect x="20" y="40" width="160" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="100" y="65" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">Always-On PMU</text>
  <text x="100" y="85" font-size="9" fill="#92400e" text-anchor="middle">Güç Yönetim Birimi</text>
  <text x="100" y="105" font-size="9" fill="#92400e" text-anchor="middle">Kontrol: Pwr_En, Iso_En</text>

  <!-- Switchable Domain 1 -->
  <rect x="220" y="40" width="200" height="90" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="320" y="65" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">Kapatılabilir Alan (PD_CPU)</text>
  <text x="320" y="85" font-size="9" fill="#dc2626" text-anchor="middle">VDD_CPU = 0.8V (Güç Kapılı)</text>
  <text x="320" y="105" font-size="9" fill="#991b1b" text-anchor="middle">Sleep / Retention Modu</text>

  <!-- Isolation boundary -->
  <line x1="420" y1="50" x2="455" y2="50" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="445" y="42" width="20" height="16" fill="#f59e0b"/>
  <text x="455" y="54" font-size="8" fill="#ffffff" font-weight="bold" text-anchor="middle">ISO</text>

  <!-- Memory Domain 2 -->
  <rect x="480" y="40" width="180" height="90" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="570" y="65" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">SRAM Alanı (PD_MEM)</text>
  <text x="570" y="85" font-size="9" fill="#0284c7" text-anchor="middle">VDD_MEM = 1.2V (High-V)</text>
  <text x="570" y="105" font-size="9" fill="#075985" text-anchor="middle">Seviye Kaydırıcı (Level Shifter)</text>
</g>

</svg>