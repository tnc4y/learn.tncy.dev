<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 190" width="720" height="190" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="719" height="189" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<text x="360" y="26" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">UPF Power State Table (PST) Operational Modes</text>

<g transform="translate(30, 40)">
  <rect x="0" y="0" width="660" height="130" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="0" y1="32" x2="660" y2="32" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80" y="22" font-size="11" font-weight="bold" fill="#0f172a">State Name</text>
  <text x="240" y="22" font-size="11" font-weight="bold" fill="#0f172a">VDD_AON (Always-On)</text>
  <text x="420" y="22" font-size="11" font-weight="bold" fill="#0f172a">VDD_CPU (Core)</text>
  <text x="580" y="22" font-size="11" font-weight="bold" fill="#0f172a">VDD_MEM (SRAM)</text>

  <!-- Row 1: ALL_ON -->
  <line x1="0" y1="60" x2="660" y2="60" stroke="#e2e8f0"/>
  <text x="80" y="50" font-size="10" font-weight="bold" fill="#15803d">FULL_ON</text>
  <text x="240" y="50" font-size="10" fill="#334155">ON (1.0V)</text>
  <text x="420" y="50" font-size="10" fill="#334155">ON (0.9V)</text>
  <text x="580" y="50" font-size="10" fill="#334155">ON (1.1V)</text>

  <!-- Row 2: SLEEP -->
  <line x1="0" y1="88" x2="660" y2="88" stroke="#e2e8f0"/>
  <text x="80" y="78" font-size="10" font-weight="bold" fill="#b45309">CPU_SLEEP</text>
  <text x="240" y="78" font-size="10" fill="#334155">ON (1.0V)</text>
  <text x="420" y="78" font-size="10" font-weight="bold" fill="#dc2626">OFF (0.0V - ISO)</text>
  <text x="580" y="78" font-size="10" fill="#334155">RETENTION (0.7V)</text>

  <!-- Row 3: STANDBY -->
  <text x="80" y="112" font-size="10" font-weight="bold" fill="#6d28d9">DEEP_STANDBY</text>
  <text x="240" y="112" font-size="10" fill="#334155">ON (1.0V - PMU only)</text>
  <text x="420" y="112" font-size="10" font-weight="bold" fill="#dc2626">OFF (0.0V)</text>
  <text x="580" y="112" font-size="10" font-weight="bold" fill="#dc2626">OFF (0.0V)</text>
</g>

</svg>