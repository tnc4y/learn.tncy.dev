<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 190" width="720" height="190" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="719" height="189" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<text x="360" y="26" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">IEEE 1801 UPF: Multi-Voltage Level Shifter Operation (LS)</text>

<g transform="translate(30, 45)">
  <rect x="0" y="15" width="170" height="90" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="85" y="42" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">Domain A: Low Voltage</text>
  <text x="85" y="64" font-size="11" fill="#0284c7" text-anchor="middle">VDD = 0.8V</text>
  <text x="85" y="85" font-size="9" fill="#64748b" text-anchor="middle">Signal Out: 0.8V Logic</text>

  <line x1="170" y1="60" x2="245" y2="60" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="10" width="210" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="355" y="38" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">Level Shifter (LS)</text>
  <text x="355" y="58" font-size="10" fill="#92400e" text-anchor="middle">Dual Supply: VDD_L (0.8V) &amp; VDD_H (1.2V)</text>
  <text x="355" y="78" font-size="9" fill="#92400e" text-anchor="middle">Prevents shoot-through &amp; crowbar leakage</text>
  <text x="355" y="94" font-size="9" font-weight="bold" fill="#15803d" text-anchor="middle">UPF: set_level_shifter</text>

  <line x1="460" y1="60" x2="535" y2="60" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect x="540" y="15" width="150" height="90" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="615" y="42" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Domain B: High Voltage</text>
  <text x="615" y="64" font-size="11" fill="#16a34a" text-anchor="middle">VDD = 1.2V</text>
  <text x="615" y="85" font-size="9" fill="#64748b" text-anchor="middle">Signal In: 1.2V Logic Clean</text>
</g>

</svg>