<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230">
  <rect width="800" height="230" rx="16" fill="#0f172a"/>
  <text x="400" y="34" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">KUBERNETES CONTROL PLANE &amp; CONTAINER WORKER NODES</text>
  <g transform="translate(35,55)" font-family="sans-serif">
    <rect x="0" y="0" width="320" height="145" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="160" y="28" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">Control Plane (Master Node)</text>
    <text x="25" y="60" fill="#e2e8f0" font-size="12">• kube-apiserver (REST Gateway)</text>
    <text x="25" y="84" fill="#e2e8f0" font-size="12">• etcd (Distributed Key-Value Store)</text>
    <text x="25" y="108" fill="#e2e8f0" font-size="12">• kube-scheduler &amp; controller-mgr</text>

    <rect x="360" y="0" width="370" height="145" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="545" y="28" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">Worker Nodes (Data Plane)</text>
    <text x="385" y="60" fill="#e2e8f0" font-size="12">• kubelet (Node Agent) &amp; kube-proxy</text>
    <text x="385" y="84" fill="#e2e8f0" font-size="12">• Container Runtime (containerd / Docker)</text>
    <text x="385" y="108" fill="#e2e8f0" font-size="12">• Pods, Services, Ingress &amp; CSI Volumes</text>
  </g>
</svg>