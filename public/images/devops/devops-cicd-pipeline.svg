    <rect x="0" y="0" width="130" height="105" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="38" fill="#38bdf8" font-size="13" font-weight="bold">1. Code &amp; Git</text>
    <text x="65" y="62" fill="#e2e8f0" font-size="11">Git / GitHub PR</text>
    <text x="65" y="84" fill="#94a3b8" font-size="10">Branch &amp; Merge</text>

    <rect x="152" y="0" width="130" height="105" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="217" y="38" fill="#34d399" font-size="13" font-weight="bold">2. CI Build &amp; Test</text>
    <text x="217" y="62" fill="#e2e8f0" font-size="11">Jenkins / Actions</text>
