<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" font-family="Arial, Helvetica, sans-serif">
  <title>Counter-based debouncer block diagram</title>
  <rect width="820" height="200" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <g fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5">
    <rect x="90"  y="50" width="80" height="70" rx="4"/>
    <rect x="210" y="50" width="80" height="70" rx="4"/>
    <rect x="340" y="60" width="60" height="50" rx="25"/>
    <rect x="450" y="50" width="120" height="70" rx="4"/>
    <rect x="620" y="50" width="80" height="70" rx="4"/>
  </g>
  <!-- clock triangles on registers -->
  <g fill="none" stroke="#1f2937" stroke-width="1.2">
    <path d="M90,108 L98,114 L90,120"/>
    <path d="M210,108 L218,114 L210,120"/>
    <path d="M620,108 L628,114 L620,120"/>
  </g>
  <g font-size="13" fill="#111827" text-anchor="middle">
    <text x="130" y="82">D flip-flop</text>
    <text x="130" y="100" font-size="11" fill="#4b5563">sync stage 1</text>
    <text x="250" y="82">D flip-flop</text>
    <text x="250" y="100" font-size="11" fill="#4b5563">sync stage 2</text>
    <text x="370" y="90" font-size="16">!=</text>
    <text x="510" y="80">counter</text>
    <text x="510" y="98" font-size="11" fill="#4b5563">reset when equal,</text>
    <text x="510" y="112" font-size="11" fill="#4b5563">fire at COUNTER_MAX</text>
    <text x="660" y="82">output</text>
    <text x="660" y="100" font-size="11" fill="#4b5563">register</text>
  </g>
  <!-- wires -->
  <g stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="20" y1="85" x2="88" y2="85"/>
    <line x1="170" y1="85" x2="208" y2="85"/>
    <line x1="290" y1="85" x2="338" y2="85"/>
    <line x1="400" y1="85" x2="448" y2="85"/>
    <line x1="570" y1="85" x2="618" y2="85"/>
    <line x1="700" y1="85" x2="800" y2="85"/>
    <!-- feedback of button_out into comparator -->
    <path d="M720,85 V170 H370 V112"/>
    <!-- synchronized value also loads the output register -->
    <path d="M315,85 V30 H600 V70 H618"/>
  </g>
  <circle cx="720" cy="85" r="3" fill="#1f2937"/>
  <circle cx="315" cy="85" r="3" fill="#1f2937"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1d4ed8">
    <text x="20" y="76">button_in</text>
    <text x="300" y="24">button_sync_1</text>
    <text x="405" y="76">differ</text>
    <text x="574" y="76">load</text>
    <text x="728" y="76">button_out</text>
    <text x="480" y="186">button_out (fed back for comparison)</text>
  </g>
  <text x="130" y="145" font-size="11" fill="#6b7280" text-anchor="middle">clk</text>
  <text x="250" y="145" font-size="11" fill="#6b7280" text-anchor="middle">clk</text>
  <text x="660" y="145" font-size="11" fill="#6b7280" text-anchor="middle">clk</text>
</svg>
