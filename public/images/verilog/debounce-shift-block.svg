<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" font-family="Arial, Helvetica, sans-serif">
  <title>Shift register debouncer block diagram</title>
  <rect width="820" height="240" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <!-- sample tick generator -->
  <rect x="180" y="165" width="220" height="56" rx="4" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5"/>
  <text x="290" y="189" font-size="13" text-anchor="middle" fill="#111827">sample counter</text>
  <text x="290" y="207" font-size="11" text-anchor="middle" fill="#4b5563">one tick every SAMPLE_PERIOD clocks</text>
  <!-- shift register cells: new sample enters bit 0 and moves toward bit 7 -->
  <g fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5">
    <rect x="180" y="60" width="30" height="40"/><rect x="210" y="60" width="30" height="40"/>
    <rect x="240" y="60" width="30" height="40"/><rect x="270" y="60" width="30" height="40"/>
    <rect x="300" y="60" width="30" height="40"/><rect x="330" y="60" width="30" height="40"/>
    <rect x="360" y="60" width="30" height="40"/><rect x="390" y="60" width="30" height="40"/>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#111827" text-anchor="middle">
    <text x="195" y="85">0</text><text x="225" y="85">1</text><text x="255" y="85">2</text><text x="285" y="85">3</text>
    <text x="315" y="85">4</text><text x="345" y="85">5</text><text x="375" y="85">6</text><text x="405" y="85">7</text>
  </g>
  <text x="300" y="50" font-size="13" text-anchor="middle" fill="#111827">shift_reg (bit 0 = newest sample)</text>
  <!-- detectors and output -->
  <g fill="#f3f4f6" stroke="#1f2937" stroke-width="1.5">
    <rect x="500" y="36" width="130" height="36" rx="4"/>
    <rect x="500" y="88" width="130" height="36" rx="4"/>
    <rect x="670" y="52" width="90" height="56" rx="4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#111827">
    <text x="565" y="59">all 8 bits 1: set</text>
    <text x="565" y="111">all 8 bits 0: clear</text>
    <text x="715" y="77">output</text>
    <text x="715" y="93" font-size="11" fill="#4b5563">register</text>
  </g>
  <!-- wires -->
  <g stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="20" y1="80" x2="178" y2="80"/>
    <path d="M420,80 H465 V54 H498"/>
    <path d="M465,80 V106 H498"/>
    <path d="M630,54 H650 V68 H668"/>
    <path d="M630,106 H650 V92 H668"/>
    <line x1="760" y1="80" x2="808" y2="80"/>
    <line x1="290" y1="165" x2="290" y2="102"/>
    <path d="M400,193 H715 V110"/>
  </g>
  <!-- bus slash for 8-bit connection -->
  <line x1="437" y1="87" x2="447" y2="73" stroke="#1f2937" stroke-width="1.2"/>
  <text x="442" y="68" font-size="11" text-anchor="middle" fill="#4b5563">8</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#1d4ed8">
    <text x="20" y="72">button_sync_1</text>
    <text x="296" y="145">sample_tick (shift enable)</text>
    <text x="520" y="186">sample_tick (update enable)</text>
    <text x="736" y="72">button_out</text>
  </g>
  <text x="20" y="98" font-size="11" fill="#6b7280">(after 2-flop synchronizer)</text>
</svg>
