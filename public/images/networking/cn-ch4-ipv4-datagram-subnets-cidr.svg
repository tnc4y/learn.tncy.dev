<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#818cf8" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">4.3 IPV4 DATAGRAM HEADER (20 BYTES), FRAGMENTATION, SUBNETS &amp; CIDR</text>
  <rect x="22" y="64" width="916" height="106" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="84" fill="#94a3b8" font-family="monospace" font-size="10">Bit 0</text>
  <text x="480" y="84" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">WIRE-FORMAT PROTOCOL HEADER / FRAME ENCAPSULATION LAYOUT</text>
  <text x="920" y="84" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">Bit 31 / EOF</text>
  <rect x="36" y="94" width="191" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="131" y="120" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Ver(4) IHL(4) TOS(8) Len(1</text>
  <text x="131" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Row 1: Version=4, Total Leng</text>
  <rect x="231" y="94" width="191" height="62" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="326" y="120" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ID(16) Flags(3) FragOffset</text>
  <text x="326" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Row 2: MTU Fragmentation</text>
  <rect x="426" y="94" width="173" height="62" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="512" y="120" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">TTL(8) Proto(8) Checksum(1</text>
  <text x="512" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Row 3: Hop Limit &amp; L4 Proto</text>
  <rect x="603" y="94" width="155" height="62" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <text x="680" y="120" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Source IP Address (32b)</text>
  <text x="680" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Row 4: Sender 32-bit IPv4</text>
  <rect x="762" y="94" width="155" height="62" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="839" y="120" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Destination IP Address (32</text>
  <text x="839" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Row 5: Target 32-bit IPv4</text>
  <rect x="22" y="182" width="916" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="196" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="214" fill="#818cf8" font-family="monospace" font-size="11.5" font-weight="bold">20-Byte Base IPv4 Header Overhead</text>
  <text x="54" y="231" fill="#cbd5e1" font-family="monospace" font-size="10.5">20 bytes IP + 20 bytes TCP = 40 bytes total TCP/IP header overhead per segment</text>
  <rect x="38" y="248" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="266" fill="#818cf8" font-family="monospace" font-size="11.5" font-weight="bold">IP Fragmentation &amp; Reassembly</text>
  <text x="54" y="283" fill="#cbd5e1" font-family="monospace" font-size="10.5">Splits datagrams larger than link MTU (1500B); reassembled ONLY at final destination host using ID, Offset &amp; MF flag</text>
  <rect x="38" y="300" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="318" fill="#818cf8" font-family="monospace" font-size="11.5" font-weight="bold">What is an IP Subnet?</text>
  <text x="54" y="335" fill="#cbd5e1" font-family="monospace" font-size="10.5">Set of device interfaces with identical subnet prefix bits that can reach each other physically without a router</text>
  <rect x="38" y="352" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="370" fill="#818cf8" font-family="monospace" font-size="11.5" font-weight="bold">CIDR (Classless Interdomain Routing)</text>
  <text x="54" y="387" fill="#cbd5e1" font-family="monospace" font-size="10.5">Replaces wasteful Class A/B/C boundaries with arbitrary prefix masks a.b.c.d/x (e.g., 200.23.16.0/23 = 512 IPs)</text>
</svg>