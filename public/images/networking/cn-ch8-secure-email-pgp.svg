  <text x="74" y="250" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Step 1: Digital Signature Construction</text>
  <text x="74" y="268" fill="#cbd5e1" font-family="monospace" font-size="10.5">Alice hashes cleartext message H(m) and encrypts the digest with her own private key K_A^-(H(m))</text>
