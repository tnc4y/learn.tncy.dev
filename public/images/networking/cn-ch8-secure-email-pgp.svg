  <text x="74" y="192" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Three Security Goals for Electronic Mail</text>
  <text x="74" y="210" fill="#cbd5e1" font-family="monospace" font-size="10.5">1) Sender Authentication &amp; Integrity (Alice signed it), 2) Confidentiality (only Bob can read it), 3) Efficiency (single p</text>
  <rect x="38" y="230" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
