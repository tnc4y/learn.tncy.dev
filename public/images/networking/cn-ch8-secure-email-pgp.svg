  <text x="74" y="308" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Step 2: Symmetric Session Key Encryption</text>
  <text x="74" y="326" fill="#cbd5e1" font-family="monospace" font-size="10.5">Alice generates a one-time random symmetric key K_S and encrypts the bundle K_S(m || K_A^-(H(m)))</text>
