<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#10b981" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">3.8 EVOLUTION OF TRANSPORT: QUIC ARCHITECTURE, STREAMS &amp; ZERO HOL BLOCKING</text>
  <rect x="22" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="128" y="95" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">QUIC over UDP Port 443</text>
  <text x="128" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">User-Space Transport + Crypto</text>
  <line x1="236" y1="104" x2="254" y2="104" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="256" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="362" y="95" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1-RTT / 0-RTT Handshake</text>
  <text x="362" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Merged Transport + TLS 1.3 Keys</text>
  <line x1="470" y1="104" x2="488" y2="104" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="490" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="596" y="95" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Independent Stream IDs</text>
  <text x="596" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Per-Stream Reliable Byte Framing</text>
  <line x1="704" y1="104" x2="722" y2="104" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="724" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
  <text x="830" y="95" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Connection ID Migration</text>
  <text x="830" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Survives WiFi -&gt; 5G IP Changes</text>
  <rect x="22" y="158" width="916" height="254" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="172" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="196" r="8" fill="#10b981"/>
  <text x="56" y="200" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1</text>
  <text x="74" y="192" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">User-Space Evolution over UDP</text>
  <text x="74" y="210" fill="#cbd5e1" font-family="monospace" font-size="10.5">Deploying new kernel TCP features takes a decade; running QUIC over UDP allows rapid updates in browsers/apps</text>
  <rect x="38" y="230" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="254" r="8" fill="#10b981"/>
  <text x="56" y="258" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2</text>
  <text x="74" y="250" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Merged Transport + TLS 1.3 Handshake</text>
  <text x="74" y="268" fill="#cbd5e1" font-family="monospace" font-size="10.5">Establishes reliability state and cryptographic keys in 1 RTT (or 0 RTT with cached session tickets)</text>
  <rect x="38" y="288" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="312" r="8" fill="#10b981"/>
  <text x="56" y="316" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3</text>
  <text x="74" y="308" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Eliminating Transport HOL Blocking</text>
  <text x="74" y="326" fill="#cbd5e1" font-family="monospace" font-size="10.5">Each HTTP/3 object rides its own QUIC Stream ID; a lost UDP packet only stalls the single affected stream</text>
  <rect x="38" y="346" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="370" r="8" fill="#10b981"/>
  <text x="56" y="374" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4</text>
  <text x="74" y="366" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Connection ID Mobility</text>
  <text x="74" y="384" fill="#cbd5e1" font-family="monospace" font-size="10.5">Identifies connections via 64-bit Connection ID rather than IP 4-tuple, surviving WiFi-to-5G network switches</text>
</svg>