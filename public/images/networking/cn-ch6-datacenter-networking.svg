  <text x="504" y="123" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">East-West Microservices Traffic Dominance</text>
  <text x="504" y="142" fill="#cbd5e1" font-family="monospace" font-size="10">A single external user request triggers ratusan internal RPCs betw</text>
