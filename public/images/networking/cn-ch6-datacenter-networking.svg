  <text x="504" y="271" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">RDMA over Converged Ethernet (RoCEv2)</text>
  <text x="504" y="290" fill="#cbd5e1" font-family="monospace" font-size="10">Bypasses OS kernel TCP/IP stack for direct NIC-to-memory transfers</text>
  <text x="504" y="305" fill="#94a3b8" font-family="monospace" font-size="9.5">; uses Priority Flow Control (PFC) &amp; DCQCN</text>
