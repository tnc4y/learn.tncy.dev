  <text x="504" y="216" fill="#cbd5e1" font-family="monospace" font-size="10">Every Top-of-Rack (ToR) Leaf switch connects to every Spine switch</text>
  <text x="504" y="231" fill="#94a3b8" font-family="monospace" font-size="9.5">, providing rich Equal-Cost Multipath (ECMP) bisection bandwidth</text>
