<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">5.2B DISTANCE VECTOR ROUTING: BELLMAN-FORD, COUNT-TO-INFINITY &amp; POISONED REVERSE</text>
  <rect x="20" y="62" width="440" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="240" y="85" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">NETWORK TOPOLOGY &amp; ROUTING GRAPH G=(N,E)</text>
  <line x1="105" y1="220" x2="245" y2="120" stroke="#475569" stroke-width="1.8"/>
  <rect x="139" y="160" width="72" height="18" rx="4" fill="#0b1120" stroke="#475569" stroke-width="1"/>
  <text x="175" y="173" fill="#f8fafc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">c=4 -&gt; 60!</text>
  <line x1="105" y1="220" x2="355" y2="250" stroke="#34d399" stroke-width="3.5"/>
  <rect x="194" y="225" width="72" height="18" rx="4" fill="#0b1120" stroke="#34d399" stroke-width="1"/>
  <text x="230" y="238" fill="#f8fafc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">c=50</text>
  <line x1="245" y1="120" x2="355" y2="250" stroke="#34d399" stroke-width="3.5"/>
  <rect x="264" y="175" width="72" height="18" rx="4" fill="#0b1120" stroke="#34d399" stroke-width="1"/>
  <text x="300" y="188" fill="#f8fafc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">c=1 (Loop!)</text>
  <circle cx="105" cy="220" r="22" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
  <text x="105" y="224" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">x</text>
  <rect x="47" y="245" width="116" height="17" rx="4" fill="#0b1120" fill-opacity="0.9"/>
  <text x="105" y="257" fill="#34d399" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">Node x (Target)</text>
  <circle cx="245" cy="120" r="22" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="245" y="124" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">y</text>
  <rect x="187" y="145" width="116" height="17" rx="4" fill="#0b1120" fill-opacity="0.9"/>
  <text x="245" y="157" fill="#fbbf24" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">Node y (Dy(x)=4-&gt;60)</text>
  <circle cx="355" cy="250" r="22" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
  <text x="355" y="254" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">z</text>
  <rect x="297" y="275" width="116" height="17" rx="4" fill="#0b1120" fill-opacity="0.9"/>
  <text x="355" y="287" fill="#ef4444" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">Node z (Dz(x)=5 via </text>
  <rect x="475" y="62" width="465" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="707" y="86" fill="#f59e0b" font-family="monospace" font-size="12.5" font-weight="bold" text-anchor="middle">TOPOLOGY &amp; ROUTING STATE ANALYSIS</text>
  <rect x="490" y="102" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="123" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Bellman-Ford Dynamic Programming</text>
  <text x="504" y="142" fill="#cbd5e1" font-family="monospace" font-size="10">Each router x updates its distance vector from neighbors v: Dx(y) </text>
  <text x="504" y="157" fill="#94a3b8" font-family="monospace" font-size="9.5">= min_v { c(x,v) + Dv(y) }</text>
  <rect x="490" y="176" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="197" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Decentralized &amp; Asynchronous</text>
  <text x="504" y="216" fill="#cbd5e1" font-family="monospace" font-size="10">Routers only know direct neighbor link costs and exchange distance</text>
  <text x="504" y="231" fill="#94a3b8" font-family="monospace" font-size="9.5"> vectors only when local costs/vectors change</text>
  <rect x="490" y="250" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="271" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Count-to-Infinity (&#x27;Bad News Travels Slowly&#x27;)</text>
  <text x="504" y="290" fill="#cbd5e1" font-family="monospace" font-size="10">When c(x,y) jumps 4 -&gt; 60, y sees z&#x27;s stale Dz(x)=5 (which actuall</text>
  <text x="504" y="305" fill="#94a3b8" font-family="monospace" font-size="9.5">y routes through y!) and loops 44 iterations</text>
  <rect x="490" y="324" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="345" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Poisoned Reverse Defense</text>
  <text x="504" y="364" fill="#cbd5e1" font-family="monospace" font-size="10">Since z routes to x via y, z lies to y that Dz(x) = infinity, brea</text>
  <text x="504" y="379" fill="#94a3b8" font-family="monospace" font-size="9.5">king 2-node routing loops immediately</text>
</svg>