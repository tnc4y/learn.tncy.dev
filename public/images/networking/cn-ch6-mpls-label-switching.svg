<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#f472b6" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">6.5 MULTIPROTOCOL LABEL SWITCHING (MPLS): SHIM HEADER, LSRS &amp; TRAFFIC ENGINEERING</text>
  <rect x="22" y="64" width="916" height="106" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="84" fill="#94a3b8" font-family="monospace" font-size="10">Bit 0</text>
  <text x="480" y="84" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">WIRE-FORMAT PROTOCOL HEADER / FRAME ENCAPSULATION LAYOUT</text>
  <text x="920" y="84" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">Bit 31 / EOF</text>
  <rect x="36" y="94" width="173" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="122" y="120" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">L2 Ethernet Header</text>
  <text x="122" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Link-Layer Frame</text>
  <rect x="213" y="94" width="226" height="62" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="326" y="120" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MPLS Label (20 bits)</text>
  <text x="326" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Fixed-Length Lookup Index</text>
  <rect x="443" y="94" width="209" height="62" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="547" y="120" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Exp/TC(3b) + S(1b) + TTL(8</text>
  <text x="547" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">QoS Class, Stack Bit &amp; Hop T</text>
  <rect x="656" y="94" width="262" height="62" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <text x="787" y="120" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">L3 IP Datagram + Payload</text>
  <text x="787" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Untouched During LSR Hops</text>
  <rect x="22" y="182" width="916" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="196" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="214" fill="#f472b6" font-family="monospace" font-size="11.5" font-weight="bold">32-Bit MPLS Shim Header (Layer 2.5)</text>
  <text x="54" y="231" fill="#cbd5e1" font-family="monospace" font-size="10.5">Inserted between L2 Ethernet header and L3 IP header; contains 20-bit Label, 3-bit QoS Exp, 1-bit Bottom-of-Stack S, and 8-b</text>
  <rect x="38" y="248" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="266" fill="#f472b6" font-family="monospace" font-size="11.5" font-weight="bold">Label-Switched Router (LSR) Forwarding</text>
  <text x="54" y="283" fill="#cbd5e1" font-family="monospace" font-size="10.5">Forwards packets by indexing fixed-length 20-bit MPLS label and swapping labels on egress without inspecting the IP header</text>
  <rect x="38" y="300" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="318" fill="#f472b6" font-family="monospace" font-size="11.5" font-weight="bold">RSVP-TE Signaling &amp; Explicit Paths</text>
  <text x="54" y="335" fill="#cbd5e1" font-family="monospace" font-size="10.5">Distributes label bindings along pre-computed Label-Switched Paths (LSPs) that can diverge from default OSPF shortest paths</text>
  <rect x="38" y="352" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="370" fill="#f472b6" font-family="monospace" font-size="11.5" font-weight="bold">MPLS Fast Reroute &amp; VPNs</text>
  <text x="54" y="387" fill="#cbd5e1" font-family="monospace" font-size="10.5">Enables sub-50ms backup path failover and isolated enterprise Layer-3 MPLS VPNs across carrier backbones</text>
</svg>