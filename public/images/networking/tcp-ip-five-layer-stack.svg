<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="900" height="420" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="450" y="36" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">INTERNET 5-LAYER PROTOCOL STACK &amp; END-TO-END ENCAPSULATION (KUROSE &amp; ROSS 9E)</text>
  <g font-family="monospace" font-size="13">
    <rect x="40" y="60" width="360" height="54" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="220" y="83" fill="#93c5fd" font-weight="bold" text-anchor="middle">5. APPLICATION LAYER (Message M)</text>
    <text x="220" y="102" fill="#e2e8f0" font-size="11" text-anchor="middle">HTTP/1.1, HTTP/2, HTTP/3, QUIC, DNS, SMTP, IMAP, DASH</text>

    <rect x="40" y="126" width="360" height="54" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="220" y="149" fill="#6ee7b7" font-weight="bold" text-anchor="middle">4. TRANSPORT LAYER (Segment: Ht | M)</text>
    <text x="220" y="168" fill="#e2e8f0" font-size="11" text-anchor="middle">TCP (3-Way Handshake, rdt, AIMD, CUBIC, BBR), UDP</text>

    <rect x="40" y="192" width="360" height="54" rx="8" fill="#581c87" stroke="#c084fc" stroke-width="1.5"/>
    <text x="220" y="215" fill="#d8b4fe" font-weight="bold" text-anchor="middle">3. NETWORK LAYER (Datagram: Hn | Ht | M)</text>
    <text x="220" y="234" fill="#e2e8f0" font-size="11" text-anchor="middle">IPv4, IPv6, CIDR, DHCP, NAT, ICMP, OSPF, BGP, SDN/OpenFlow</text>

    <rect x="40" y="258" width="360" height="54" rx="8" fill="#7c2d12" stroke="#fb923c" stroke-width="1.5"/>
    <text x="220" y="281" fill="#fdba74" font-weight="bold" text-anchor="middle">2. LINK LAYER (Frame: Hl | Hn | Ht | M | CRC)</text>
    <text x="220" y="300" fill="#e2e8f0" font-size="11" text-anchor="middle">Ethernet 802.3, WiFi 802.11, CSMA/CD, CSMA/CA, ARP, VLAN, MPLS</text>

    <rect x="40" y="324" width="360" height="54" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
    <text x="220" y="347" fill="#a5b4fc" font-weight="bold" text-anchor="middle">1. PHYSICAL LAYER (Bits on Wire / RF)</text>
    <text x="220" y="366" fill="#e2e8f0" font-size="11" text-anchor="middle">Twisted Pair, Fiber Optics, QPSK/QAM, OFDM/OFDMA, MIMO, 5G NR</text>

    <rect x="450" y="60" width="410" height="318" rx="10" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
    <text x="655" y="88" fill="#38bdf8" font-weight="bold" text-anchor="middle">PACKET ENCAPSULATION HIERARCHY</text>
    <rect x="590" y="108" width="180" height="34" rx="4" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="680" y="130" fill="#fff" text-anchor="middle">App Message (M)</text>

    <rect x="540" y="160" width="50" height="34" rx="4" fill="#065f46" stroke="#34d399"/>
    <text x="565" y="182" fill="#6ee7b7" text-anchor="middle">Ht</text>
    <rect x="590" y="160" width="180" height="34" rx="4" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="680" y="182" fill="#fff" text-anchor="middle">Message (M)</text>

    <rect x="490" y="212" width="50" height="34" rx="4" fill="#581c87" stroke="#c084fc"/>
    <text x="515" y="234" fill="#d8b4fe" text-anchor="middle">Hn</text>
    <rect x="540" y="212" width="50" height="34" rx="4" fill="#065f46" stroke="#34d399"/>
    <text x="565" y="234" fill="#6ee7b7" text-anchor="middle">Ht</text>
    <rect x="590" y="212" width="180" height="34" rx="4" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="680" y="234" fill="#fff" text-anchor="middle">Message (M)</text>

    <rect x="465" y="264" width="35" height="34" rx="4" fill="#7c2d12" stroke="#fb923c"/>
    <text x="482" y="286" fill="#fdba74" font-size="11" text-anchor="middle">Hl</text>
    <rect x="500" y="264" width="45" height="34" rx="4" fill="#581c87" stroke="#c084fc"/>
    <text x="522" y="286" fill="#d8b4fe" font-size="11" text-anchor="middle">Hn</text>
    <rect x="545" y="264" width="45" height="34" rx="4" fill="#065f46" stroke="#34d399"/>
    <text x="567" y="286" fill="#6ee7b7" font-size="11" text-anchor="middle">Ht</text>
    <rect x="590" y="264" width="160" height="34" rx="4" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="670" y="286" fill="#fff" font-size="11" text-anchor="middle">Message (M)</text>
    <rect x="750" y="264" width="45" height="34" rx="4" fill="#7c2d12" stroke="#fb923c"/>
    <text x="772" y="286" fill="#fdba74" font-size="11" text-anchor="middle">CRC</text>

    <text x="655" y="335" fill="#94a3b8" font-size="11" text-anchor="middle">d_nodal = d_proc + d_queue + d_trans (L/R) + d_prop (d/s)</text>
    <text x="655" y="357" fill="#38bdf8" font-size="11" text-anchor="middle">Switches process L1-L2 | Routers process L1-L3 | Hosts L1-L5</text>
  </g>
</svg>