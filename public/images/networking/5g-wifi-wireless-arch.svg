<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <rect width="900" height="400" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="34" fill="#f8fafc" font-family="monospace" font-size="17" font-weight="bold" text-anchor="middle">WIRELESS &amp; MOBILE NETWORKS: MIMO, QAM, OFDMA, 802.11 WIFI &amp; 5G RAN / CORE (CUPS)</text>
  <g font-family="monospace" font-size="12">
    <rect x="35" y="60" width="400" height="310" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="235" y="86" fill="#38bdf8" font-weight="bold" text-anchor="middle">PHY &amp; WIRELESS MAC LAYER</text>
    <text x="235" y="114" fill="#e2e8f0" font-size="11" text-anchor="middle">Shannon Capacity: C = B * log2(1 + SNR)</text>
    <text x="235" y="140" fill="#6ee7b7" font-size="11" text-anchor="middle">Modulation: BPSK (1b) -&gt; QPSK (2b) -&gt; 16-QAM (4b) -&gt; 64-QAM (6b)</text>
    <text x="235" y="166" fill="#fde68a" font-size="11" text-anchor="middle">MIMO: Spatial Diversity + Spatial Multiplexing + Beamforming</text>
    <text x="235" y="192" fill="#d8b4fe" font-size="11" text-anchor="middle">OFDMA: 2D Grid of Orthogonal Subcarriers x Time Slots (RBs)</text>
    <text x="235" y="218" fill="#fdba74" font-size="11" text-anchor="middle">802.11 CSMA/CA: DIFS + Random Backoff + RTS/CTS + SIFS + ACK</text>
    <text x="235" y="244" fill="#93c5fd" font-size="11" text-anchor="middle">802.11 Frame: Addr1(RA), Addr2(TA), Addr3(Router/Src), Addr4</text>
    <text x="235" y="272" fill="#f472b6" font-size="11" text-anchor="middle">RAN Scheduling: Max Throughput vs Blind Equal Throughput (BET)</text>
    <text x="235" y="300" fill="#cbd5e1" font-size="11" text-anchor="middle">Bluetooth FHSS &amp; L2CAP | LEO Satellites (Starlink Ku/Ka/ISL)</text>

    <rect x="465" y="60" width="400" height="310" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="665" y="86" fill="#6ee7b7" font-weight="bold" text-anchor="middle">5G NR RAN &amp; 5G CORE NETWORK (CUPS)</text>
    <rect x="490" y="105" width="350" height="75" rx="6" fill="#0f172a" stroke="#60a5fa"/>
    <text x="665" y="128" fill="#93c5fd" font-weight="bold" text-anchor="middle">5G RAN Packet Pipeline &amp; Split RAN</text>
    <text x="665" y="150" fill="#e2e8f0" font-size="11" text-anchor="middle">SDAP -&gt; PDCP -&gt; RLC -&gt; MAC -&gt; PHY (RU / DU / CU Split)</text>
    <text x="665" y="168" fill="#38bdf8" font-size="10" text-anchor="middle">SD-RAN Near-Real-Time RIC + xApps</text>

    <rect x="490" y="195" width="350" height="75" rx="6" fill="#0f172a" stroke="#c084fc"/>
    <text x="665" y="218" fill="#d8b4fe" font-weight="bold" text-anchor="middle">5G Control Plane (Service-Based Architecture)</text>
    <text x="665" y="240" fill="#e2e8f0" font-size="11" text-anchor="middle">AMF (Access/Mobility) | SMF (Session) | AUSF / UDM (Auth)</text>

    <rect x="490" y="280" width="350" height="70" rx="6" fill="#0f172a" stroke="#34d399"/>
    <text x="665" y="303" fill="#6ee7b7" font-weight="bold" text-anchor="middle">5G User Plane (UPF) &amp; Handover</text>
    <text x="665" y="325" fill="#e2e8f0" font-size="11" text-anchor="middle">GTP-U Encapsulated Tunnels (UE &lt;-&gt; gNB &lt;-&gt; UPF &lt;-&gt; Internet)</text>
  </g>
</svg>