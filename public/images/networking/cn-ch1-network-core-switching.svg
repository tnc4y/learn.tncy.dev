<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1.3 THE NETWORK CORE: PACKET SWITCHING (STORE-AND-FORWARD) vs. CIRCUIT SWITCHING</text>
  <rect x="20" y="62" width="425" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="232" y="86" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">NONLINEAR PERFORMANCE / QUEUEING CURVE</text>
  <line x1="60" y1="335" x2="410" y2="335" stroke="#64748b" stroke-width="2"/>
  <line x1="60" y1="335" x2="60" y2="105" stroke="#64748b" stroke-width="2"/>
  <line x1="375" y1="105" x2="375" y2="335" stroke="#ef4444" stroke-dasharray="5,5"/>
  <path d="M 65 325 Q 240 318 315 260 T 370 112" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
  <text x="235" y="354" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Offered Load / Traffic Intensity (La / R -> 1.0)</text>
  <rect x="34" y="364" width="396" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="232" y="385" fill="#fde68a" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Store-and-Forward (N links): d_e2e = N * (L / R) | Statistical</text>
  <rect x="460" y="62" width="480" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="86" fill="#f59e0b" font-family="monospace" font-size="12.5" font-weight="bold" text-anchor="middle">PACKET vs. CIRCUIT SWITCHING COMPARISON</text>
  <rect x="476" y="102" width="448" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="123" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Store-and-Forward</text>
  <text x="490" y="142" fill="#cbd5e1" font-family="monospace" font-size="10">Router must receive all L bits before transmitting 1st bit on outbou</text>
  <text x="490" y="157" fill="#94a3b8" font-family="monospace" font-size="9.5">nd link (L/R sec)</text>
  <rect x="476" y="176" width="448" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="197" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Queueing &amp; Loss</text>
  <text x="490" y="216" fill="#cbd5e1" font-family="monospace" font-size="10">When arrival rate exceeds link capacity R, output buffer fills and d</text>
  <text x="490" y="231" fill="#94a3b8" font-family="monospace" font-size="9.5">rops tail packets</text>
  <rect x="476" y="250" width="448" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="271" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Circuit Switching (FDM/TDM)</text>
  <text x="490" y="290" fill="#cbd5e1" font-family="monospace" font-size="10">Reserves dedicated frequency band or time slot end-to-end; idle capa</text>
  <text x="490" y="305" fill="#94a3b8" font-family="monospace" font-size="9.5">city is wasted</text>
  <rect x="476" y="324" width="448" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="345" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Statistical Multiplexing</text>
  <text x="490" y="364" fill="#cbd5e1" font-family="monospace" font-size="10">On-demand bandwidth sharing; supports 35 active bursty users on a 1 </text>
  <text x="490" y="379" fill="#94a3b8" font-family="monospace" font-size="9.5">Mbps link (p=0.1)</text>
</svg>