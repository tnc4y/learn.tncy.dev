<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#34d399" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">2.4B DNS RESOURCE RECORDS (A, NS, CNAME, MX), WIRE FORMAT &amp; DNSSEC</text>
  <rect x="22" y="64" width="916" height="106" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="84" fill="#94a3b8" font-family="monospace" font-size="10">Bit 0</text>
  <text x="480" y="84" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">WIRE-FORMAT PROTOCOL HEADER / FRAME ENCAPSULATION LAYOUT</text>
  <text x="920" y="84" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">Bit 31 / EOF</text>
  <rect x="36" y="94" width="191" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="131" y="120" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ID (16b) + Flags (16b)</text>
  <text x="131" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Query/Reply, RD, RA, AA</text>
  <rect x="231" y="94" width="191" height="62" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="326" y="120" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Counts (QD, AN, NS, AR)</text>
  <text x="326" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Question &amp; RR Counts</text>
  <rect x="426" y="94" width="155" height="62" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="503" y="120" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Questions Section</text>
  <text x="503" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">QNAME + QTYPE</text>
  <rect x="585" y="94" width="191" height="62" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <text x="680" y="120" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Answer RRs (Name, Type, TT</text>
  <text x="680" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">A / AAAA / CNAME / MX</text>
  <rect x="780" y="94" width="138" height="62" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="849" y="120" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DNSSEC RRSIG / DNSKEY</text>
  <text x="849" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Crypto Auth</text>
  <rect x="22" y="182" width="916" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="196" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="214" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">Type=A &amp; Type=AAAA Records</text>
  <text x="54" y="231" fill="#cbd5e1" font-family="monospace" font-size="10.5">Name is hostname, Value is 32-bit IPv4 address (A) or 128-bit IPv6 address (AAAA)</text>
  <rect x="38" y="248" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="266" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">Type=NS &amp; Type=CNAME Records</text>
  <text x="54" y="283" fill="#cbd5e1" font-family="monospace" font-size="10.5">NS delegates domain zone to authoritative server hostname; CNAME maps alias name to canonical hostname</text>
  <rect x="38" y="300" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="318" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">Type=MX (Mail Exchanger)</text>
  <text x="54" y="335" fill="#cbd5e1" font-family="monospace" font-size="10.5">Maps domain name to the canonical hostname of its incoming SMTP mail server</text>
  <rect x="38" y="352" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="370" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">DNSSEC Cryptographic Integrity</text>
  <text x="54" y="387" fill="#cbd5e1" font-family="monospace" font-size="10.5">Defends against DNS cache poisoning/spoofing by signing RRsets with private zone keys (RRSIG + DNSKEY chain)</text>
</svg>