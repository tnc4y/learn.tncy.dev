<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">3.1–3.2 TRANSPORT SERVICES &amp; MULTIPLEXING / DEMULTIPLEXING (UDP vs. TCP 4-TUPLE)</text>
  <rect x="22" y="64" width="916" height="106" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="84" fill="#94a3b8" font-family="monospace" font-size="10">Bit 0</text>
  <text x="480" y="84" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">WIRE-FORMAT PROTOCOL HEADER / FRAME ENCAPSULATION LAYOUT</text>
  <text x="920" y="84" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">Bit 31 / EOF</text>
  <rect x="36" y="94" width="218" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="145" y="120" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Source Port (16 bits)</text>
  <text x="145" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">0..65535 Ephemeral/Well-Know</text>
  <rect x="258" y="94" width="218" height="62" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="367" y="120" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Destination Port (16 bits)</text>
  <text x="367" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Target Socket Demux Key</text>
  <rect x="480" y="94" width="218" height="62" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <text x="589" y="120" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">L3 IP Header Fields</text>
  <text x="589" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Src IP + Dst IP (TCP 4-Tuple</text>
  <rect x="702" y="94" width="218" height="62" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="811" y="120" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Application Payload (M)</text>
  <text x="811" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Delivered to Socket Buffer</text>
  <rect x="22" y="182" width="916" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="196" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="214" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="bold">Logical End-to-End Communication</text>
  <text x="54" y="231" fill="#cbd5e1" font-family="monospace" font-size="10.5">Transport layer connects application processes on edge hosts while Network layer connects hosts</text>
  <rect x="38" y="248" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="266" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="bold">Connectionless UDP Demultiplexing</text>
  <text x="54" y="283" fill="#cbd5e1" font-family="monospace" font-size="10.5">OS directs arriving UDP segments to socket using ONLY the 2-tuple: (Destination IP, Destination Port)</text>
  <rect x="38" y="300" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="318" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="bold">Connection-Oriented TCP Demultiplexing</text>
  <text x="54" y="335" fill="#cbd5e1" font-family="monospace" font-size="10.5">OS directs arriving TCP segments using the full 4-tuple: (Src IP, Src Port, Dst IP, Dst Port)</text>
  <rect x="38" y="352" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="370" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="bold">Concurrent Web Server Sockets</text>
  <text x="54" y="387" fill="#cbd5e1" font-family="monospace" font-size="10.5">Multiple clients connecting to port 80/443 are demultiplexed into separate sockets via distinct Src IP/Port pairs</text>
</svg>