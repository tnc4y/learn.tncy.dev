<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#c084fc" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">5.5 SOFTWARE-DEFINED NETWORKING (SDN) CONTROL PLANE &amp; OPENFLOW API</text>
  <rect x="22" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="128" y="95" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Network Control Apps</text>
  <text x="128" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Routing, TE, Firewall, Load Bal.</text>
  <line x1="236" y1="104" x2="254" y2="104" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="256" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="362" y="95" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Northbound REST/Intent</text>
  <text x="362" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Network Graph &amp; State Abstractio</text>
  <line x1="470" y1="104" x2="488" y2="104" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="490" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="596" y="95" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">SDN Controller OS</text>
  <text x="596" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Link-State, Host &amp; Switch Manage</text>
  <line x1="704" y1="104" x2="722" y2="104" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="724" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
  <text x="830" y="95" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Southbound OpenFlow</text>
  <text x="830" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Packet-In / FlowMod to Switches</text>
  <rect x="22" y="158" width="916" height="254" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="172" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="196" r="8" fill="#c084fc"/>
  <text x="56" y="200" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1</text>
  <text x="74" y="192" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Why Traditional Per-Router Control Struggles</text>
  <text x="74" y="210" fill="#cbd5e1" font-family="monospace" font-size="10.5">Destination-based IP forwarding cannot easily split traffic flows across unequal paths or avoid harmonic oscillations</text>
  <rect x="38" y="230" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="254" r="8" fill="#c084fc"/>
  <text x="56" y="258" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2</text>
  <text x="74" y="250" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">3 Architectural Layers of SDN</text>
  <text x="74" y="268" fill="#cbd5e1" font-family="monospace" font-size="10.5">1) Data-plane switches, 2) SDN Controller (Network OS), 3) Network-control applications using Northbound APIs</text>
  <rect x="38" y="288" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="312" r="8" fill="#c084fc"/>
  <text x="56" y="316" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3</text>
  <text x="74" y="308" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Southbound OpenFlow Protocol</text>
  <text x="74" y="326" fill="#cbd5e1" font-family="monospace" font-size="10.5">Controller pushes FlowMod match+action rules down to switches and receives Packet-In / Port-Status events</text>
  <rect x="38" y="346" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="370" r="8" fill="#c084fc"/>
  <text x="56" y="374" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4</text>
  <text x="74" y="366" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Centralized Dijkstra Reactive Update</text>
  <text x="74" y="384" fill="#cbd5e1" font-family="monospace" font-size="10.5">When a link fails, switch sends OpenFlow Port-Status to controller; Routing App recomputes Dijkstra and pushes new flows</text>
</svg>