<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <rect width="900" height="400" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="34" fill="#f8fafc" font-family="monospace" font-size="17" font-weight="bold" text-anchor="middle">NETWORK SECURITY: AES/RSA, SIGNATURES/PKI, TLS 1.3, IPSEC ESP, WPA2/5G &amp; FIREWALLS</text>
  <g font-family="monospace" font-size="12">
    <rect x="35" y="60" width="405" height="310" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="237" y="86" fill="#fbbf24" font-weight="bold" text-anchor="middle">CRYPTOGRAPHIC PRIMITIVES &amp; PKI</text>
    <text x="237" y="114" fill="#e2e8f0" font-size="11" text-anchor="middle">Symmetric: AES (128/192/256-bit blocks, CBC / GCM)</text>
    <text x="237" y="140" fill="#93c5fd" font-size="11" text-anchor="middle">Public Key (RSA): c = m^e mod n | m = c^d mod n</text>
    <text x="237" y="166" fill="#6ee7b7" font-size="11" text-anchor="middle">Digital Signature: K_B^-(H(m)) verified with K_B^+</text>
    <text x="237" y="192" fill="#d8b4fe" font-size="11" text-anchor="middle">Certification Authority (CA): Cert = K_CA^-(Bob, K_B^+)</text>
    <text x="237" y="218" fill="#f472b6" font-size="11" text-anchor="middle">Diffie-Hellman (ECDHE): Forward Secrecy Session Keys</text>
    <text x="237" y="246" fill="#fdba74" font-size="11" text-anchor="middle">Secure Email (PGP): Sign Hash + Symmetric Encrypt + Wrap Key</text>
    <text x="237" y="274" fill="#38bdf8" font-size="11" text-anchor="middle">WPA2-PSK 4-Way EAPOL Handshake &amp; 802.1X EAP-TTLS</text>
    <text x="237" y="302" fill="#cbd5e1" font-size="11" text-anchor="middle">5G Authentication: SUCI/SUPI, AMF/SEAF, AUSF, UDM &amp; K_SEAF</text>

    <rect x="460" y="60" width="405" height="310" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="662" y="86" fill="#f472b6" font-weight="bold" text-anchor="middle">TLS 1.3 (1-RTT), IPSEC ESP &amp; FIREWALLS</text>
    <rect x="485" y="105" width="355" height="75" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="662" y="127" fill="#38bdf8" font-weight="bold" text-anchor="middle">TLS 1.3 1-RTT Handshake</text>
    <text x="662" y="148" fill="#e2e8f0" font-size="11" text-anchor="middle">ClientHello + DH Public Share -&gt; ServerHello + Cert + Verify</text>
    <text x="662" y="166" fill="#6ee7b7" font-size="10" text-anchor="middle">AEAD Record Encryption (AES-GCM / ChaCha20-Poly1305)</text>

    <rect x="485" y="195" width="355" height="75" rx="6" fill="#0f172a" stroke="#34d399"/>
    <text x="662" y="217" fill="#34d399" font-weight="bold" text-anchor="middle">IPsec ESP Tunnel Mode (VPN)</text>
    <text x="662" y="238" fill="#e2e8f0" font-size="11" text-anchor="middle">[New IP Hdr][ESP Hdr (SPI, Seq)][Orig IP + Payload][ESP MAC]</text>
    <text x="662" y="256" fill="#fde68a" font-size="10" text-anchor="middle">Security Associations (SA) &amp; IKEv2 Key Negotiation</text>

    <rect x="485" y="280" width="355" height="70" rx="6" fill="#0f172a" stroke="#c084fc"/>
    <text x="662" y="302" fill="#d8b4fe" font-weight="bold" text-anchor="middle">Perimeter Defense: Firewalls &amp; IDS/IPS</text>
    <text x="662" y="324" fill="#e2e8f0" font-size="11" text-anchor="middle">Stateless ACLs | Stateful Connection Tracking | Snort IDS</text>
  </g>
</svg>