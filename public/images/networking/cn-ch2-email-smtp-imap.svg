<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#c084fc" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">2.3 ELECTRONIC MAIL ARCHITECTURE: USER AGENTS, MAIL SERVERS, SMTP &amp; IMAP</text>
  <rect x="22" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="128" y="95" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Alice User Agent</text>
  <text x="128" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Compose &amp; Submit (Port 587)</text>
  <line x1="236" y1="104" x2="254" y2="104" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="256" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="362" y="95" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Alice MTA Queue</text>
  <text x="362" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">SMTP Client over TCP 25</text>
  <line x1="470" y1="104" x2="488" y2="104" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="490" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="596" y="95" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Bob Mail Server</text>
  <text x="596" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">SMTP Server -&gt; Bob Mailbox</text>
  <line x1="704" y1="104" x2="722" y2="104" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="724" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
  <text x="830" y="95" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Bob User Agent</text>
  <text x="830" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">IMAP (143/993) or HTTPS Pull</text>
  <rect x="22" y="158" width="916" height="254" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="172" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="196" r="8" fill="#c084fc"/>
  <text x="56" y="200" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1</text>
  <text x="74" y="192" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">SMTP Push Architecture (RFC 5321)</text>
  <text x="74" y="210" fill="#cbd5e1" font-family="monospace" font-size="10.5">Uses persistent TCP connections and 7-bit ASCII commands (HELO, MAIL FROM, RCPT TO, DATA, QUIT)</text>
  <rect x="38" y="230" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="254" r="8" fill="#c084fc"/>
  <text x="56" y="258" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2</text>
  <text x="74" y="250" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Why Two Protocols (SMTP vs. IMAP)?</text>
  <text x="74" y="268" fill="#cbd5e1" font-family="monospace" font-size="10.5">SMTP is a push protocol for server-to-server relay; retrieving mail on demand requires a pull protocol (IMAP/HTTP)</text>
  <rect x="38" y="288" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="312" r="8" fill="#c084fc"/>
  <text x="56" y="316" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3</text>
  <text x="74" y="308" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">RFC 5322 Message Format &amp; MIME</text>
  <text x="74" y="326" fill="#cbd5e1" font-family="monospace" font-size="10.5">Headers (From:, To:, Subject:) separated from body by blank line (CRLF); MIME Base64 encodes binary attachments</text>
  <rect x="38" y="346" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="370" r="8" fill="#c084fc"/>
  <text x="56" y="374" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4</text>
  <text x="74" y="366" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">IMAP State Synchronization</text>
  <text x="74" y="384" fill="#cbd5e1" font-family="monospace" font-size="10.5">Maintains hierarchical folder state and read/unread flags across multiple client devices</text>
</svg>