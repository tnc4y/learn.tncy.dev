      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#818cf8" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">5.4 INTERNET INTER-AS ROUTING (BGP): eBGP, iBGP, AS-PATH, NEXT-HOP &amp; HOT POTATO</text>
  <rect x="20" y="62" width="440" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="240" y="85" fill="#818cf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">NETWORK TOPOLOGY &amp; ROUTING GRAPH G=(N,E)</text>
  <line x1="385" y1="195" x2="315" y2="195" stroke="#34d399" stroke-width="3.5"/>
  <rect x="314" y="185" width="72" height="18" rx="4" fill="#0b1120" stroke="#34d399" stroke-width="1"/>
  <text x="350" y="198" fill="#f8fafc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">X</text>
  <line x1="315" y1="195" x2="145" y2="195" stroke="#34d399" stroke-width="3.5"/>
  <rect x="194" y="185" width="72" height="18" rx="4" fill="#0b1120" stroke="#34d399" stroke-width="1"/>
  <text x="230" y="198" fill="#f8fafc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">eBGP: AS3 X</text>
  <line x1="315" y1="195" x2="230" y2="120" stroke="#475569" stroke-width="1.8"/>
  <rect x="236" y="147" width="72" height="18" rx="4" fill="#0b1120" stroke="#475569" stroke-width="1"/>
  <text x="272" y="160" fill="#f8fafc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">eBGP</text>
  <line x1="230" y1="120" x2="145" y2="305" stroke="#475569" stroke-width="1.8"/>
  <rect x="151" y="202" width="72" height="18" rx="4" fill="#0b1120" stroke="#475569" stroke-width="1"/>
  <text x="187" y="215" fill="#f8fafc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">eBGP: AS2 AS3 </text>
  <line x1="145" y1="195" x2="65" y2="250" stroke="#34d399" stroke-width="3.5"/>
  <rect x="69" y="212" width="72" height="18" rx="4" fill="#0b1120" stroke="#34d399" stroke-width="1"/>
  <text x="105" y="225" fill="#f8fafc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">cost=20</text>
  <line x1="145" y1="305" x2="65" y2="250" stroke="#475569" stroke-width="1.8"/>
  <rect x="69" y="267" width="72" height="18" rx="4" fill="#0b1120" stroke="#475569" stroke-width="1"/>
  <text x="105" y="280" fill="#f8fafc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">cost=35</text>
  <line x1="145" y1="195" x2="145" y2="305" stroke="#475569" stroke-width="1.8"/>
  <rect x="109" y="240" width="72" height="18" rx="4" fill="#0b1120" stroke="#475569" stroke-width="1"/>
  <text x="145" y="253" fill="#f8fafc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">iBGP</text>
  <circle cx="385" cy="195" r="22" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
  <text x="385" y="199" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">AS3</text>
  <rect x="327" y="220" width="116" height="17" rx="4" fill="#0b1120" fill-opacity="0.9"/>
  <text x="385" y="232" fill="#34d399" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">AS3 (Prefix X)</text>
  <circle cx="315" cy="195" r="22" fill="#1e293b" stroke="#34d399" stroke-width="2.5"/>
  <text x="315" y="199" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">3a</text>
  <rect x="257" y="220" width="116" height="17" rx="4" fill="#0b1120" fill-opacity="0.9"/>
  <text x="315" y="232" fill="#34d399" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">3a</text>
  <circle cx="230" cy="120" r="22" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="230" y="124" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">2c</text>
  <rect x="172" y="145" width="116" height="17" rx="4" fill="#0b1120" fill-opacity="0.9"/>
  <text x="230" y="157" fill="#fbbf24" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">AS2 (2c-&gt;2a)</text>
  <circle cx="145" cy="195" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="145" y="199" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1c</text>
  <rect x="87" y="220" width="116" height="17" rx="4" fill="#0b1120" fill-opacity="0.9"/>
  <text x="145" y="232" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">1c (eBGP)</text>
  <circle cx="145" cy="305" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="145" y="309" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1b</text>
  <rect x="87" y="330" width="116" height="17" rx="4" fill="#0b1120" fill-opacity="0.9"/>
  <text x="145" y="342" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">1b (iBGP)</text>
  <circle cx="65" cy="250" r="22" fill="#1e293b" stroke="#c084fc" stroke-width="2.5"/>
  <text x="65" y="254" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1d</text>
  <rect x="7" y="275" width="116" height="17" rx="4" fill="#0b1120" fill-opacity="0.9"/>
  <text x="65" y="287" fill="#c084fc" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">1d (Hot Potato)</text>
  <rect x="475" y="62" width="465" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="707" y="86" fill="#818cf8" font-family="monospace" font-size="12.5" font-weight="bold" text-anchor="middle">TOPOLOGY &amp; ROUTING STATE ANALYSIS</text>
  <rect x="490" y="102" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="123" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">eBGP vs. iBGP TCP Sessions (Port 179)</text>
  <text x="504" y="142" fill="#cbd5e1" font-family="monospace" font-size="10">eBGP learns reachability across AS borders; iBGP distributes exter</text>
  <text x="504" y="157" fill="#94a3b8" font-family="monospace" font-size="9.5">nal prefixes to all internal routers inside the AS</text>
  <rect x="490" y="176" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="197" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">AS-PATH &amp; NEXT-HOP Attributes</text>
  <text x="504" y="216" fill="#cbd5e1" font-family="monospace" font-size="10">AS-PATH lists traversed ASNs for loop detection and hop count; NEX</text>
  <text x="504" y="231" fill="#94a3b8" font-family="monospace" font-size="9.5">T-HOP gives the gateway IP beginning the path</text>
  <rect x="490" y="250" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="271" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Hot-Potato Routing Rule</text>
  <text x="504" y="290" fill="#cbd5e1" font-family="monospace" font-size="10">When multiple equal-length AS-PATHs exist, router 1d picks the egr</text>
  <text x="504" y="305" fill="#94a3b8" font-family="monospace" font-size="9.5">ess gateway (1c vs 1b) with minimum Intra-AS OSPF cost</text>
  <rect x="490" y="324" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="345" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">BGP Route Selection Tie-Breakers</text>
  <text x="504" y="364" fill="#cbd5e1" font-family="monospace" font-size="10">1) Highest Local Preference (Policy), 2) Shortest AS-PATH, 3) Clos</text>
  <text x="504" y="379" fill="#94a3b8" font-family="monospace" font-size="9.5">est NEXT-HOP (Hot Potato), 4) BGP Router ID</text>
</svg>