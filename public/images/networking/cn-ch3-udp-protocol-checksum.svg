<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#34d399" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">3.3 CONNECTIONLESS TRANSPORT (UDP): RFC 768 HEADER &amp; 1&#x27;S COMPLEMENT CHECKSUM</text>
  <rect x="22" y="64" width="916" height="106" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="84" fill="#94a3b8" font-family="monospace" font-size="10">Bit 0</text>
  <text x="480" y="84" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">WIRE-FORMAT PROTOCOL HEADER / FRAME ENCAPSULATION LAYOUT</text>
  <text x="920" y="84" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">Bit 31 / EOF</text>
  <rect x="36" y="94" width="173" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="122" y="120" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Source Port (16b)</text>
  <text x="122" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Sender Socket Port</text>
  <rect x="213" y="94" width="173" height="62" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="299" y="120" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Dest Port (16b)</text>
  <text x="299" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Receiver Socket Port</text>
  <rect x="390" y="94" width="173" height="62" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="476" y="120" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Length (16b)</text>
  <text x="476" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Header(8B) + Data Bytes</text>
  <rect x="567" y="94" width="173" height="62" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="653" y="120" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Checksum (16b)</text>
  <text x="653" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">1&#x27;s Complement Sum</text>
  <rect x="744" y="94" width="173" height="62" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="830" y="120" fill="#60a5fa" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Payload Data</text>
  <text x="830" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">DNS / QUIC / RTP Msg</text>
  <rect x="22" y="182" width="916" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="196" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="214" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">Why Choose UDP Over TCP?</text>
  <text x="54" y="231" fill="#cbd5e1" font-family="monospace" font-size="10.5">Zero handshake RTT delay, only 8 bytes of header overhead, no congestion-control throttling, finer app control</text>
  <rect x="38" y="248" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="266" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">16-Bit 1&#x27;s Complement Checksum</text>
  <text x="54" y="283" fill="#cbd5e1" font-family="monospace" font-size="10.5">Sum all 16-bit words, wrap any carry-out bit back into the LSB, and invert all bits (~sum)</text>
  <rect x="38" y="300" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="318" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">Receiver Verification Rule</text>
  <text x="54" y="335" fill="#cbd5e1" font-family="monospace" font-size="10.5">Receiver adds all 16-bit words including the received checksum; if no errors occurred, result is 1111111111111111</text>
  <rect x="38" y="352" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="370" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">End-to-End Principle for Error Detection</text>
  <text x="54" y="387" fill="#cbd5e1" font-family="monospace" font-size="10.5">Even if L2 links have CRC, bit flips can occur in router memory; transport checksum ensures end-to-end check</text>
</svg>