  <rect x="475" y="62" width="465" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="707" y="86" fill="#38bdf8" font-family="monospace" font-size="12.5" font-weight="bold" text-anchor="middle">TOPOLOGY &amp; ROUTING STATE ANALYSIS</text>
  <rect x="490" y="102" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="123" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Global Topology via Link-State Broadcast</text>
  <text x="504" y="142" fill="#cbd5e1" font-family="monospace" font-size="10">Every router floods Link-State Advertisements (LSAs) so all nodes </text>
  <text x="504" y="157" fill="#94a3b8" font-family="monospace" font-size="9.5">possess an identical map of G=(N,E)</text>
  <rect x="490" y="176" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="197" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Dijkstra&#x27;s Relaxation Rule</text>
  <text x="504" y="216" fill="#cbd5e1" font-family="monospace" font-size="10">At each step, add unvisited node w with min D(w) to N&#x27;, then updat</text>
  <text x="504" y="231" fill="#94a3b8" font-family="monospace" font-size="9.5">e neighbors: D(v) = min(D(v), D(w) + c(w,v))</text>
  <rect x="490" y="250" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="271" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Shortest-Path Tree from Source u</text>
  <text x="504" y="290" fill="#cbd5e1" font-family="monospace" font-size="10">Highlighted links (u-&gt;v=2, u-&gt;x=1, x-&gt;y=2, y-&gt;w=3, y-&gt;z=4) yield u</text>
  <text x="504" y="305" fill="#94a3b8" font-family="monospace" font-size="9.5">&#x27;s forwarding table (v via (u,v); x,y,w,z via (u,x))</text>
  <rect x="490" y="324" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="345" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Algorithmic Complexity &amp; Oscillations</text>
  <text x="504" y="364" fill="#cbd5e1" font-family="monospace" font-size="10">Requires O(|N|^2) comparisons (or O(|N|log|N|) with heap); randomi</text>
  <text x="504" y="379" fill="#94a3b8" font-family="monospace" font-size="9.5">zed LSA timers prevent congestion oscillations</text>
