<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" height="100%">
  <rect width="900" height="400" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="34" fill="#f8fafc" font-family="monospace" font-size="17" font-weight="bold" text-anchor="middle">NETWORK LAYER: DATA PLANE (LPM / OPENFLOW) &amp; CONTROL PLANE (OSPF / BGP / SDN)</text>
  <g font-family="monospace" font-size="12">
    <rect x="40" y="60" width="390" height="145" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="235" y="85" fill="#a5b4fc" font-weight="bold" text-anchor="middle">CONTROL PLANE (Network-Wide Routing Logic)</text>
    <text x="235" y="112" fill="#e2e8f0" font-size="11" text-anchor="middle">Intra-AS: OSPF (Dijkstra Link-State) / RIP (Bellman-Ford DV)</text>
    <text x="235" y="136" fill="#e2e8f0" font-size="11" text-anchor="middle">Inter-AS: BGP (eBGP/iBGP, AS-PATH, NEXT-HOP, Hot Potato)</text>
    <text x="235" y="160" fill="#38bdf8" font-size="11" text-anchor="middle">SDN Controller (ONOS / Google Orion) via Southbound OpenFlow</text>
    <text x="235" y="184" fill="#34d399" font-size="11" text-anchor="middle">Management: ICMP, SNMP/MIB, NETCONF &amp; YANG</text>

    <rect x="40" y="225" width="390" height="145" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="235" y="250" fill="#6ee7b7" font-weight="bold" text-anchor="middle">DATA PLANE (Per-Packet Forwarding in ns)</text>
    <text x="235" y="277" fill="#e2e8f0" font-size="11" text-anchor="middle">Input Port Line Card -&gt; Longest Prefix Match (TCAM)</text>
    <text x="235" y="301" fill="#e2e8f0" font-size="11" text-anchor="middle">Switching Fabric: Memory / Bus / Crossbar Network</text>
    <text x="235" y="325" fill="#fde68a" font-size="11" text-anchor="middle">Output Port Queuing &amp; Scheduling: FCFS, Priority, RR, WFQ</text>
    <text x="235" y="349" fill="#f472b6" font-size="11" text-anchor="middle">Generalized Forwarding: OpenFlow Match + Action Flow Table</text>

    <rect x="460" y="60" width="400" height="310" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="660" y="88" fill="#fbbf24" font-weight="bold" text-anchor="middle">OPENFLOW MATCH + ACTION ABSTRACTION</text>
    <rect x="485" y="110" width="350" height="65" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="660" y="133" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">MATCH HEADER FIELDS (L2 / L3 / L4)</text>
    <text x="660" y="155" fill="#e2e8f0" font-size="11" text-anchor="middle">Ingress Port | Src/Dst MAC | VLAN | Src/Dst IP | TCP/UDP Port</text>
    <rect x="485" y="195" width="350" height="65" rx="6" fill="#0f172a" stroke="#34d399"/>
    <text x="660" y="218" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">ACTIONS (Router / Switch / Firewall / NAT)</text>
    <text x="660" y="240" fill="#e2e8f0" font-size="11" text-anchor="middle">Forward(port) | Drop | Flood | Modify-Field(MAC/IP/Port)</text>
    <rect x="485" y="280" width="350" height="65" rx="6" fill="#0f172a" stroke="#c084fc"/>
    <text x="660" y="303" fill="#d8b4fe" font-size="11" font-weight="bold" text-anchor="middle">COUNTERS &amp; PRIORITY</text>
    <text x="660" y="325" fill="#e2e8f0" font-size="11" text-anchor="middle">Packet Count, Byte Count, Timeout, Rule Priority</text>
  </g>
</svg>