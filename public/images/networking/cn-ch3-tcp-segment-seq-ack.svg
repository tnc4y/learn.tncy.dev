<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#818cf8" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">3.5 TCP CONNECTION-ORIENTED TRANSPORT: RFC 793 HEADER, BYTE SEQ &amp; CUMULATIVE ACKS</text>
  <rect x="22" y="64" width="916" height="106" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="84" fill="#94a3b8" font-family="monospace" font-size="10">Bit 0</text>
  <text x="480" y="84" fill="#818cf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">WIRE-FORMAT PROTOCOL HEADER / FRAME ENCAPSULATION LAYOUT</text>
  <text x="920" y="84" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">Bit 31 / EOF</text>
  <rect x="36" y="94" width="155" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="113" y="120" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Src/Dst Ports (32b)</text>
  <text x="113" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Socket Endpoints</text>
  <rect x="195" y="94" width="191" height="62" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="290" y="120" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Sequence Number (32b)</text>
  <text x="290" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Byte Offset of 1st Data Byte</text>
  <rect x="390" y="94" width="191" height="62" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="485" y="120" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ACK Number (32b)</text>
  <text x="485" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Next Expected Byte Offset</text>
  <rect x="585" y="94" width="173" height="62" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <text x="671" y="120" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">HdrLen + Flags + rwnd</text>
  <text x="671" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">SYN/ACK/FIN/RST + Window</text>
  <rect x="762" y="94" width="155" height="62" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="839" y="120" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Checksum + Options</text>
  <text x="839" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">MSS, Window Scale, SACK</text>
  <rect x="22" y="182" width="916" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="196" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="214" fill="#818cf8" font-family="monospace" font-size="11.5" font-weight="bold">Byte-Stream Sequence Numbers</text>
  <text x="54" y="231" fill="#cbd5e1" font-family="monospace" font-size="10.5">TCP numbers every data byte; segment Sequence Number is the byte-stream number of its first payload byte</text>
  <rect x="38" y="248" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="266" fill="#818cf8" font-family="monospace" font-size="11.5" font-weight="bold">Cumulative Acknowledgments</text>
  <text x="54" y="283" fill="#cbd5e1" font-family="monospace" font-size="10.5">ACK number y means receiver has received all bytes through y-1 and is expecting byte y next</text>
  <rect x="38" y="300" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="318" fill="#818cf8" font-family="monospace" font-size="11.5" font-weight="bold">Piggybacking over Full-Duplex Pipe</text>
  <text x="54" y="335" fill="#cbd5e1" font-family="monospace" font-size="10.5">Host A-&gt;B segments carry both A&#x27;s outgoing data sequence number and A&#x27;s cumulative ACK for B&#x27;s data</text>
  <rect x="38" y="352" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="370" fill="#818cf8" font-family="monospace" font-size="11.5" font-weight="bold">Out-of-Order Segment Handling</text>
  <text x="54" y="387" fill="#cbd5e1" font-family="monospace" font-size="10.5">RFC leaves choice to implementer; production stacks buffer out-of-order bytes and send duplicate ACKs</text>
</svg>