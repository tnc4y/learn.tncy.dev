  <text x="380" y="212" fill="#94a3b8" font-family="monospace" font-size="10">I (cos)</text>
  <text x="242" y="112" fill="#94a3b8" font-family="monospace" font-size="10">Q (sin)</text>
  <rect x="34" y="364" width="396" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="232" y="385" fill="#fde68a" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Bit Rate R = Symbol Rate * log2(M) * CodeRate   |   16-QAM = 4</text>
  <rect x="460" y="62" width="480" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="700" y="86" fill="#34d399" font-family="monospace" font-size="12.5" font-weight="bold" text-anchor="middle">MATHEMATICAL MODEL &amp; SYSTEM BEHAVIOR</text>
  <rect x="476" y="102" width="448" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="123" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Forward Error Correction (FEC) &amp; Interleaving</text>
  <text x="490" y="142" fill="#cbd5e1" font-family="monospace" font-size="10">Adds redundant channel coding bits and scrambles bit order so burst </text>
  <text x="490" y="157" fill="#94a3b8" font-family="monospace" font-size="9.5">fading errors become correctable isolated errors</text>
  <rect x="476" y="176" width="448" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="197" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Phase &amp; Amplitude Modulation</text>
  <text x="490" y="216" fill="#cbd5e1" font-family="monospace" font-size="10">BPSK (1 bit/symbol), QPSK (2 bits/symbol), 16-QAM (4 bits/symbol), 6</text>
  <text x="490" y="231" fill="#94a3b8" font-family="monospace" font-size="9.5">4-QAM (6 bits/symbol), 256-QAM (8 bits/symbol)</text>
  <rect x="476" y="250" width="448" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="271" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Constellation Packing vs. Noise Immunity</text>
  <text x="490" y="290" fill="#cbd5e1" font-family="monospace" font-size="10">Denser QAM constellations pack more bits per symbol Hz, but points a</text>
  <text x="490" y="305" fill="#94a3b8" font-family="monospace" font-size="9.5">re closer together and more sensitive to noise</text>
  <rect x="476" y="324" width="448" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="345" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Adaptive Modulation &amp; Coding (MCS)</text>
  <text x="490" y="364" fill="#cbd5e1" font-family="monospace" font-size="10">WiFi and 5G receivers continuously feed back CQI/SNR so sender switc</text>
  <text x="490" y="379" fill="#94a3b8" font-family="monospace" font-size="9.5">hes between QPSK and 64/256-QAM in milliseconds</text>
</svg>