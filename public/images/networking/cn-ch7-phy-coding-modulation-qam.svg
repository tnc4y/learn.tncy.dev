    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#34d399" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">7.2B PHYSICAL LAYER CODING &amp; MODULATION: FEC, BPSK/QPSK, 16-QAM/64-QAM &amp; ADAPTIVE MCS</text>
  <rect x="20" y="62" width="425" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="232" y="86" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">16-QAM / QPSK IN-PHASE &amp; QUADRATURE CONSTELLATION</text>
  <line x1="75" y1="220" x2="390" y2="220" stroke="#64748b" stroke-width="1.5"/>
  <line x1="232" y1="100" x2="232" y2="340" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="132" cy="130" r="7" fill="#34d399" stroke="#f8fafc" stroke-width="1.5"/>
