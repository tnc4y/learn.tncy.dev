  <circle cx="266" cy="130" r="7" fill="#34d399" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="266" cy="190" r="7" fill="#34d399" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="266" cy="250" r="7" fill="#34d399" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="266" cy="310" r="7" fill="#34d399" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="332" cy="130" r="7" fill="#34d399" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="332" cy="190" r="7" fill="#34d399" stroke="#f8fafc" stroke-width="1.5"/>
