<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1.7 HISTORY OF COMPUTER NETWORKING &amp; THE INTERNET (1961–PRESENT)</text>
  <rect x="22" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="128" y="95" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1961–1972: ARPANET</text>
  <text x="128" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">KleinrockQueueing, Baran, IMPs &amp;</text>
  <line x1="236" y1="104" x2="254" y2="104" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="256" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="362" y="95" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1972–1983: TCP/IP</text>
  <text x="362" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Cerf &amp; Kahn Interneting, Flag Da</text>
  <line x1="470" y1="104" x2="488" y2="104" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="490" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="596" y="95" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1990s: Web &amp; Commercial</text>
  <text x="596" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">NSFNET Decommission, HTML/HTTP, </text>
  <line x1="704" y1="104" x2="722" y2="104" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="724" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
  <text x="830" y="95" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">2005–Today: Cloud &amp; 5G</text>
  <text x="830" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">SDN, Hyperscale Clos, QUIC/HTTP3</text>
  <rect x="22" y="158" width="916" height="254" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="172" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="196" r="8" fill="#a78bfa"/>
  <text x="56" y="200" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1</text>
  <text x="74" y="192" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Early Packet Switching (1961–1972)</text>
  <text x="74" y="210" fill="#cbd5e1" font-family="monospace" font-size="10.5">Kleinrock&#x27;s queueing theory, Baran&#x27;s survivable packet switching &amp; 1969 4-node ARPANET</text>
  <rect x="38" y="230" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="254" r="8" fill="#a78bfa"/>
  <text x="56" y="258" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2</text>
  <text x="74" y="250" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Internetworking &amp; TCP/IP (1972–1989)</text>
  <text x="74" y="268" fill="#cbd5e1" font-family="monospace" font-size="10.5">Cerf &amp; Kahn&#x27;s minimalist gateway architecture; January 1, 1983 ARPANET TCP/IP Flag Day; Jacobson congestion control</text>
  <rect x="38" y="288" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="312" r="8" fill="#a78bfa"/>
  <text x="56" y="316" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3</text>
  <text x="74" y="308" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">World Wide Web &amp; Commercialization (1990s)</text>
  <text x="74" y="326" fill="#cbd5e1" font-family="monospace" font-size="10.5">Berners-Lee&#x27;s HTTP/HTML at CERN, Mosaic/Netscape browsers, and commercial ISP backbone deregulation</text>
  <rect x="38" y="346" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="370" r="8" fill="#a78bfa"/>
  <text x="56" y="374" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4</text>
  <text x="74" y="366" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Hyperscale Cloud, SDN &amp; Mobile Era (2000s–Today)</text>
  <text x="74" y="384" fill="#cbd5e1" font-family="monospace" font-size="10.5">Google/Netflix private CDNs, Software-Defined Networking (OpenFlow), HTTP/3 QUIC, and 5G/Starlink</text>
</svg>