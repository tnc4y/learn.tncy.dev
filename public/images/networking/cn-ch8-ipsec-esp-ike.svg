  <text x="839" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Outer Integrity Check</text>
  <rect x="22" y="182" width="916" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="196" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="214" fill="#10b981" font-family="monospace" font-size="11.5" font-weight="bold">Blanket Layer-3 Security</text>
  <text x="54" y="231" fill="#cbd5e1" font-family="monospace" font-size="10.5">Encrypts and authenticates ALL traffic (TCP, UDP, ICMP, SNMP) between two routers or hosts transparently to upper-layer appl</text>
  <rect x="38" y="248" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="266" fill="#10b981" font-family="monospace" font-size="11.5" font-weight="bold">Transport Mode vs. Tunnel Mode</text>
  <text x="54" y="283" fill="#cbd5e1" font-family="monospace" font-size="10.5">Transport Mode encrypts only the L4 payload between two hosts; Tunnel Mode encapsulates the ENTIRE original IP datagram betw</text>
  <rect x="38" y="300" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="318" fill="#10b981" font-family="monospace" font-size="11.5" font-weight="bold">Encapsulating Security Payload (ESP - Protocol 50)</text>
  <text x="54" y="335" fill="#cbd5e1" font-family="monospace" font-size="10.5">Provides confidentiality, origin authentication, integrity, and anti-replay (whereas AH Protocol 51 omits encryption)</text>
  <rect x="38" y="352" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="370" fill="#10b981" font-family="monospace" font-size="11.5" font-weight="bold">Security Associations (SA) &amp; IKEv2</text>
  <text x="54" y="387" fill="#cbd5e1" font-family="monospace" font-size="10.5">Simplex logical connection indexed by 32-bit SPI in the SAD/SPD tables; Internet Key Exchange (IKE) automates mutual auth an</text>
</svg>