  <text x="574" y="120" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Encrypted [Orig IP + TCP +</text>
  <text x="574" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Confidentiality Across WAN</text>
  <rect x="762" y="94" width="155" height="62" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
