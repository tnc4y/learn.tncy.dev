<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#ef4444" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1.5 NETWORKS UNDER ATTACK: SNIFFING, IP SPOOFING, DDoS BOTNETS &amp; DEFENSE</text>
  <rect x="22" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="128" y="95" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Packet Sniffing</text>
  <text x="128" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Promiscuous NIC / WiFi Eavesdrop</text>
  <line x1="236" y1="104" x2="254" y2="104" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="256" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="362" y="95" fill="#ef4444" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">IP Address Spoofing</text>
  <text x="362" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Forging Source IP in Datagram He</text>
  <line x1="470" y1="104" x2="488" y2="104" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="490" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="2"/>
  <text x="596" y="95" fill="#ec4899" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">DDoS Botnet Flood</text>
  <text x="596" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">SYN / UDP / DNS Amplification Ex</text>
  <line x1="704" y1="104" x2="722" y2="104" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="724" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="830" y="95" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Defense Architecture</text>
  <text x="830" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Cryptographic Auth + TLS + State</text>
  <rect x="22" y="158" width="916" height="254" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="172" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="196" r="8" fill="#ef4444"/>
  <text x="56" y="200" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1</text>
  <text x="74" y="192" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Passive Packet Interception</text>
  <text x="74" y="210" fill="#cbd5e1" font-family="monospace" font-size="10.5">Broadcast wireless media &amp; unencrypted links allow Trudy to capture cleartext payloads</text>
  <rect x="38" y="230" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="254" r="8" fill="#ef4444"/>
  <text x="56" y="258" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2</text>
  <text x="74" y="250" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Source Identity Forgery</text>
  <text x="74" y="268" fill="#cbd5e1" font-family="monospace" font-size="10.5">Raw sockets inject arbitrary source IP addresses; mitigated via ISP ingress filtering (BCP 38)</text>
  <rect x="38" y="288" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="312" r="8" fill="#ef4444"/>
  <text x="56" y="316" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3</text>
  <text x="74" y="308" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Distributed Denial of Service (DDoS)</text>
  <text x="74" y="326" fill="#cbd5e1" font-family="monospace" font-size="10.5">Compromised botnets overwhelm target server CPU, TCP SYN queues, or access link bandwidth</text>
  <rect x="38" y="346" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="370" r="8" fill="#ef4444"/>
  <text x="56" y="374" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4</text>
  <text x="74" y="366" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Lines of Defense</text>
  <text x="74" y="384" fill="#cbd5e1" font-family="monospace" font-size="10.5">Authentication (proving identity), Confidentiality (encryption), Integrity (HMAC) &amp; Firewalls/IDS</text>
</svg>