<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#c084fc" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">6.4D VIRTUAL LANS (VLANS): PORT ISOLATION, TRUNKING &amp; IEEE 802.1Q TAGGING</text>
  <rect x="22" y="64" width="916" height="106" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="84" fill="#94a3b8" font-family="monospace" font-size="10">Bit 0</text>
  <text x="480" y="84" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">WIRE-FORMAT PROTOCOL HEADER / FRAME ENCAPSULATION LAYOUT</text>
  <text x="920" y="84" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">Bit 31 / EOF</text>
  <rect x="36" y="94" width="226" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="149" y="120" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Dst MAC (6B) + Src MAC (6B</text>
  <text x="149" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Standard Ethernet Header</text>
  <rect x="266" y="94" width="191" height="62" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="361" y="120" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">802.1Q TPID (2B = 0x8100)</text>
  <text x="361" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">VLAN Tag Protocol ID</text>
  <rect x="461" y="94" width="209" height="62" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="565" y="120" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">TCI: PCP(3b) DEI(1b) VID(1</text>
  <text x="565" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">12-Bit VLAN ID (0..4095)</text>
  <rect x="674" y="94" width="244" height="62" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <text x="796" y="120" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">EtherType(2B) + Payload + </text>
  <text x="796" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Recomputed 4-Byte FCS</text>
  <rect x="22" y="182" width="916" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="196" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="214" fill="#c084fc" font-family="monospace" font-size="11.5" font-weight="bold">Why Virtual LANs (VLANs) Are Needed</text>
  <text x="54" y="231" fill="#cbd5e1" font-family="monospace" font-size="10.5">Single large L2 broadcast domains suffer ARP/DHCP broadcast storms, lack departmental security isolation, and tie hosts to p</text>
  <rect x="38" y="248" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="266" fill="#c084fc" font-family="monospace" font-size="11.5" font-weight="bold">Port-Based VLAN Partitioning</text>
  <text x="54" y="283" fill="#cbd5e1" font-family="monospace" font-size="10.5">Switch software groups ports into separate virtual switches (e.g., VLAN 10 Engineering, VLAN 20 Finance); inter-VLAN traffic</text>
  <rect x="38" y="300" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="318" fill="#c084fc" font-family="monospace" font-size="11.5" font-weight="bold">IEEE 802.1Q Trunking Across Switches</text>
  <text x="54" y="335" fill="#cbd5e1" font-family="monospace" font-size="10.5">Single physical trunk link carries frames for multiple VLANs by inserting a 4-byte 802.1Q tag (`VID` up to 4096 VLANs)</text>
  <rect x="38" y="352" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="370" fill="#c084fc" font-family="monospace" font-size="11.5" font-weight="bold">Tag Insertion &amp; Removal</text>
  <text x="54" y="387" fill="#cbd5e1" font-family="monospace" font-size="10.5">Ingress trunk switch inserts 4-byte 802.1Q header and recomputes CRC; egress trunk switch strips tag before delivering to ho</text>
</svg>