<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#34d399" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">6.4B ETHERNET (IEEE 802.3): TOPOLOGY EVOLUTION, FRAME STRUCTURE &amp; 10G–400G</text>
  <rect x="22" y="64" width="916" height="106" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="84" fill="#94a3b8" font-family="monospace" font-size="10">Bit 0</text>
  <text x="480" y="84" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">WIRE-FORMAT PROTOCOL HEADER / FRAME ENCAPSULATION LAYOUT</text>
  <text x="920" y="84" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">Bit 31 / EOF</text>
  <rect x="36" y="94" width="155" height="62" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="113" y="120" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Preamble(7B)+SFD(1B)</text>
  <text x="113" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">10101010..10101011 Clock Syn</text>
  <rect x="195" y="94" width="209" height="62" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="299" y="120" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Dst MAC(6B) + Src MAC(6B)</text>
  <text x="299" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">48-Bit Hardware Addresses</text>
  <rect x="408" y="94" width="120" height="62" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
  <text x="468" y="120" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Type (2B)</text>
  <text x="468" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">0x0800 IPv4 / 0x86DD IPv6</text>
  <rect x="532" y="94" width="226" height="62" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="645" y="120" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Data Payload (46–1500B)</text>
  <text x="645" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">IP Datagram + Padding</text>
  <rect x="762" y="94" width="155" height="62" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="839" y="120" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">CRC-32 (4B)</text>
  <text x="839" y="142" fill="#e2e8f0" font-family="monospace" font-size="9.5" text-anchor="middle">Frame Check Sequence</text>
  <rect x="22" y="182" width="916" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="196" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="214" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">Bus to Star Switched Topology Evolution</text>
  <text x="54" y="231" fill="#cbd5e1" font-family="monospace" font-size="10.5">Legacy coaxial bus (10Base2) shared a single collision domain; modern twisted-pair/fiber star switches give dedicated full-d</text>
  <rect x="38" y="248" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="266" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">Preamble &amp; Start Frame Delimiter (8 Bytes)</text>
  <text x="54" y="283" fill="#cbd5e1" font-family="monospace" font-size="10.5">7 bytes of 10101010 followed by 10101011 synchronize receiver NIC clock with sender&#x27;s oscillator</text>
  <rect x="38" y="300" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="318" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">Connectionless &amp; Unreliable L2 Service</text>
  <text x="54" y="335" fill="#cbd5e1" font-family="monospace" font-size="10.5">Ethernet NIC sends no L2 ACKs or NAKs; dropped CRC-corrupted frames are recovered by higher-layer TCP rdt</text>
  <rect x="38" y="352" width="884" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="54" y="370" fill="#34d399" font-family="monospace" font-size="11.5" font-weight="bold">Multi-Gigabit IEEE 802.3 Standards</text>
  <text x="54" y="387" fill="#cbd5e1" font-family="monospace" font-size="10.5">Scales from 10 Mbps to 10 Gbps, 40G, 100G, and 400 Gbps using common frame format over copper and single-mode fiber</text>
</svg>