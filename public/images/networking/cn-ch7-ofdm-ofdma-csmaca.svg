  <rect x="506" y="284" width="418" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="518" y="303" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">RTS/CTS Channel Reservation</text>
  <text x="518" y="322" fill="#cbd5e1" font-family="monospace" font-size="10">Short Request-to-Send / Clear-to-Send exchange sets Network Alloca</text>
