  <rect x="475" y="62" width="465" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="707" y="86" fill="#34d399" font-family="monospace" font-size="12.5" font-weight="bold" text-anchor="middle">TOPOLOGY &amp; ROUTING STATE ANALYSIS</text>
  <rect x="490" y="102" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="123" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Why Partition into Autonomous Systems (AS)?</text>
  <text x="504" y="142" fill="#cbd5e1" font-family="monospace" font-size="10">Flat link-state flooding across billions of routers would exhaust </text>
  <text x="504" y="157" fill="#94a3b8" font-family="monospace" font-size="9.5">router memory and bandwidth; ASes provide administrative autonomy</text>
  <rect x="490" y="176" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="197" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">OSPF (Open Shortest Path First)</text>
  <text x="504" y="216" fill="#cbd5e1" font-family="monospace" font-size="10">Runs Dijkstra over IP Protocol 89; floods LSAs on topology changes</text>
  <text x="504" y="231" fill="#94a3b8" font-family="monospace" font-size="9.5"> and every 30 minutes for robustness</text>
  <rect x="490" y="250" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="271" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">OSPF Production Enhancements</text>
  <text x="504" y="290" fill="#cbd5e1" font-family="monospace" font-size="10">Supports HMAC/MD5 LSA authentication, Equal-Cost Multipath (ECMP) </text>
  <text x="504" y="305" fill="#94a3b8" font-family="monospace" font-size="9.5">load balancing, and ToS-specific link costs</text>
  <rect x="490" y="324" width="435" height="64" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="504" y="345" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">2-Tier Hierarchical OSPF</text>
  <text x="504" y="364" fill="#cbd5e1" font-family="monospace" font-size="10">Confines detailed LSA flooding within Local Areas; Area Border Rou</text>
  <text x="504" y="379" fill="#94a3b8" font-family="monospace" font-size="9.5">ters (ABRs) summarize routes across Area 0 Backbone</text>
</svg>