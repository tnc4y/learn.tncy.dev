<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#34d399" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">3.5C TCP FLOW CONTROL (rwnd), 3-WAY HANDSHAKE &amp; CONNECTION TEARDOWN</text>
  <rect x="20" y="62" width="455" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="27" y="74" width="136" height="28" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
  <text x="95" y="92" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TCP Client Host</text>
  <line x1="95" y1="102" x2="95" y2="395" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="180" y="74" width="136" height="28" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
  <text x="248" y="92" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Internet IP Core</text>
  <line x1="248" y1="102" x2="248" y2="395" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="332" y="74" width="136" height="28" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
  <text x="400" y="92" fill="#f8fafc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TCP Server Host</text>
  <line x1="400" y1="102" x2="400" y2="395" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="95" y1="128" x2="400" y2="146" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="53" y="112" width="390" height="18" rx="4" fill="#0b1120" fill-opacity="0.88"/>
  <text x="248" y="124" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1. SYN (SYN=1, Seq=x) -&gt; [Client enters SYN_SENT]</text>
  <line x1="400" y1="182" x2="95" y2="200" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="53" y="166" width="390" height="18" rx="4" fill="#0b1120" fill-opacity="0.88"/>
  <text x="248" y="178" fill="#60a5fa" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2. SYNACK (SYN=1, Seq=y, ACK=x+1) -&gt; [Server SYN_RCVD]</text>
  <line x1="95" y1="236" x2="400" y2="254" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="53" y="220" width="390" height="18" rx="4" fill="#0b1120" fill-opacity="0.88"/>
  <text x="248" y="232" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3. ACK (ACK=y+1, rwnd=4096) + HTTP Request [ESTABLISHED]</text>
  <line x1="95" y1="290" x2="400" y2="308" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="53" y="274" width="390" height="18" rx="4" fill="#0b1120" fill-opacity="0.88"/>
  <text x="248" y="286" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4. Data Flow: LastByteSent - LastByteAcked &lt;= rwnd</text>
  <line x1="95" y1="344" x2="400" y2="362" stroke="#f472b6" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="53" y="328" width="390" height="18" rx="4" fill="#0b1120" fill-opacity="0.88"/>
  <text x="248" y="340" fill="#f472b6" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">5. Close: FIN -&gt; ACK &lt;- FIN -&gt; ACK [2*MSL TIME_WAIT]</text>
  <rect x="490" y="62" width="450" height="350" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="715" y="88" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">PROTOCOL MECHANICS &amp; KEY INVARIANTS</text>
  <rect x="506" y="104" width="418" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="518" y="123" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">TCP Flow Control Invariant</text>
  <text x="518" y="142" fill="#cbd5e1" font-family="monospace" font-size="10">Receiver advertises spare buffer space rwnd = RcvBuffer - [LastByt</text>
  <rect x="506" y="164" width="418" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="518" y="183" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Zero-Window Probing</text>
  <text x="518" y="202" fill="#cbd5e1" font-family="monospace" font-size="10">If receiver advertises rwnd = 0, sender periodically transmits 1-b</text>
  <rect x="506" y="224" width="418" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="518" y="243" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">Why 3-Way (Not 2-Way) Handshake?</text>
  <text x="518" y="262" fill="#cbd5e1" font-family="monospace" font-size="10">Prevents delayed duplicate connection requests from half-open dead</text>
  <rect x="506" y="284" width="418" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="518" y="303" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold">SYN Flood Attack &amp; SYN Cookies</text>
  <text x="518" y="322" fill="#cbd5e1" font-family="monospace" font-size="10">Server avoids allocating state before step 3 by encoding initial s</text>
</svg>