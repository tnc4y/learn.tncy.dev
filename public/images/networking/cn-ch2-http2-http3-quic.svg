<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#34d399" stroke-width="2" stroke-opacity="0.65"/>
  <rect x="18" y="14" width="924" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="480" y="37" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">2.2C MODERN WEB PROTOCOLS: HTTP/2 FRAMING, HOL BLOCKING &amp; HTTP/3 OVER QUIC</text>
  <rect x="22" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="128" y="95" fill="#ef4444" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">HTTP/1.1 over TCP</text>
  <text x="128" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">FIFO Serialization &amp; HOL Blockin</text>
  <line x1="236" y1="104" x2="254" y2="104" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="256" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <text x="362" y="95" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">HTTP/2 Binary Framing</text>
  <text x="362" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Interleaved Streams + HPACK</text>
  <line x1="470" y1="104" x2="488" y2="104" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="490" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
  <text x="596" y="95" fill="#f97316" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">TCP Loss Bottleneck</text>
  <text x="596" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">1 Lost Packet Stalls All H2 Stre</text>
  <line x1="704" y1="104" x2="722" y2="104" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="724" y="66" width="212" height="76" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="830" y="95" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">HTTP/3 over QUIC (UDP)</text>
  <text x="830" y="120" fill="#e2e8f0" font-family="monospace" font-size="10" text-anchor="middle">Per-Stream Reliability + 1-RTT T</text>
  <rect x="22" y="158" width="916" height="254" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="38" y="172" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="196" r="8" fill="#34d399"/>
  <text x="56" y="200" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">1</text>
  <text x="74" y="192" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Application-Layer HOL Blocking Fixed</text>
  <text x="74" y="210" fill="#cbd5e1" font-family="monospace" font-size="10.5">HTTP/2 breaks large objects into small binary frames and interleaves streams to prevent small-object starvation</text>
  <rect x="38" y="230" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="254" r="8" fill="#34d399"/>
  <text x="56" y="258" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">2</text>
  <text x="74" y="250" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">HPACK Header Compression</text>
  <text x="74" y="268" fill="#cbd5e1" font-family="monospace" font-size="10.5">Eliminates repetitive ASCII HTTP headers using static/dynamic lookup tables and Huffman coding</text>
  <rect x="38" y="288" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="312" r="8" fill="#34d399"/>
  <text x="56" y="316" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">3</text>
  <text x="74" y="308" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">Transport-Layer HOL Blocking in HTTP/2</text>
  <text x="74" y="326" fill="#cbd5e1" font-family="monospace" font-size="10.5">Because HTTP/2 multiplexes over a single TCP socket, one lost TCP segment stalls all streams awaiting in-order delivery</text>
  <rect x="38" y="346" width="884" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
  <circle cx="56" cy="370" r="8" fill="#34d399"/>
  <text x="56" y="374" fill="#0b1120" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">4</text>
  <text x="74" y="366" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">HTTP/3 &amp; QUIC over UDP</text>
  <text x="74" y="384" fill="#cbd5e1" font-family="monospace" font-size="10.5">Moves stream multiplexing, congestion control, and TLS 1.3 into QUIC over UDP — packet loss only affects one stream</text>
</svg>