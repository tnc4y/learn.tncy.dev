<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#131c33" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="28" rx="14" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5" />
  <text x="160" y="54" fill="#93c5fd" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ROS 2 HUMBLE &amp; NAV2</text>

  <!-- Left: Autonomous Robot with LiDAR -->
  <g transform="translate(60, 100)">
    <rect width="290" height="280" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    
    <!-- Robot Chassis Top View -->
    <circle cx="145" cy="140" r="85" fill="#0f172a" stroke="#64748b" stroke-width="3" />
    
    <!-- Wheels -->
    <rect x="40" y="110" width="16" height="60" rx="4" fill="#475569" />
    <rect x="234" y="110" width="16" height="60" rx="4" fill="#475569" />

    <!-- LiDAR Sensor Turret -->
    <circle cx="145" cy="140" r="30" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <circle cx="145" cy="140" r="10" fill="#f43f5e" />

    <!-- Laser Rays -->
    <path d="M145 140 L 40 40 M 145 140 L 145 20 M 145 140 L 250 40" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8" />
    <text x="145" y="255" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Differential Drive AGV</text>
  </g>

  <!-- Right: 2D Costmap & Nav2 Trajectory -->
  <g transform="translate(390, 95)">
    <rect width="360" height="285" rx="14" fill="#020617" stroke="#334155" stroke-width="2" />
    
    <!-- Occupancy Grid lines -->
    <g stroke="#1e293b" stroke-width="1">
      <path d="M20 70 H340 M20 120 H340 M20 170 H340 M20 220 H340" />
      <path d="M70 20 V260 M140 20 V260 M210 20 V260 M280 20 V260" />
    </g>

    <!-- Obstacle Blocks -->
    <rect x="180" y="80" width="40" height="50" rx="4" fill="#ef4444" fill-opacity="0.8" />
    <rect x="90" y="160" width="60" height="30" rx="4" fill="#ef4444" fill-opacity="0.8" />

    <!-- Nav2 Global Path Plan -->
    <path d="M 50 230 C 120 230, 130 110, 290 60" fill="none" stroke="#22c55e" stroke-width="3.5" stroke-dasharray="6,4" />
    
    <!-- Start & Goal Flags -->
    <circle cx="50" cy="230" r="7" fill="#3b82f6" />
    <text x="50" y="252" fill="#93c5fd" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">START</text>

    <circle cx="290" cy="60" r="7" fill="#10b981" />
    <text x="290" y="45" fill="#4ade80" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">GOAL</text>

    <!-- Status Bar -->
    <text x="180" y="270" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Topic: /cmd_vel [Linear: 0.22m/s, Angular: -0.15rad/s]</text>
  </g>
</svg>
