<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#141a30" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="28" rx="14" fill="#06b6d4" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1.5" />
  <text x="160" y="54" fill="#67e8f9" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">RISC-V RV32I PROCESSOR</text>

  <!-- Complete Datapath Architecture -->
  <g transform="translate(50, 95)">
    <rect width="700" height="285" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Stage 1: Instruction Fetch (PC & ROM) -->
    <g transform="translate(30, 40)">
      <rect width="90" height="190" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" />
      <text x="45" y="45" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PC (Reg)</text>
      <path d="M45 70 V110" stroke="#0ea5e9" stroke-width="2" />
      <rect x="15" y="110" width="60" height="60" rx="4" fill="#0284c7" />
      <text x="45" y="145" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">I-MEM</text>
    </g>

    <!-- Arrow to Decode -->
    <path d="M120 150 L160 150" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Stage 2: Decode & Register File -->
    <g transform="translate(160, 40)">
      <rect width="130" height="190" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="65" y="35" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">DECODER</text>
      <rect x="20" y="60" width="90" height="110" rx="6" fill="#581c87" />
      <text x="65" y="105" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">RegFile</text>
      <text x="65" y="125" fill="#e9d5ff" font-family="monospace" font-size="10" text-anchor="middle">x0-x31 (32b)</text>
    </g>

    <!-- Arrow to Execute -->
    <path d="M290 120 L330 120 M290 160 L330 160" stroke="#a855f7" stroke-width="2.5" />

    <!-- Stage 3: ALU & Execution -->
    <g transform="translate(330, 40)">
      <polygon points="10,30 100,60 100,140 10,170 10,120 30,100 10,80" fill="#047857" stroke="#10b981" stroke-width="2" />
      <text x="50" y="105" fill="#f8fafc" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">ALU</text>
    </g>

    <!-- Arrow to Data Memory -->
    <path d="M430 100 L470 100" stroke="#10b981" stroke-width="2.5" />

    <!-- Stage 4: Data Memory -->
    <g transform="translate(470, 40)">
      <rect width="100" height="190" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="50" y="45" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">D-MEM</text>
      <text x="50" y="90" fill="#fde68a" font-family="monospace" font-size="10" text-anchor="middle">RAM 32-Bit</text>
      <text x="50" y="140" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Load / Store</text>
    </g>

    <!-- Arrow to Writeback -->
    <path d="M570 100 L610 100" stroke="#fbbf24" stroke-width="2.5" />

    <!-- Stage 5: Writeback MUX -->
    <g transform="translate(610, 50)">
      <rect width="60" height="160" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <text x="30" y="70" fill="#f472b6" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MUX</text>
      <text x="30" y="110" fill="#cbd5e1" font-family="monospace" font-size="9" text-anchor="middle">WB</text>
    </g>

    <!-- Bottom Status Text -->
    <text x="350" y="260" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">SystemVerilog Tek Çevrimli (Single-Cycle) RV32I Çekirdek</text>
  </g>
</svg>
