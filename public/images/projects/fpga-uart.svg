<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#12182b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="28" rx="14" fill="#a855f7" fill-opacity="0.2" stroke="#c084fc" stroke-width="1.5" />
  <text x="160" y="54" fill="#d8b4fe" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">UART RX/TX &amp; FIFO BUFFER</text>

  <!-- Left: Waveform Diagram -->
  <g transform="translate(60, 95)">
    <rect width="320" height="285" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <text x="25" y="40" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold">UART Paket Zamanlaması (115200 Baud)</text>

    <!-- Signal Line Waveform -->
    <path d="M 30 110 H 70 V 150 H 110 V 110 H 150 V 150 H 190 V 110 H 260 V 80 H 290" fill="none" stroke="#22d3ee" stroke-width="3" />
    
    <text x="50" y="90" fill="#94a3b8" font-family="monospace" font-size="10">IDLE</text>
    <text x="90" y="170" fill="#ef4444" font-family="monospace" font-size="10" font-weight="bold">START (0)</text>
    <text x="130" y="90" fill="#38bdf8" font-family="monospace" font-size="10">D0..D7</text>
    <text x="210" y="170" fill="#a855f7" font-family="monospace" font-size="10">PARITY</text>
    <text x="270" y="70" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">STOP (1)</text>

    <!-- 16x Oversampling explanation -->
    <rect x="25" y="200" width="270" height="60" rx="8" fill="#1e293b" />
    <text x="160" y="225" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">16x Örnekleme (Oversampling)</text>
    <text x="160" y="245" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Gürültü Filtreleme &amp; Merkez Bit Kilidi</text>
  </g>

  <!-- Right: RTL Block Diagram -->
  <g transform="translate(410, 95)">
    <rect width="340" height="285" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2" />

    <!-- Baud Rate Generator -->
    <rect x="30" y="25" width="280" height="45" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="170" y="53" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Baud Rate Gen (100MHz -&gt; 115.2k)</text>

    <!-- RX Unit -->
    <rect x="30" y="85" width="130" height="85" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="95" y="125" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">UART_RX</text>
    <text x="95" y="145" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Deserileştirici</text>

    <!-- TX Unit -->
    <rect x="180" y="85" width="130" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="245" y="125" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">UART_TX</text>
    <text x="245" y="145" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Serileştirici</text>

    <!-- Synchronous FIFO Buffer -->
    <rect x="30" y="190" width="280" height="65" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <text x="170" y="222" fill="#facc15" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Circular FIFO Buffer (1024 Byte)</text>
    <text x="170" y="242" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Donanımsal Akış Kontrolü (RTS / CTS)</text>
  </g>
</svg>
