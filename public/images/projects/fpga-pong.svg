<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#121829" />
    </linearGradient>
    <linearGradient id="crtG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021a12" />
      <stop offset="100%" stop-color="#032b1e" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Title Badge -->
  <rect x="50" y="35" width="200" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
  <text x="150" y="54" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">FPGA &amp; SYSTEMVERILOG</text>

  <!-- Left: FPGA Chip Block -->
  <g transform="translate(60, 100)">
    <rect width="250" height="280" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect x="35" y="35" width="180" height="150" rx="8" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5" />
    <text x="125" y="85" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">XILINX ARTIX-7</text>
    <text x="125" y="115" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">XC7A35T (Basys 3)</text>
    <text x="125" y="145" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">25.175 MHz Pixel Clock</text>

    <!-- Signal Buses Out -->
    <path d="M 215 75 H 250" stroke="#34d399" stroke-width="2" />
    <path d="M 215 105 H 250" stroke="#38bdf8" stroke-width="2" />
    <path d="M 215 135 H 250" stroke="#ec4899" stroke-width="2" />

    <text x="125" y="235" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">Zero-Latency RTL Core</text>
  </g>

  <!-- Sync lines to monitor -->
  <path d="M310 175 C 360 175, 380 180, 420 180" fill="none" stroke="#34d399" stroke-width="2.5" />
  <path d="M310 205 C 360 205, 380 230, 420 230" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <text x="365" y="165" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">H-SYNC (96)</text>
  <text x="365" y="245" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">V-SYNC (2)</text>

  <!-- Right: Retro CRT Monitor showing Pong -->
  <g transform="translate(420, 90)">
    <rect width="320" height="290" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <rect x="20" y="20" width="280" height="210" rx="8" fill="url(#crtG)" stroke="#10b981" stroke-width="2" />

    <!-- CRT Center Dotted Net -->
    <path d="M160 25 V225" stroke="#10b981" stroke-width="3" stroke-dasharray="10,8" opacity="0.6" />

    <!-- Left Paddle -->
    <rect x="35" y="80" width="10" height="55" rx="3" fill="#34d399" />
    <!-- Right Paddle -->
    <rect x="275" y="130" width="10" height="55" rx="3" fill="#34d399" />

    <!-- Pong Ball & Vector -->
    <rect x="180" y="105" width="10" height="10" rx="2" fill="#facc15" />
    <path d="M120 75 L180 105" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Score -->
    <text x="110" y="60" fill="#34d399" font-family="monospace" font-size="24" font-weight="bold">03</text>
    <text x="210" y="60" fill="#34d399" font-family="monospace" font-size="24" font-weight="bold">02</text>

    <!-- Monitor Controls / Label -->
    <text x="160" y="260" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">VGA 640x480 @ 60Hz Hardware Video</text>
  </g>
</svg>
