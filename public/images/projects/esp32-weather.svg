<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111c30" />
    </linearGradient>
    <linearGradient id="espG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="oledG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#091322" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" />
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" />
  </g>

  <!-- Title Badge -->
  <rect x="50" y="40" width="160" height="28" rx="14" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
  <text x="130" y="59" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ESP32 &amp; I2C OLED</text>

  <!-- ESP32 Module Board -->
  <g transform="translate(90, 110)">
    <rect width="240" height="260" rx="12" fill="url(#espG)" stroke="#334155" stroke-width="2" />
    <!-- Anten -->
    <path d="M40 0 V30 H60 V10 H180 V30 H200 V0" fill="none" stroke="#e2b340" stroke-width="3" />
    <rect x="30" y="40" width="180" height="110" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="120" y="85" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">ESP-WROOM-32</text>
    <text x="120" y="110" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Wi-Fi + BLE Dual Core</text>
    <circle cx="120" cy="130" r="4" fill="#10b981" filter="url(#glow)" />

    <!-- Pin Headers -->
    <g fill="#64748b">
      <rect x="5" y="160" width="15" height="90" rx="2" />
      <rect x="220" y="160" width="15" height="90" rx="2" />
    </g>
    <text x="120" y="220" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">240 MHz Tensilica</text>
  </g>

  <!-- I2C Bus wires -->
  <path d="M330 290 C 390 290, 420 220, 470 220" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" />
  <path d="M330 310 C 390 310, 420 250, 470 250" fill="none" stroke="#a855f7" stroke-width="3" />
  <text x="400" y="240" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">SDA (GPIO21)</text>
  <text x="400" y="295" fill="#a855f7" font-family="monospace" font-size="11" font-weight="bold">SCL (GPIO22)</text>

  <!-- OLED Display Module -->
  <g transform="translate(470, 110)">
    <rect width="270" height="260" rx="14" fill="#0f172a" stroke="#22d3ee" stroke-width="2" />
    <!-- Screen Bezel -->
    <rect x="20" y="25" width="230" height="150" rx="8" fill="url(#oledG)" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Screen Content (SSD1306) -->
    <text x="35" y="55" fill="#38bdf8" font-family="monospace" font-size="12">ISTANBUL, TR</text>
    <text x="35" y="105" fill="#38bdf8" font-family="monospace" font-size="34" font-weight="bold">24.5°C</text>
    <text x="35" y="135" fill="#22d3ee" font-family="monospace" font-size="14">NEM: %48  BASINC: 1013hPa</text>
    <path d="M 35 155 Q 80 140, 130 150 T 230 142" fill="none" stroke="#06b6d4" stroke-width="2.5" />

    <!-- OLED Pin Labels -->
    <g transform="translate(35, 205)" font-family="monospace" font-size="11" font-weight="bold">
      <rect x="0" y="0" width="45" height="24" rx="4" fill="#dc2626" fill-opacity="0.2" />
      <text x="22" y="16" fill="#ef4444" text-anchor="middle">VCC</text>
      
      <rect x="55" y="0" width="45" height="24" rx="4" fill="#475569" fill-opacity="0.3" />
      <text x="77" y="16" fill="#94a3b8" text-anchor="middle">GND</text>
      
      <rect x="110" y="0" width="45" height="24" rx="4" fill="#a855f7" fill-opacity="0.2" />
      <text x="132" y="16" fill="#c084fc" text-anchor="middle">SCL</text>
      
      <rect x="165" y="0" width="45" height="24" rx="4" fill="#0284c7" fill-opacity="0.2" />
      <text x="187" y="16" fill="#38bdf8" text-anchor="middle">SDA</text>
    </g>
  </g>
</svg>
