<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#111c33" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Title Badge -->
  <rect x="50" y="35" width="190" height="28" rx="14" fill="#e11d48" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.5" />
  <text x="145" y="54" fill="#fb7185" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">RASPBERRY PI &amp; DNS</text>

  <!-- Raspberry Pi Outline -->
  <g transform="translate(70, 100)">
    <rect width="250" height="270" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <!-- SOC / BCM2711 -->
    <rect x="60" y="60" width="80" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <text x="100" y="105" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">BCM2711</text>
    
    <!-- Ports -->
    <rect x="220" y="30" width="35" height="50" rx="4" fill="#64748b" />
    <text x="210" y="60" fill="#94a3b8" font-family="monospace" font-size="10">RJ45</text>
    <rect x="220" y="100" width="35" height="60" rx="4" fill="#0284c7" />
    <rect x="220" y="180" width="35" height="60" rx="4" fill="#475569" />

    <circle cx="30" cy="30" r="12" fill="#ef4444" opacity="0.8" />
    <circle cx="30" cy="30" r="6" fill="#ffffff" />
    <text x="125" y="215" fill="#ecfdf5" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Pi-Hole DNS Sinkhole</text>
  </g>

  <!-- Traffic Routing Flow -->
  <path d="M330 200 L440 200" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,4" />
  <text x="385" y="185" fill="#fb7185" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Port 53 (UDP)</text>

  <!-- Right: Shield & Dashboard -->
  <g transform="translate(450, 95)">
    <rect width="290" height="280" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Shield Icon -->
    <path d="M145 30 L210 60 V120 C 210 160, 145 190, 145 190 C 145 190, 80 160, 80 120 V60 Z" fill="#e11d48" fill-opacity="0.2" stroke="#f43f5e" stroke-width="2.5" />
    <path d="M130 110 L142 122 L165 95" fill="none" stroke="#fb7185" stroke-width="3.5" stroke-linecap="round" />

    <text x="145" y="225" fill="#f8fafc" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">248,310 BLOCKED</text>
    <text x="145" y="248" fill="#10b981" font-family="monospace" font-size="13" text-anchor="middle">%38.4 Network Ads Filtered</text>
  </g>
</svg>
