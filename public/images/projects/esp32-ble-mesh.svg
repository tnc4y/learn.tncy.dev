<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#131c33" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="28" rx="14" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5" />
  <text x="160" y="54" fill="#93c5fd" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">BLUETOOTH LE MESH AĞI</text>

  <!-- Mesh Network Nodes in Triangle / Poly -->
  <!-- Center Provisioner (Phone) -->
  <g transform="translate(100, 160)">
    <rect width="110" height="190" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect x="10" y="20" width="90" height="135" rx="6" fill="#0f172a" />
    <circle cx="55" cy="172" r="7" fill="#64748b" />
    <text x="55" y="80" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">BLE APP</text>
    <text x="55" y="105" fill="#f8fafc" font-family="monospace" font-size="10" text-anchor="middle">Provisioner</text>
  </g>

  <!-- Node 1: Relay Node A -->
  <g transform="translate(340, 110)">
    <circle cx="60" cy="60" r="50" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
    <text x="60" y="55" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ESP32 #1</text>
    <text x="60" y="75" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Relay / Röle 1</text>
  </g>

  <!-- Node 2: Relay Node B -->
  <g transform="translate(560, 110)">
    <circle cx="60" cy="60" r="50" fill="#1e293b" stroke="#10b981" stroke-width="2.5" />
    <text x="60" y="55" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ESP32 #2</text>
    <text x="60" y="75" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">Relay / Röle 2</text>
  </g>

  <!-- Node 3: Sensor Node C -->
  <g transform="translate(450, 260)">
    <circle cx="60" cy="60" r="50" fill="#1e293b" stroke="#a855f7" stroke-width="2.5" />
    <text x="60" y="55" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ESP32 #3</text>
    <text x="60" y="75" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">PIR &amp; Işık</text>
  </g>

  <!-- Mesh Multipath Links -->
  <path d="M210 230 L 350 170" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" />
  <path d="M440 170 L 570 170" stroke="#10b981" stroke-width="3" />
  <path d="M400 200 L 460 270" stroke="#10b981" stroke-width="3" />
  <path d="M600 210 L 540 270" stroke="#10b981" stroke-width="3" />

  <text x="470" y="155" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Multi-Hop Flooding (TTL=7)</text>
  <text x="450" y="405" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Kapsama Alanı: 300+ Metre Sınırsız Ağ Genişletme</text>
</svg>
