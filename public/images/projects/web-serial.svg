<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e" />
      <stop offset="100%" stop-color="#161f36" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Title Badge -->
  <rect x="50" y="35" width="210" height="28" rx="14" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5" />
  <text x="155" y="54" fill="#fde047" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">WEB SERIAL API &amp; USB</text>

  <!-- Left: Chrome Web Browser Window -->
  <g transform="translate(50, 100)">
    <rect width="320" height="270" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="0" y="0" width="320" height="35" rx="12" fill="#0f172a" />
    <!-- Browser window dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="35" cy="18" r="5" fill="#f59e0b" />
    <circle cx="50" cy="18" r="5" fill="#10b981" />
    <text x="170" y="22" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">https://learn.tncy.dev</text>

    <!-- UI Buttons in Browser -->
    <rect x="25" y="55" width="270" height="45" rx="8" fill="#0284c7" />
    <text x="160" y="83" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">🔌 Portu Seç &amp; Bağlan</text>

    <!-- Stream Terminal in Browser -->
    <rect x="25" y="115" width="270" height="135" rx="8" fill="#020617" />
    <text x="40" y="145" fill="#22c55e" font-family="monospace" font-size="11">&gt; port = await navigator.serial</text>
    <text x="40" y="170" fill="#22c55e" font-family="monospace" font-size="11">&gt; writer.write("LED_ON
")</text>
    <text x="40" y="195" fill="#38bdf8" font-family="monospace" font-size="11">&lt; [ACK] Pin 13 HIGH (115200)</text>
  </g>

  <!-- Center USB Cable -->
  <path d="M375 220 L445 220" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <rect x="400" y="208" width="20" height="24" rx="4" fill="#e2e8f0" />
  <text x="410" y="248" fill="#facc15" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">USB-UART</text>

  <!-- Right: Arduino Board with glowing LED -->
  <g transform="translate(450, 100)">
    <rect width="290" height="270" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <rect x="30" y="40" width="100" height="100" rx="6" fill="#0f172a" />
    <text x="80" y="95" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">ATmega328</text>

    <!-- Glowing Pin 13 LED -->
    <circle cx="220" cy="80" r="16" fill="#22c55e" opacity="0.9" filter="url(#glow)" />
    <circle cx="220" cy="80" r="8" fill="#ffffff" />
    <text x="220" y="115" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PIN 13 [ON]</text>
    <text x="145" y="235" fill="#e0f2fe" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Tarayıcıdan Doğrudan Donanım</text>
  </g>
</svg>
