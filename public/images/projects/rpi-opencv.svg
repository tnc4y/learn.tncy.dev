<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1120" />
      <stop offset="100%" stop-color="#151f33" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5" />
  <text x="160" y="54" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">RPI 5 &amp; OPENCV VISION</text>

  <!-- Left: Pan/Tilt Gimbal & Camera -->
  <g transform="translate(60, 95)">
    <rect width="320" height="285" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2" />

    <!-- Base Pan Servo -->
    <rect x="110" y="210" width="100" height="45" rx="6" fill="#0284c7" />
    <text x="160" y="238" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PAN (X-Axis)</text>

    <!-- Bracket Arm -->
    <path d="M160 210 V140 H 200" stroke="#64748b" stroke-width="8" stroke-linecap="round" />

    <!-- Tilt Servo -->
    <rect x="180" y="115" width="60" height="50" rx="6" fill="#0284c7" />
    <text x="210" y="145" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">TILT (Y)</text>

    <!-- Camera Lens Module -->
    <rect x="60" y="40" width="120" height="90" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <circle cx="120" cy="85" r="28" fill="#0284c7" stroke="#67e8f9" stroke-width="3" />
    <circle cx="120" cy="85" r="14" fill="#082f49" />
    <circle cx="126" cy="79" r="4" fill="#ffffff" />
    <text x="120" y="20" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Pi Camera Modül 3</text>
  </g>

  <!-- Right: Computer Vision Screen with Bounding Box -->
  <g transform="translate(410, 95)">
    <rect width="340" height="285" rx="14" fill="#020617" stroke="#334155" stroke-width="2" />

    <!-- Target Video Stream simulation -->
    <!-- Crosshairs -->
    <path d="M170 30 V230 M30 130 H310" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- Detected Ball Target with bounding box -->
    <circle cx="210" cy="110" r="32" fill="#eab308" />
    <!-- Bounding Box -->
    <rect x="170" y="70" width="80" height="80" rx="4" fill="none" stroke="#22c55e" stroke-width="2.5" />
    <text x="175" y="62" fill="#22c55e" font-family="monospace" font-size="10" font-weight="bold">Target (98%) [x:210, y:110]</text>

    <!-- PID Offset Vector -->
    <line x1="170" y1="130" x2="210" y2="110" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" />
    
    <!-- Real-time HUD stats -->
    <rect x="25" y="215" width="290" height="50" rx="8" fill="#1e293b" />
    <text x="35" y="235" fill="#f8fafc" font-family="monospace" font-size="11">FPS: 45.2 | Frame: 1920x1080</text>
    <text x="35" y="253" fill="#38bdf8" font-family="monospace" font-size="11">PID Error: Δx=+40px, Δy=-20px</text>
  </g>
</svg>
