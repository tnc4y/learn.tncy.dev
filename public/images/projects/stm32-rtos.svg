<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#141c30" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Title Badge -->
  <rect x="50" y="35" width="200" height="28" rx="14" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
  <text x="150" y="54" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">STM32 &amp; FREERTOS</text>

  <!-- MCU QFP Package -->
  <g transform="translate(70, 110)">
    <rect width="240" height="250" rx="12" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" />
    <rect x="40" y="45" width="160" height="160" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="120" y="105" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">STM32F401RE</text>
    <text x="120" y="130" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">ARM Cortex-M4</text>
    <text x="120" y="155" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">84 MHz / 512KB Flash</text>
  </g>

  <!-- RTOS Multi-Tasking Timeline on Right -->
  <g transform="translate(360, 95)">
    <rect width="380" height="280" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <text x="30" y="40" fill="#e2e8f0" font-family="monospace" font-size="13" font-weight="bold">Preemptive Task Scheduler</text>
    
    <!-- Task 1: Sensor Poll -->
    <text x="30" y="80" fill="#38bdf8" font-family="monospace" font-size="11">Task_Sensor (Prio 3)</text>
    <rect x="180" y="67" width="50" height="16" rx="4" fill="#0284c7" />
    <rect x="290" y="67" width="50" height="16" rx="4" fill="#0284c7" />

    <!-- Task 2: UART Comms -->
    <text x="30" y="130" fill="#a855f7" font-family="monospace" font-size="11">Task_UART (Prio 2)</text>
    <rect x="235" y="117" width="50" height="16" rx="4" fill="#9333ea" />
    <rect x="345" y="117" width="25" height="16" rx="4" fill="#9333ea" />

    <!-- Task 3: Heartbeat LED -->
    <text x="30" y="180" fill="#10b981" font-family="monospace" font-size="11">Task_Blink (Prio 1)</text>
    <rect x="195" y="167" width="35" height="16" rx="4" fill="#059669" />

    <!-- Queue & Mutex Box -->
    <rect x="30" y="215" width="320" height="45" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="45" y="242" fill="#facc15" font-family="monospace" font-size="11">Queue: sensorQueue [16 Slots] | Mutex: i2cLock</text>
  </g>
</svg>
