<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1022" />
      <stop offset="100%" stop-color="#141a33" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Title Badge -->
  <rect x="50" y="35" width="220" height="28" rx="14" fill="#f59e0b" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5" />
  <text x="160" y="54" fill="#fde68a" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CAN BUS (ISO 11898-2)</text>

  <!-- Node A (STM32) -->
  <g transform="translate(60, 100)">
    <rect width="200" height="240" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="100" y="40" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">NODE A: Motor ECU</text>
    
    <rect x="25" y="60" width="150" height="60" rx="6" fill="#0f172a" />
    <text x="100" y="95" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">STM32 bxCAN</text>

    <!-- Transceiver MCP2551 -->
    <rect x="35" y="145" width="130" height="55" rx="6" fill="#0369a1" />
    <text x="100" y="178" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">TJA1050 PHY</text>
  </g>

  <!-- Center Differential Bus Lines (CAN_H & CAN_L) -->
  <g transform="translate(260, 190)">
    <!-- 120 Ohm termination resistors -->
    <rect x="15" y="10" width="12" height="40" rx="2" fill="#f59e0b" />
    <text x="21" y="65" fill="#facc15" font-family="monospace" font-size="8" text-anchor="middle">120Ω</text>

    <!-- CAN_H -->
    <path d="M0 15 H 280" stroke="#f43f5e" stroke-width="3.5" />
    <text x="140" y="10" fill="#fb7185" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CAN_High (3.5V)</text>

    <!-- CAN_L -->
    <path d="M0 45 H 280" stroke="#38bdf8" stroke-width="3.5" />
    <text x="140" y="70" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CAN_Low (1.5V)</text>

    <rect x="250" y="10" width="12" height="40" rx="2" fill="#f59e0b" />
    <text x="256" y="65" fill="#facc15" font-family="monospace" font-size="8" text-anchor="middle">120Ω</text>
  </g>

  <!-- Node B (STM32 Dashboard) -->
  <g transform="translate(540, 100)">
    <rect width="200" height="240" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="100" y="40" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">NODE B: Gösterge</text>

    <rect x="25" y="60" width="150" height="60" rx="6" fill="#0f172a" />
    <text x="100" y="95" fill="#34d399" font-family="monospace" font-size="12" text-anchor="middle">STM32 bxCAN</text>

    <!-- Transceiver MCP2551 -->
    <rect x="35" y="145" width="130" height="55" rx="6" fill="#047857" />
    <text x="100" y="178" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">TJA1050 PHY</text>
  </g>

  <!-- CAN Frame Structure at bottom -->
  <g transform="translate(60, 365)">
    <rect width="680" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="340" y="30" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">
      [SOF:1b] [ID: 11-Bit 0x1A4] [RTR:1b] [DLC: 8 Byte] [DATA: RPM 4200, SPEED 110km/h] [CRC:15b] [ACK:2b]
    </text>
  </g>
</svg>
