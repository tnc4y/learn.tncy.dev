<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
  <rect width="800" height="240" rx="16" fill="#0f172a"/>
  <text x="400" y="34" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">LINUX OPERATING SYSTEM LAYERED ARCHITECTURE</text>
  <g transform="translate(40,55)" font-family="sans-serif">
    <rect x="0" y="0" width="165" height="145" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="82" y="35" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="bold">1. Hardware</text>
    <text x="82" y="65" text-anchor="middle" fill="#e2e8f0" font-size="11">CPU / RAM / MMU</text>
    <text x="82" y="88" text-anchor="middle" fill="#94a3b8" font-size="11">NVMe / Block I/O</text>
    <text x="82" y="111" text-anchor="middle" fill="#94a3b8" font-size="11">NIC / Peripherals</text>

    <rect x="185" y="0" width="175" height="145" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="272" y="35" text-anchor="middle" fill="#f87171" font-size="14" font-weight="bold">2. Linux Kernel</text>
    <text x="272" y="65" text-anchor="middle" fill="#e2e8f0" font-size="11">Process Scheduler</text>
    <text x="272" y="88" text-anchor="middle" fill="#94a3b8" font-size="11">Virtual Memory &amp; VFS</text>
    <text x="272" y="111" text-anchor="middle" fill="#94a3b8" font-size="11">Device Drivers &amp; Net</text>

    <rect x="380" y="0" width="165" height="145" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="462" y="35" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold">3. System Call &amp; Shell</text>
    <text x="462" y="65" text-anchor="middle" fill="#e2e8f0" font-size="11">glibc / POSIX API</text>
    <text x="462" y="88" text-anchor="middle" fill="#94a3b8" font-size="11">bash / zsh / sh</text>
    <text x="462" y="111" text-anchor="middle" fill="#94a3b8" font-size="11">fork() / execve()</text>

    <rect x="565" y="0" width="155" height="145" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="642" y="35" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">4. User Space</text>
    <text x="642" y="65" text-anchor="middle" fill="#e2e8f0" font-size="11">CLI Utilities (GNU)</text>
    <text x="642" y="88" text-anchor="middle" fill="#94a3b8" font-size="11">systemd Daemons</text>
    <text x="642" y="111" text-anchor="middle" fill="#94a3b8" font-size="11">Containers &amp; Apps</text>
  </g>
</svg>