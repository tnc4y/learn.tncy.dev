<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <rect width="800" height="220" rx="16" fill="#0f172a"/>
  <text x="400" y="32" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="16" font-weight="bold">LINUX FILESYSTEM HIERARCHY STANDARD (FHS)</text>
  <rect x="360" y="48" width="80" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="70" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">/ (root)</text>
  <g stroke="#475569" stroke-width="1.5">
    <line x1="400" y1="82" x2="90" y2="125"/><line x1="400" y1="82" x2="215" y2="125"/><line x1="400" y1="82" x2="340" y2="125"/>
    <line x1="400" y1="82" x2="465" y2="125"/><line x1="400" y1="82" x2="590" y2="125"/><line x1="400" y1="82" x2="710" y2="125"/>
  </g>
  <g font-family="monospace" font-size="12" text-anchor="middle">
    <rect x="35" y="125" width="110" height="68" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="148" fill="#34d399" font-weight="bold">/bin &amp; /sbin</text>
    <text x="90" y="170" fill="#94a3b8" font-size="10">Core Binaries</text>

    <rect x="160" y="125" width="110" height="68" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="215" y="148" fill="#fbbf24" font-weight="bold">/etc</text>
    <text x="215" y="170" fill="#94a3b8" font-size="10">System Configs</text>

    <rect x="285" y="125" width="110" height="68" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="340" y="148" fill="#38bdf8" font-weight="bold">/home</text>
    <text x="340" y="170" fill="#94a3b8" font-size="10">User Directories</text>

    <rect x="410" y="125" width="110" height="68" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="465" y="148" fill="#c084fc" font-weight="bold">/proc &amp; /sys</text>
    <text x="465" y="170" fill="#94a3b8" font-size="10">Kernel Virtual FS</text>

    <rect x="535" y="125" width="110" height="68" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="590" y="148" fill="#f472b6" font-weight="bold">/var</text>
    <text x="590" y="170" fill="#94a3b8" font-size="10">Logs &amp; Spools</text>

    <rect x="660" y="125" width="105" height="68" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="712" y="148" fill="#f87171" font-weight="bold">/dev</text>
    <text x="712" y="170" fill="#94a3b8" font-size="10">Device Nodes</text>
  </g>
