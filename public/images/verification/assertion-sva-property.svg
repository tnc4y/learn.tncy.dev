<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 190" width="720" height="190" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="719" height="189" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<text x="360" y="26" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">SystemVerilog Assertions (SVA) Hierarchical Structure</text>

<g transform="translate(30, 45)">
  <rect x="0" y="15" width="180" height="80" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="90" y="38" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1. Boolean Expression</text>
  <text x="90" y="58" font-size="10" fill="#3b82f6" text-anchor="middle">req == 1'b1</text>
  <text x="90" y="76" font-size="9" fill="#64748b" text-anchor="middle">Anlık mantık sinyali</text>

  <line x1="180" y1="55" x2="235" y2="55" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="15" width="200" height="80" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="340" y="38" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">2. SVA Sequence</text>
  <text x="340" y="58" font-size="10" fill="#16a34a" text-anchor="middle">sequence s_req_ack;</text>
  <text x="340" y="74" font-size="9" fill="#16a34a" text-anchor="middle">req ##[1:3] gnt;</text>

  <line x1="440" y1="55" x2="495" y2="55" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="500" y="15" width="190" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="595" y="38" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">3. Property &amp; Assert</text>
  <text x="595" y="58" font-size="10" fill="#d97706" text-anchor="middle">property p_handshake;</text>
  <text x="595" y="74" font-size="9" fill="#d97706" text-anchor="middle">assert property (@clk ...);</text>
</g>

</svg>