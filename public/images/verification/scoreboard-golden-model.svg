<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 200" width="720" height="200" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="719" height="199" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<text x="360" y="26" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">Self-Checking Testbench: Scoreboard & Golden Reference Model</text>

<g transform="translate(30, 40)">
  <!-- Generator -->
  <rect x="0" y="45" width="110" height="60" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="55" y="72" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">Stimulus / Driver</text>
  <text x="55" y="90" font-size="9" fill="#64748b" text-anchor="middle">Girdi İşlemi (Tx)</text>

  <!-- Lines to DUT and Model -->
  <path d="M 110 65 L 170 30" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 110 85 L 170 120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DUT -->
  <rect x="175" y="5" width="150" height="55" rx="6" fill="#fee2e2" stroke="#ef4444"/>
  <text x="250" y="30" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">RTL Tasarım (DUT)</text>
  <text x="250" y="48" font-size="10" fill="#dc2626" text-anchor="middle">Test Edilen Donanım</text>

  <!-- Golden Model -->
  <rect x="175" y="95" width="150" height="55" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="250" y="120" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Altın Model (Predictor)</text>
  <text x="250" y="138" font-size="10" fill="#16a34a" text-anchor="middle">Beklenen Sonuç Modeli</text>

  <!-- Lines to Scoreboard -->
  <path d="M 325 30 L 400 65" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M 325 120 L 400 85" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Scoreboard -->
  <rect x="405" y="35" width="180" height="80" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="495" y="62" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Skorboard (Scoreboard)</text>
  <text x="495" y="82" font-size="10" fill="#2563eb" text-anchor="middle">Gerçek vs Beklenen Karşılaştırma</text>
  <text x="495" y="100" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Uyuşma: PASS | Fark: ERROR</text>
</g>

</svg>