<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 190" width="720" height="190" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="719" height="189" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<text x="360" y="26" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">Pre-Silicon Verification vs Post-Silicon Validation</text>

<g transform="translate(30, 45)">
  <rect x="0" y="0" width="310" height="120" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="28" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Pre-Silicon Verification (DV)</text>
  <text x="155" y="50" font-size="11" fill="#3b82f6" text-anchor="middle">"Did we build the design right?"</text>
  <text x="20" y="75" font-size="10" fill="#1e40af">• Yazılım simülatörleri (VCS, Questa, Xcelium)</text>
  <text x="20" y="93" font-size="10" fill="#1e40af">• CRV, SVA assertions, UVM testbench, Formal</text>
  <text x="20" y="110" font-size="10" fill="#1e40af">• %100 görünürlük (Tüm iç sinyaller izlenebilir)</text>

  <rect x="350" y="0" width="310" height="120" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="505" y="28" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">Post-Silicon Validation (SV)</text>
  <text x="505" y="50" font-size="11" fill="#16a34a" text-anchor="middle">"Did we build the right design?"</text>
  <text x="370" y="75" font-size="10" fill="#14532d">• Gerçek silikon çip test kartında (bring-up)</text>
  <text x="370" y="93" font-size="10" fill="#14532d">• Osiloskop, mantık analizörü, gerçek OS boot</text>
  <text x="370" y="110" font-size="10" fill="#14532d">• Milyarlarca çevrim / saniye gerçek hız</text>
</g>

</svg>