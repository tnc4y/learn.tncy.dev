<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 316" width="640" height="316" role="img" aria-label="Noise margins between a driver and a receiver" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs></defs>
<rect x="0.5" y="0.5" width="639" height="315" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
