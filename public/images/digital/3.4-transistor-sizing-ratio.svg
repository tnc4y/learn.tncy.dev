<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 275" width="660" height="275" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="274" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Transistör Boyutlandırma (W/L) ve PMOS/NMOS Mobilite Oranı</text>
<g transform="translate(50, 45)">
  <rect x="0" y="0" width="560" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  
  <!-- Sizing bars -->
  <!-- NMOS -->
  <g transform="translate(40, 30)">
    <text x="0" y="20" font-size="12" font-weight="bold" fill="#15803d">NMOS Boyutu (W_n / L = 1)</text>
    <rect x="0" y="35" width="160" height="40" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="80" y="60" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">Genişlik W_n = 1λ</text>
    <text x="0" y="100" font-size="10" fill="#334155">Elektron Mobilitesi: μ_n ≈ 2.5 × μ_p</text>
    <text x="0" y="120" font-size="10" font-weight="bold" fill="#166534">Eşdeğer Direnç: R_n = R</text>
  </g>

  <!-- PMOS Sized -->
  <g transform="translate(280, 30)">
    <text x="0" y="20" font-size="12" font-weight="bold" fill="#b91c1c">PMOS Boyutu (W_p / L = 2 ~ 2.5)</text>
    <rect x="0" y="35" width="240" height="40" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="120" y="60" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">Genişlik W_p = 2λ ~ 2.5λ</text>
    <text x="0" y="100" font-size="10" fill="#334155">Deşik Mobilitesi daha düşük olduğu için transistör genişletilir.</text>
    <text x="0" y="120" font-size="10" font-weight="bold" fill="#b91c1c">Eşit Direnç Dengesi: R_p = R_n = R</text>
  </g>

  <!-- Result box -->
  <rect x="30" y="155" width="500" height="38" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="280" y="178" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Amaç: Simetrik Geçiş Süreleri (t_rise = t_fall) ve Dengeli Mantık Eşiği (V_M = V_DD / 2)</text>
</g>

</svg>