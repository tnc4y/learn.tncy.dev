<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 300" width="660" height="300" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="299" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">AOI21 (AND-OR-INVERT) Karmaşık Kapı Transistör Ağ Mimarisi</text>
<g transform="translate(50, 45)">
  <rect x="0" y="0" width="560" height="235" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  
  <text x="280" y="25" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Y = ~((A · B) + C) — Tek Kademede 6 Transistör</text>

  <!-- Left: PUN -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="220" height="160" rx="4" fill="#fee2e2" stroke="#ef4444"/>
    <text x="110" y="22" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">PUN (Çekme Ağı - PMOS)</text>
    <text x="110" y="55" font-size="10" fill="#7f1d1d" text-anchor="middle">Fonksiyonun duali:</text>
    <text x="110" y="75" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">(A + B) · C</text>
    <text x="110" y="110" font-size="10" fill="#334155" text-anchor="middle">A ve B paralel,</text>
    <text x="110" y="130" font-size="10" fill="#334155" text-anchor="middle">bu grup C ile seri bağlanır.</text>
  </g>

  <!-- Right: PDN -->
  <g transform="translate(300, 45)">
    <rect x="0" y="0" width="220" height="160" rx="4" fill="#dcfce7" stroke="#22c55e"/>
    <text x="110" y="22" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">PDN (Düşürme Ağı - NMOS)</text>
    <text x="110" y="55" font-size="10" fill="#14532d" text-anchor="middle">Fonksiyonun kendisi:</text>
    <text x="110" y="75" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">(A · B) + C</text>
    <text x="110" y="110" font-size="10" fill="#334155" text-anchor="middle">A ve B seri (AND),</text>
    <text x="110" y="130" font-size="10" fill="#334155" text-anchor="middle">bu grup C ile paralel bağlanır (OR).</text>
  </g>
</g>

</svg>