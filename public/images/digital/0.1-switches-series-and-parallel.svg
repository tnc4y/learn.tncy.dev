<polyline points="356.0,154.0 384.0,154.0" fill="none" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
<polyline points="362.0,162.0 378.0,162.0" fill="none" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"/>
