<text x="465.0" y="90" font-size="11" fill="#1f2937" text-anchor="middle" font-weight="bold">B</text>
<polyline points="490.0,70.0 520.0,70.0 520.0,112.0 490.0,112.0" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/>
