<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 230" width="660" height="230" role="img" aria-label="Switches in series act as AND, switches in parallel act as OR" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<defs></defs>
<rect x="0.5" y="0.5" width="659" height="229" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
