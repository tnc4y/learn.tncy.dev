<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 275" width="660" height="275" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="274" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">CMOS Güç Tüketimi Bileşenleri (P_total = P_dyn + P_sc + P_stat)</text>
<g transform="translate(30, 45)">
  <!-- 1. Dynamic Power -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="95" y="25" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">1. Dinamik Güç (P_dyn)</text>
    <rect x="15" y="45" width="160" height="40" rx="4" fill="#ffffff" stroke="#93c5fd"/>
    <text x="95" y="70" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">P_dyn = α · C_L · V_DD² · f</text>
    <text x="95" y="115" font-size="10" fill="#334155" text-anchor="middle">Yük sığasının şarj ve deşarj</text>
    <text x="95" y="132" font-size="10" fill="#334155" text-anchor="middle">olmasıyla harcanır.</text>
    <text x="95" y="165" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Payı: %60 - %80</text>
    <text x="95" y="185" font-size="9" fill="#64748b" text-anchor="middle">(V_DD düşürmek karesel kazanç)</text>
  </g>

  <!-- 2. Short Circuit Power -->
  <g transform="translate(205, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/>
    <text x="95" y="25" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">2. Kısa Devre (P_sc)</text>
    <rect x="15" y="45" width="160" height="40" rx="4" fill="#ffffff" stroke="#fde047"/>
    <text x="95" y="70" font-size="11" font-weight="bold" fill="#713f12" text-anchor="middle">P_sc = I_peak · t_sc · V_DD · f</text>
    <text x="95" y="115" font-size="10" fill="#334155" text-anchor="middle">0 → 1 veya 1 → 0 geçişinde</text>
    <text x="95" y="132" font-size="10" fill="#334155" text-anchor="middle">PMOS ve NMOS aynı anda iletir.</text>
    <text x="95" y="165" font-size="11" font-weight="bold" fill="#854d0e" text-anchor="middle">Payı: %5 - %15</text>
    <text x="95" y="185" font-size="9" fill="#64748b" text-anchor="middle">(Giriş eğim süresine bağlı)</text>
  </g>

  <!-- 3. Static Leakage Power -->
  <g transform="translate(410, 0)">
    <rect x="0" y="0" width="190" height="210" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="95" y="25" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">3. Statik Sızıntı (P_stat)</text>
    <rect x="15" y="45" width="160" height="40" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="95" y="70" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">P_stat = I_leak · V_DD</text>
    <text x="95" y="115" font-size="10" fill="#334155" text-anchor="middle">Devre beklemedeyken (idle)</text>
    <text x="95" y="132" font-size="10" fill="#334155" text-anchor="middle">akan kaçak akımlardır.</text>
    <text x="95" y="165" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">Payı: %15 - %40</text>
    <text x="95" y="185" font-size="9" fill="#64748b" text-anchor="middle">(Nanometrik düğümlerde kritik)</text>
  </g>
</g>

</svg>