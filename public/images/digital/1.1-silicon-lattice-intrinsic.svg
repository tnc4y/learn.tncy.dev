<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 335" width="660" height="335" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="334" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="30" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Saf Silisyum Kristal Kafesi (İntrinsik Yarıiletken &amp; Kovalent Bağlar)</text>
<!-- Grid of Si atoms -->
<g transform="translate(60, 55)">
  <!-- Bonds (lines) -->
  <line x1="80" y1="80" x2="240" y2="80" stroke="#94a3b8" stroke-width="4"/>
  <line x1="240" y1="80" x2="400" y2="80" stroke="#94a3b8" stroke-width="4"/>
  <line x1="80" y1="180" x2="240" y2="180" stroke="#94a3b8" stroke-width="4"/>
  <line x1="240" y1="180" x2="400" y2="180" stroke="#94a3b8" stroke-width="4"/>
  
  <line x1="80" y1="80" x2="80" y2="180" stroke="#94a3b8" stroke-width="4"/>
  <line x1="240" y1="80" x2="240" y2="180" stroke="#94a3b8" stroke-width="4"/>
  <line x1="400" y1="80" x2="400" y2="180" stroke="#94a3b8" stroke-width="4"/>

  <!-- Atoms -->
  <circle cx="80" cy="80" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="80" y="85" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">Si (+4)</text>

  <circle cx="240" cy="80" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="240" y="85" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">Si (+4)</text>

  <circle cx="400" cy="80" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="400" y="85" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">Si (+4)</text>

  <circle cx="80" cy="180" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="80" y="185" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">Si (+4)</text>

  <!-- Broken bond at 240, 180 -->
  <circle cx="240" cy="180" r="28" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="240" y="185" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">Si (+4)</text>

  <circle cx="400" cy="180" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
  <text x="400" y="185" font-size="13" font-weight="bold" fill="#0369a1" text-anchor="middle">Si (+4)</text>

  <!-- Free electron excited -->
  <circle cx="320" cy="140" r="10" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="320" y="144" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">e⁻</text>
  <path d="M 270 170 Q 300 150 310 142" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-red)"/>
  <text x="340" y="130" font-size="11" font-weight="bold" fill="#b91c1c">Serbest Elektron</text>

  <!-- Hole left behind -->
  <circle cx="270" cy="180" r="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="270" y="205" font-size="11" font-weight="bold" fill="#d97706" text-anchor="middle">Deşik (h⁺)</text>
</g>
<!-- Info card at bottom -->
<rect x="40" y="275" width="580" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="330" y="295" font-size="11" fill="#334155" text-anchor="middle">Termal enerjiyle kovalent bağ kırıldığında bir serbest elektron (e⁻) ve bir deşik (h⁺) çifti doğar.</text>
<text x="330" y="310" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">İntrinsik Yarıiletken Denge Şartı: n = p = nᵢ ≈ 1.5 × 10¹⁰ cm⁻³ (300 K / Oda Sıcaklığı)</text>

</svg>