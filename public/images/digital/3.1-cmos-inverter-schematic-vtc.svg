<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 310" width="660" height="310" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="309" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">CMOS İnvertör Şeması ve Gerilim Geçiş Eğrisi (VTC)</text>
<g transform="translate(40, 45)">
  <!-- Left: Schematic -->
  <g transform="translate(20, 10)">
    <rect x="0" y="0" width="220" height="235" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="110" y="20" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Transistör Şeması</text>
    
    <!-- VDD rail -->
    <line x1="80" y1="35" x2="140" y2="35" stroke="#dc2626" stroke-width="3"/>
    <text x="110" y="30" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">V_DD</text>

    <!-- PMOS -->
    <rect x="85" y="55" width="50" height="40" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="110" y="78" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">PMOS</text>
    <circle cx="75" cy="75" r="4" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>

    <!-- Middle node (Out) -->
    <line x1="110" y1="35" x2="110" y2="55" stroke="#374151" stroke-width="2.5"/>
    <line x1="110" y1="95" x2="110" y2="135" stroke="#374151" stroke-width="2.5"/>
    
    <!-- NMOS -->
    <rect x="85" y="135" width="50" height="40" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="110" y="158" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">NMOS</text>

    <!-- VSS rail -->
    <line x1="110" y1="175" x2="110" y2="200" stroke="#374151" stroke-width="2.5"/>
    <line x1="80" y1="200" x2="140" y2="200" stroke="#374151" stroke-width="3"/>
    <text x="110" y="215" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">GND (V_SS)</text>

    <!-- Vin & Vout pins -->
    <line x1="20" y1="115" x2="70" y2="115" stroke="#2563eb" stroke-width="2.5"/>
    <line x1="70" y1="75" x2="70" y2="155" stroke="#2563eb" stroke-width="2.5"/>
    <text x="15" y="118" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="end">V_in</text>

    <line x1="110" y1="115" x2="190" y2="115" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="195" y="118" font-size="11" font-weight="bold" fill="#16a34a">V_out</text>
  </g>

  <!-- Right: VTC Curve -->
  <g transform="translate(290, 10)">
    <rect x="0" y="0" width="280" height="235" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="140" y="20" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">VTC Gerilim Geçiş Eğrisi</text>

    <!-- Axes -->
    <line x1="40" y1="200" x2="250" y2="200" stroke="#475569" stroke-width="2"/>
    <line x1="40" y1="200" x2="40" y2="35" stroke="#475569" stroke-width="2"/>
    <text x="245" y="215" font-size="10" fill="#334155">V_in</text>
    <text x="35" y="30" font-size="10" fill="#334155" text-anchor="middle">V_out</text>

    <!-- VTC S-curve -->
    <path d="M 40 45 L 90 45 Q 130 50 140 120 Q 150 195 200 198 L 240 198" fill="none" stroke="#2563eb" stroke-width="3"/>
    
    <!-- Critical points -->
    <circle cx="140" cy="120" r="4" fill="#dc2626"/>
    <text x="150" y="115" font-size="9" font-weight="bold" fill="#dc2626">V_M (Mantık Eşiği)</text>

    <text x="75" y="60" font-size="9" fill="#16a34a" font-weight="bold">V_OH</text>
    <text x="210" y="190" font-size="9" fill="#16a34a" font-weight="bold">V_OL</text>
    <text x="140" y="230" font-size="9" fill="#475569" text-anchor="middle">NM_L = V_IL - V_OL | NM_H = V_OH - V_IH</text>
  </g>
</g>

</svg>