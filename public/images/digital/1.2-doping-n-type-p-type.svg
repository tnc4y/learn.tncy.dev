<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 295" width="660" height="295" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="294" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Yarıiletken Katkılama (Doping): N-Tipi vs P-Tipi Kafes Yapısı</text>
<!-- Left: N-type -->
<g transform="translate(30, 45)">
  <rect x="0" y="0" width="285" height="235" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="142" y="24" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">N-Tipi Katkılama (Donör: Fosfor / P)</text>
  <!-- Lattice lines -->
  <line x1="50" y1="80" x2="142" y2="80" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="142" y1="80" x2="235" y2="80" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="142" y1="80" x2="142" y2="160" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Atoms -->
  <circle cx="50" cy="80" r="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="50" y="85" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">Si</text>
  <circle cx="235" cy="80" r="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="235" y="85" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">Si</text>
  <!-- Donor atom -->
  <circle cx="142" cy="80" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="142" y="85" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">P (+5)</text>
  <!-- 5th electron -->
  <circle cx="185" cy="115" r="9" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="185" y="119" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">e⁻</text>
  <path d="M 155 95 Q 175 105 180 110" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="142" y="185" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">5. Değerlik Elektronu Serbest Kalır</text>
  <text x="142" y="202" font-size="10" fill="#334155" text-anchor="middle">Çoğunluk: Elektronlar (n ≈ N_D)</text>
  <text x="142" y="218" font-size="10" fill="#64748b" text-anchor="middle">Azınlık: Deşikler (p = nᵢ² / N_D)</text>
</g>

<!-- Right: P-type -->
<g transform="translate(345, 45)">
  <rect x="0" y="0" width="285" height="235" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="142" y="24" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">P-Tipi Katkılama (Akseptör: Bor / B)</text>
  <!-- Lattice lines -->
  <line x1="50" y1="80" x2="142" y2="80" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="142" y1="80" x2="235" y2="80" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="142" y1="80" x2="142" y2="160" stroke="#cbd5e1" stroke-width="3"/>
  <!-- Atoms -->
  <circle cx="50" cy="80" r="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="50" y="85" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">Si</text>
  <circle cx="235" cy="80" r="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="235" y="85" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">Si</text>
  <!-- Acceptor atom -->
  <circle cx="142" cy="80" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="142" y="85" font-size="11" font-weight="bold" fill="#b91c1c" text-anchor="middle">B (+3)</text>
  <!-- Hole -->
  <circle cx="185" cy="115" r="9" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="185" y="119" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">h⁺</text>
  <path d="M 155 95 Q 175 105 180 110" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="142" y="185" font-size="11" font-weight="bold" fill="#991b1b" text-anchor="middle">1 Elektron Eksik → Deşik Oluşur</text>
  <text x="142" y="202" font-size="10" fill="#334155" text-anchor="middle">Çoğunluk: Deşikler (p ≈ N_A)</text>
  <text x="142" y="218" font-size="10" fill="#64748b" text-anchor="middle">Azınlık: Elektronlar (n = nᵢ² / N_A)</text>
</g>

</svg>