<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 260" width="660" height="260" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="259" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Taşıyıcı Yoğunluğu vs Sıcaklık ve Fermi Seviyesi (E_F)</text>
<g transform="translate(60, 45)">
  <!-- Left: ni(T) curve -->
  <line x1="30" y1="180" x2="270" y2="180" stroke="#64748b" stroke-width="2"/>
  <line x1="30" y1="180" x2="30" y2="20" stroke="#64748b" stroke-width="2"/>
  <text x="150" y="200" font-size="10" fill="#475569" text-anchor="middle">Sıcaklık T (Kelvin)</text>
  <text x="15" y="15" font-size="10" fill="#475569" text-anchor="middle">ln(n)</text>
  
  <!-- Curve stages -->
  <path d="M 35 160 Q 60 130 90 90 L 190 90 Q 230 70 265 25" fill="none" stroke="#2563eb" stroke-width="3"/>
  
  <!-- Labels for regimes -->
  <text x="70" y="145" font-size="9" fill="#dc2626" font-weight="bold">İyonlaşma</text>
  <text x="140" y="80" font-size="10" fill="#16a34a" font-weight="bold">Ekstrinsik (Çalışma)</text>
  <text x="140" y="105" font-size="9" fill="#64748b">n ≈ N_D = sabit</text>
  <text x="240" y="50" font-size="9" fill="#b45309" font-weight="bold">İntrinsik Rejim</text>
  <text x="240" y="65" font-size="8" fill="#64748b">nᵢ(T) baskın çıkar</text>

  <!-- Right: Energy Band Diagram -->
  <g transform="translate(320, 10)">
    <rect x="0" y="0" width="220" height="175" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="110" y="20" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Enerji Bant Diyagramı</text>
    
    <!-- Conduction Band -->
    <rect x="20" y="35" width="180" height="25" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="110" y="52" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">İletim Bandı (E_C)</text>

    <!-- Bandgap Eg -->
    <line x1="110" y1="65" x2="110" y2="125" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="135" y="98" font-size="10" font-weight="bold" fill="#b91c1c">E_g = 1.12 eV</text>

    <!-- Fermi level Ef -->
    <line x1="20" y1="80" x2="200" y2="80" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="60" y="75" font-size="9" font-weight="bold" fill="#dc2626">Fermi E_F (N-tipi)</text>

    <!-- Valence Band -->
    <rect x="20" y="130" width="180" height="25" fill="#fee2e2" stroke="#ef4444"/>
    <text x="110" y="147" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">Valans Bandı (E_V)</text>
  </g>
</g>

</svg>