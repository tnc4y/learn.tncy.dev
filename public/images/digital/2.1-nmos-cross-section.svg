<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 660 285" width="660" height="285" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
  </marker>
  <marker id="arrow-dark" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#374151"/>
  </marker>
</defs>
<rect x="0.5" y="0.5" width="659" height="284" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

<text x="330" y="28" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">NMOS Transistör Anatomisi ve Kesit Yapısı (Cross-Section)</text>
<g transform="translate(60, 45)">
  <!-- P-Substrate -->
  <rect x="0" y="80" width="540" height="140" fill="#fee2e2" stroke="#f87171" stroke-width="2"/>
  <text x="270" y="180" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">P-Tipi Taban (P-Substrate / Gövde-Body)</text>

  <!-- Source n+ -->
  <rect x="50" y="80" width="100" height="60" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="100" y="115" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Kaynak (n⁺)</text>
  <text x="100" y="130" font-size="10" fill="#166534" text-anchor="middle">Source</text>

  <!-- Drain n+ -->
  <rect x="390" y="80" width="100" height="60" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="440" y="115" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Savak (n⁺)</text>
  <text x="440" y="130" font-size="10" fill="#166534" text-anchor="middle">Drain</text>

  <!-- Inversion Channel -->
  <rect x="150" y="80" width="240" height="15" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="270" y="92" font-size="10" font-weight="bold" fill="#854d0e" text-anchor="middle">İletim Kanalı (Elektron Terslenmesi e⁻ e⁻ e⁻)</text>

  <!-- Gate Oxide SiO2 -->
  <rect x="170" y="65" width="200" height="15" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="270" y="76" font-size="9" font-weight="bold" fill="#475569" text-anchor="middle">Kapı Oksiti (SiO₂ t_ox ~ 1-2 nm)</text>

  <!-- Polysilicon / Metal Gate -->
  <rect x="170" y="20" width="200" height="45" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="270" y="47" font-size="13" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Kapı (Gate / Polysilicon)</text>

  <!-- Contacts and labels -->
  <!-- Source Terminal -->
  <line x1="100" y1="80" x2="100" y2="10" stroke="#374151" stroke-width="3"/>
  <circle cx="100" cy="10" r="5" fill="#374151"/>
  <text x="100" y="0" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">S (Kaynak)</text>

  <!-- Gate Terminal -->
  <line x1="270" y1="20" x2="270" y2="0" stroke="#374151" stroke-width="3"/>
  <circle cx="270" cy="0" r="5" fill="#374151"/>
  <text x="270" y="-8" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">G (Kapı)</text>

  <!-- Drain Terminal -->
  <line x1="440" y1="80" x2="440" y2="10" stroke="#374151" stroke-width="3"/>
  <circle cx="440" cy="10" r="5" fill="#374151"/>
  <text x="440" y="0" font-size="11" font-weight="bold" fill="#111827" text-anchor="middle">D (Savak)</text>

  <!-- Channel Length Dimension -->
  <line x1="150" y1="105" x2="390" y2="105" stroke="#3b82f6" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="270" y="120" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Kanal Uzunluğu (L)</text>
</g>

</svg>